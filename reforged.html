<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inequality Quest: Fractured Kingdom</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Unbounded:wght@500;700;900&display=swap');
:root{--bg:#09131e;--card:#132337;--edge:#34506a;--gold:#ffc96a;--mint:#70e3c3;--red:#ff8186;--txt:#eff6fd;--muted:#b2c6d9}*{box-sizing:border-box}body{margin:0;color:var(--txt);font-family:'DM Sans',sans-serif;background:radial-gradient(circle at 70% 0,#274464 0,transparent 40%),linear-gradient(145deg,#07121c,#111d31);min-height:100vh}button{font:inherit;cursor:pointer}.top{max-width:1120px;margin:auto;padding:22px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{color:var(--gold);font:900 16px Unbounded,sans-serif;letter-spacing:.05em}.pill{border:1px solid var(--edge);border-radius:30px;padding:9px 13px;color:var(--muted);background:#15273b}.wrap{max-width:1120px;margin:0 auto;padding:12px 24px 70px}.hero{padding:40px;border:1px solid #476c89;border-radius:27px;background:linear-gradient(115deg,#203d56,#132238 58%,#273045);box-shadow:0 24px 70px #0006;position:relative;overflow:hidden}.hero:after{content:'♜';position:absolute;right:30px;top:0;font-size:220px;opacity:.09;pointer-events:none}h1,h2,h3{font-family:Unbounded,sans-serif;line-height:1.25}h1{font-size:clamp(2rem,5vw,3.6rem);max-width:760px;margin:12px 0}h2{font-size:clamp(1.25rem,3vw,2rem)}h3{font-size:1rem}p{line-height:1.65;color:var(--muted)}.eyebrow{color:var(--mint);letter-spacing:.18em;font-weight:800;font-size:.77rem;text-transform:uppercase}.btn{border:0;border-radius:12px;padding:14px 19px;font-weight:800;background:var(--gold);color:#162335}.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}.btn.ghost{background:#243d52;color:var(--txt);border:1px solid #47647d}.stack{display:flex;gap:10px;flex-wrap:wrap;margin-top:25px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.card{background:#14273a;border:1px solid #35556d;border-radius:18px;padding:22px}.choice{text-align:left;color:var(--txt);width:100%;display:block;background:#172b40;border:1px solid #3b5c73;border-radius:15px;padding:19px;transition:.15s}.choice:hover,.choice:focus-visible{border-color:var(--gold);background:#264159;outline:2px solid transparent}.choice strong{display:block;font-size:1rem;color:#fff;margin-bottom:7px}.choice small{display:block;color:var(--muted);line-height:1.5;font-size:.9rem}.choices{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin:24px 0}.meter{background:#26394d;border-radius:50px;height:9px;overflow:hidden;margin:9px 0 4px}.fill{height:100%;background:linear-gradient(90deg,#52b6d7,#72e5ba);transition:width .45s}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.stat{background:#0e2133;border:1px solid #38566f;padding:14px;border-radius:12px}.stat b{font:800 1.55rem Unbounded,sans-serif;color:var(--gold)}.stat span{display:block;color:var(--muted);font-size:.81rem;margin-top:4px}.note{border-left:4px solid var(--mint);background:#142e40;padding:17px 20px;border-radius:0 12px 12px 0;margin:18px 0;color:#e2eff9;line-height:1.6}.danger{border-color:var(--red)}.progress{display:flex;align-items:center;gap:14px;margin:22px 0;color:var(--muted);font-size:.9rem}.progress .meter{flex:1}.tag{font-weight:800;color:var(--gold);font-size:.8rem;letter-spacing:.09em;text-transform:uppercase}textarea,input{background:#0d1e2d;color:#fff;border:1px solid #4b6881;border-radius:10px;padding:13px;font:inherit;width:100%}textarea{min-height:100px;resize:vertical}label{display:block;color:var(--muted);margin:12px 0 8px;font-weight:700}.hidden{display:none!important}.log{max-height:280px;overflow:auto;border-top:1px solid var(--edge);padding-top:8px}.log p{border-bottom:1px solid #2c4961;margin:0;padding:9px 0}.muted{color:var(--muted)}.endstats{margin:16px 0}.footer{font-size:.8rem;color:#8eacc3;text-align:center;padding:25px}@media(max-width:700px){.grid,.choices{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.hero{padding:24px}.top{padding:14px}.wrap{padding:10px 14px 30px}}
</style></head><body>
<header class="top"><div class="logo">⚔ INEQUALITY QUEST <span style="color:#84a5bc">/ REFORGED</span></div><button class="pill" id="reset">↺ Start over</button></header>
<main class="wrap"><div id="app"></div></main><footer class="footer">A fictional society simulation. Outcomes illustrate systems and trade-offs, not predictions about individuals.</footer>
<script>
const missions=[
{title:"The Scholarship Trap",place:"THE ACADEMY",lead:"Two students earned identical entrance scores. One has a parent who can pay for tutoring and housing. The other supports siblings and must work evenings. The scholarship committee asks you to rewrite its rules.",choices:[
{label:"Merit only",desc:"Award funds using test scores alone. Easy to explain, but ignores differences in preparation.",delta:[0,2,1,-2],out:"The ranking looks neutral. Students with time, tutoring, and stable housing keep an advantage.",concept:"Meritocracy can reward achievement while overlooking unequal starting conditions.",q:"Which idea best explains why a neutral-looking rule can produce unequal outcomes?",a:["Individual effort always decides success","A rule can reflect unequal access to resources","The students had different scores"],correct:1},
{label:"Needs and merit",desc:"Consider scores, financial need, and caregiving responsibilities. This costs more to administer.",delta:[-2,3,1,4],out:"More students can enroll, although the process needs careful oversight and consistent criteria.",concept:"Equity aims to address different barriers, rather than giving everyone identical support.",q:"Which sociological concept best describes this approach?",a:["Equity","Ascribed status","Social closure"],correct:0},
{label:"Equal grants",desc:"Give everyone the same amount, regardless of circumstances.",delta:[-3,2,2,1],out:"Every student receives support, but the award covers a smaller share of costs for those with the greatest needs.",concept:"Equality of treatment is not necessarily equality of opportunity.",q:"Why might equal grants still produce unequal access?",a:["Everyone values education differently","Some students have greater costs and fewer resources","Grants always lower graduation rates"],correct:1}]},
{title:"The Inherited City",place:"THE HOUSING DISTRICT",lead:"A new transit line will raise property values. Homeowners expect wealth gains; renters fear rising rent. You have one budget and must choose a policy before construction begins.",choices:[
{label:"Build without protections",desc:"Fast growth and higher tax revenue, but rising displacement risk.",delta:[4,0,2,-5],out:"Property values rise. Many renters can no longer afford to live near the new line.",concept:"Wealth accumulation and housing markets can reproduce class advantages across generations.",q:"What is the best term for an advantage passed through family property?",a:["Intergenerational wealth","Role conflict","Cultural diffusion"],correct:0},
{label:"Rent stabilization + transit",desc:"Protect many current renters while funding construction. Implementation is complicated.",delta:[-3,2,1,4],out:"Fewer residents are displaced. The city must monitor housing supply and unintended effects.",concept:"Institutions and policies can change who benefits from economic development.",q:"What is the key sociological question here?",a:["Whether housing policy changes access to opportunity","Whether all residents like trains","Whether wealthy people always act unfairly"],correct:0},
{label:"Relocation support",desc:"Help displaced residents move, but do not slow redevelopment.",delta:[-2,1,2,0],out:"Families receive short-term assistance, but some lose nearby jobs and social networks.",concept:"Social capital includes relationships and networks that can be lost through displacement.",q:"Which resource may be weakened when a family must leave its community?",a:["Ascribed status","Social capital","Formal authority"],correct:1}]},
{title:"A Fair Hiring Test?",place:"THE GUILD HALL",lead:"A large employer uses referrals to fill most jobs. Managers say this rewards trust. Applicants outside established networks rarely hear about openings.",choices:[
{label:"Keep referrals",desc:"Hiring stays cheap and fast, though informal networks keep shaping access.",delta:[3,0,2,-4],out:"The employer saves time. Workers without insider connections remain underrepresented.",concept:"Social closure occurs when groups restrict access to valuable opportunities.",q:"What mechanism is most visible in this hiring practice?",a:["Social closure","Upward mobility for everyone","Random selection"],correct:0},
{label:"Public postings + structured interviews",desc:"Expand access and make criteria consistent. This takes staff time.",delta:[-2,3,1,4],out:"The applicant pool broadens. The employer can better compare candidates against job requirements.",concept:"Institutional practices can produce unequal opportunities even without an openly discriminatory rule.",q:"Why can changing a hiring process affect inequality?",a:["Institutions control pathways to opportunities","All applicants have identical experiences","Networks never matter"],correct:0},
{label:"Blind résumé review only",desc:"Hide names in initial screening, but leave referrals and interviews unchanged.",delta:[-1,2,2,1],out:"Initial screening changes, yet insiders still hear about jobs first.",concept:"A single intervention may not address multiple barriers in a system.",q:"Which barrier remains?",a:["Access to information about job openings","The number of letters in a name","The need for all jobs"],correct:0}]},
{title:"The Hospital Choice",place:"THE HEALTH QUARTER",lead:"Two neighborhoods share one public health budget. One is wealthier and already has clinics. The other has higher asthma rates, older housing, and fewer nearby doctors.",choices:[
{label:"Split the money evenly",desc:"Give each neighborhood the same funding.",delta:[-1,2,3,-1],out:"Both neighborhoods receive funding, but the community with fewer services remains further behind.",concept:"Equal investment can leave unequal outcomes when needs differ.",q:"What is the main difference between equality and equity?",a:["Equality considers need; equity never does","Equality gives equal amounts; equity considers unequal barriers","They are always identical"],correct:1},
{label:"Target the highest barriers",desc:"Fund clinics, clean-air programs, and transport where unmet need is greatest.",delta:[-4,4,0,5],out:"Health access improves most where barriers were greatest. Other residents question the distribution.",concept:"Social determinants of health include housing, environment, income, and service access.",q:"Which is a social determinant of health?",a:["Neighborhood air quality","Blood type alone","A person's favorite subject"],correct:0},
{label:"Give tax credits for private care",desc:"Encourage families to purchase services.",delta:[2,1,2,-3],out:"Households with enough income to pay upfront benefit most; families with tight budgets struggle.",concept:"Policies may disproportionately benefit people who already have the resources to use them.",q:"What limits the reach of these credits?",a:["Ability to pay upfront and access care","All clinics are identical","Healthcare has no social causes"],correct:0}]},
{title:"The Crisis Vote",place:"THE ROYAL COUNCIL",lead:"A recession hits. Jobs disappear, government revenue falls, and families need help. Powerful business owners want tax relief; workers want employment support. You cannot fund every option.",choices:[
{label:"Cut taxes for investors",desc:"Keep more private capital available, but shrink immediate relief funds.",delta:[4,0,3,-4],out:"Investment may increase later, but many unemployed families face immediate hardship.",concept:"Conflict theory asks how unequal power shapes who gains from rules and institutions.",q:"Which theory focuses most on competition over scarce resources and power?",a:["Conflict theory","Symbolic interactionism","Biological determinism"],correct:0},
{label:"Jobs guarantee pilot",desc:"Provide temporary jobs and training. Requires large short-term spending.",delta:[-5,4,0,5],out:"More families gain income and experience. The council must fund and evaluate the program.",concept:"Social mobility depends on access to institutional pathways, not only motivation.",q:"Which outcome best demonstrates upward social mobility?",a:["A worker gains a stable, better-paying role","A worker changes hobbies","A family moves to a different street"],correct:0},
{label:"Emergency cash support",desc:"Prevent immediate hardship, with less direct investment in future job openings.",delta:[-4,3,2,3],out:"Families can cover urgent expenses, but unemployment remains a long-term challenge.",concept:"Short-term relief and structural changes address different dimensions of inequality.",q:"Why might emergency relief be insufficient by itself?",a:["It cannot change long-term job access on its own","It always eliminates poverty permanently","It makes education unnecessary"],correct:0}]}
];
const starting={name:"",role:0,step:0,phase:"start",stats:[12,6,6,5],xp:0,records:[],selected:null,answered:false,feedback:""};
let s;try{s=JSON.parse(localStorage.getItem("ineq-v2"))}catch(e){}if(!s||!Array.isArray(s.stats))s=structuredClone(starting);
const roles=[{name:"The Heir",desc:"You inherited wealth and connections. Your choices still affect everyone.",bonus:[5,0,2,-1]},{name:"The Organizer",desc:"You know the city's communities. You begin with trust, but limited funding.",bonus:[-2,2,1,3]},{name:"The Official",desc:"You control public decisions, but the council expects results.",bonus:[1,1,3,0]}];
const names=["Treasury","Opportunity","Influence","Public trust"];const app=document.getElementById("app");
function save(){localStorage.setItem("ineq-v2",JSON.stringify(s))}
function esc(t){return String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function stats(){return '<div class="stats">'+s.stats.map((n,i)=>'<div class="stat"><b>'+n+'</b><span>'+names[i]+'</span></div>').join('')+'</div>'}
function buttons(items){return '<div class="choices">'+items.map((a,i)=>'<button class="choice" data-pick="'+i+'"><strong>'+esc(a.label)+'</strong><small>'+esc(a.desc)+'</small></button>').join('')+'</div>'}
function progress(){return '<div class="progress">MISSION '+Math.min(s.step+1,5)+' OF 5 <div class="meter"><div class="fill" style="width:'+(s.step/5*100)+'%"></div></div> '+s.xp+' XP</div>'}
function render(){
if(s.phase==="start"){app.innerHTML='<section class="hero"><div class="eyebrow">Sociology • Strategy • Consequences</div><h1>THE FRACTURED KINGDOM</h1><p>Five districts. Unequal starting points. One council. In this decision-based game, you will control resources, face trade-offs, and discover how institutions shape people\'s chances. Not every choice has a perfect outcome.</p><div class="stack"><button class="btn" id="begin">Enter the kingdom →</button></div></section><section style="margin-top:25px" class="grid"><div class="card"><h3>🎮 How to play</h3><p>Choose a role, make policy decisions, answer sociology challenges, and watch your four resources change. Every decision affects the kingdom.</p></div><div class="card"><h3>🧠 Your mission</h3><p>Use evidence and sociological concepts—not just good intentions—to explain the consequences of unequal opportunities.</p></div></section>';document.getElementById("begin").onclick=()=>{s.phase="role";save();render()};return}
if(s.phase==="role"){app.innerHTML='<div class="eyebrow">Chapter 0 / Choose your power</div><h2>Who will you be?</h2><p>Each role gives you different starting resources. There is no automatically best character.</p>'+buttons(roles.map(x=>({label:x.name,desc:x.desc})))+'<p class="muted">Progress saves automatically on this browser.</p>';app.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{let i=+b.dataset.pick;s.role=i;s.stats=starting.stats.map((v,j)=>v+roles[i].bonus[j]);s.phase="choice";save();render()});return}
if(s.phase==="end"){const best=s.stats[3]>=12?"The Bridge Builder":s.stats[0]>=13?"The Prosperous Strategist":"The Crisis Navigator";app.innerHTML='<div class="hero"><div class="eyebrow">Campaign completed • '+s.xp+' XP</div><h1>'+best+'</h1><p>You completed all five districts. Compare your resources with the people whose opportunities your policies shaped.</p>'+stats()+'<div class="stack"><button class="btn" id="report">Download decision report</button><button class="btn ghost" id="again">Play again</button></div></div><div class="card" style="margin-top:20px"><h3>Debrief: Was the kingdom fairer?</h3><p>Pick one decision you would change. Explain who benefited, who faced a barrier, and what a sociologist would examine next.</p><div class="log">'+s.records.map((r,i)=>'<p><b>'+esc(missions[i].title)+'</b> — '+esc(r.choice)+'<br>'+esc(r.result)+'</p>').join('')+'</div></div>';document.getElementById("again").onclick=reset;document.getElementById("report").onclick=report;return}
const m=missions[s.step];let html=progress()+stats()+'<section class="card"><div class="eyebrow">'+esc(m.place)+'</div><h2>'+esc(m.title)+'</h2><p style="font-size:1.1rem;color:#e7eff8">'+esc(m.lead)+'</p>';
if(s.phase==="choice"){html+='<div class="tag">Choose your policy</div>'+buttons(m.choices)}
else if(s.phase==="quiz"){let c=m.choices[s.selected];html+='<div class="note"><b>Consequence:</b> '+esc(c.out)+'<br><br><b>Sociology connection:</b> '+esc(c.concept)+'</div><div class="tag">Knowledge challenge • +20 XP for a correct answer</div><h3>'+esc(c.q)+'</h3><div class="choices">'+c.a.map((a,i)=>'<button class="choice" data-answer="'+i+'"><strong>'+esc(a)+'</strong></button>').join('')+'</div>'}
else if(s.phase==="result"){html+='<div class="note '+(s.answered?"":"danger")+'"><b>'+(s.answered?"Correct. +20 XP":"Not quite. Learn from the evidence.")+'</b><br>'+esc(s.feedback)+'</div><div class="tag">A harder question</div><h3>Who benefits most from your policy—and who still faces barriers?</h3><label for="reason">Your evidence-based explanation (at least 20 characters)</label><textarea id="reason" placeholder="One group benefits because... Another group may still face...">'+esc(s.draft||"")+'</textarea><div class="stack"><button id="next" class="btn">Complete mission →</button></div><p id="err" class="muted"></p>'}
html+='</section>';app.innerHTML=html;
app.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{let i=+b.dataset.pick;s.selected=i;let c=m.choices[i];s.stats=s.stats.map((v,j)=>Math.max(0,v+c.delta[j]));s.phase="quiz";save();render()});
app.querySelectorAll("[data-answer]").forEach(b=>b.onclick=()=>{const c=m.choices[s.selected];s.answered=+b.dataset.answer===c.correct;s.feedback=c.a[c.correct]+" — "+c.concept;if(s.answered)s.xp+=20;s.phase="result";save();render()});
let next=document.getElementById("next");if(next)next.onclick=()=>{const t=document.getElementById("reason").value.trim();if(t.length<20){document.getElementById("err").textContent="Add one or two clear sentences before continuing.";return}let c=m.choices[s.selected];s.records.push({choice:c.label,result:c.out,reason:t,correct:s.answered});s.xp+=30;s.step++;s.phase=s.step>=missions.length?"end":"choice";s.selected=null;s.draft="";save();render()};let area=document.getElementById("reason");if(area)area.oninput=()=>{s.draft=area.value;save()};
}
function report(){const output=["INEQUALITY QUEST — DECISION REPORT","Role: "+roles[s.role].name,"XP: "+s.xp,"Resources: "+names.map((x,i)=>x+" "+s.stats[i]).join(", "),...s.records.flatMap((r,i)=>["",missions[i].title,"Decision: "+r.choice,"Consequence: "+r.result,"Sociology challenge correct: "+(r.correct?"Yes":"No"),"Explanation: "+r.reason])].join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([output],{type:"text/plain"}));a.download="inequality-quest-report.txt";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function reset(){if(confirm("Erase this game progress and start again?")){s=structuredClone(starting);save();render()}}document.getElementById("reset").onclick=reset;render();
</script></body></html>
