<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Government Arcade | Civics Friday 2</title><style>
:root{font-family:Arial,system-ui,sans-serif;color:#f5f7ff;background:#081324}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#183e68,#081324 65%)}button{font:inherit;cursor:pointer}#app{max-width:1100px;margin:auto;padding:23px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:clamp(32px,5vw,58px);margin:12px 0 4px}h2{font-size:clamp(27px,3.4vw,42px);margin:7px 0 14px}.sub{color:#bed1e9;font-size:18px}.hud{display:flex;gap:10px;flex-wrap:wrap;margin:17px 0}.chip{background:#173354;border:1px solid #5485b5;padding:11px 15px;border-radius:12px;font-weight:900}.board{background:#11223b;border:2px solid #426b99;border-radius:20px;padding:25px;min-height:450px;box-shadow:0 16px 55px #0005}.story{font-size:clamp(19px,2.3vw,27px);line-height:1.4;max-width:880px;color:#ebf4ff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin:24px 0}.card,.opt{border:2px solid #658cb9;border-radius:14px;padding:20px;background:#203f65;color:#fff;font-weight:850;font-size:clamp(19px,2.05vw,25px);min-height:95px;transition:transform .15s,background .15s}.card:hover,.opt:hover{background:#315a89;transform:translateY(-2px)}.opt:disabled{opacity:.45;cursor:default}.row{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0}.row .opt{flex:1 1 180px}.primary{background:#ffc75f;color:#12203a;border:0;border-radius:11px;padding:16px 25px;font-weight:950;font-size:21px}.small{background:#29405f;color:#fff;border:1px solid #93aacb;border-radius:10px;padding:9px 14px}.progress{height:12px;background:#253f60;border-radius:10px;overflow:hidden;margin:15px 0}.progress>div{height:100%;background:#ffca72;transition:width .3s}.feedback{background:#1d3b51;border-left:6px solid #ffd06e;padding:17px;font-size:19px;margin:16px 0;font-weight:800;line-height:1.35}.correct{border-color:#6cf4ab!important;background:#14563f!important}.wrong{border-color:#ff8b8b!important;background:#64273e!important}.muted{color: </style></head><body><div id="app"></div><script>
const stages=[
{title:"POWER SORTER",icon:"⚖️",intro:"The government files are scrambled. Send each job to the correct branch. You have to think about WHO does the job—not just the word you recognize.",kind:"sort",items:[

{title:"BUILD CONGRESS",icon:"🏛️",intro:"The chambers have lost their records. Rebuild the House and Senate. Choose the correct number or rule for every slot.",kind:"rebuild",items:[

["A criminal defendant asks for legal protections during a trial.","Bill of Rights","Several Bill of Rights amendments protect people accused of crimes.",["Mayflower Compact","Bill of Rights","Electoral College"]],

let state={stage:0,item:0,score:0,miss:0,streak:0,finished:false,log:[]};try{const saved=JSON.parse(localStorage.getItem('governmentArcade2'));if(saved&&saved.stage<=stages.length)state={...state,...saved}}catch(e){}
const app=document.getElementById('app');const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');function save(){localStorage.setItem('governmentArcade2',JSON.stringify(state))}function go(){save();draw()}function answer(x){const s=stages[state.stage],q=s.items[state.item],correct=s.kind==='sort'?q[1]:q[1],yes=x===correct;if(yes){state.score+=100+Math.min(state.streak,5)*20;state.streak++}else{state.miss++;state.streak=0}state.log.push({stage:state.stage,question:q[0],right:yes});state.feedback={yes,correct,why:q[2]};save();draw()}function next(){state.feedback=null;state.item++;if(state.item>=stages[state.stage].items.length){state.stage++;state.item=0}if(state.stage>=stages.length)state.finished=true;go()}function restart(){if(!confirm('Restart Day 2 from the beginning?'))return;state={stage:0,item:0,score:0,miss:0,streak:0,finished:false,log:[]};go()}function buttons(options){return options.map(o=>'<button class="opt" onclick="answer('+JSON.stringify(o).replace(/"/g,'&quot;')+')" '+(state.feedback?'disabled':'')+'>'+esc(o)+'</button>').join('')}function intro(){app.innerHTML='<header><span class="tag">FRIDAY 2 · CIVICS CHALLENGE</span><button class="small" onclick="restart()">↻ Restart</button></header><h1>GOVERNMENT ARCADE</h1><p class="sub">Five game zones. Three branches. One government to save.</p><div class="board"><div class="icon">🎮</div><h2>THE GOVERNMENT HAS GLITCHED</h2><p class="story">Files are mixed up, Congress has lost its seats, and the president keeps getting the wrong orders. Fix each zone and collect points. Wrong answers teach you the rule—but they cost your streak.</p><div class="stats"><div class="stat"><span>MISSIONS</span>5</div><div class="stat"><span>CHALLENGES</span>48</div></div><button class="primary" onclick="state.started=true;go()">START THE ARCADE →</button></div>'}function draw(){if(!state.started)return intro();if(state.finished){let total=stages.reduce((n,s)=>n+s.items.length,0),correct=state.log.filter(x=>x.right).length;app.innerHTML='<header><span class="tag">MISSION COMPLETE</span><button class="small" onclick="restart()">↻ New Run</button></header><h1>GOVERNMENT RESTORED!</h1><div class="board"><div class="icon">🏆</div><h2>YOU BEAT THE ARCADE</h2><div class="stats"><div class="stat"><span>FINAL SCORE</span>'+state.score+'</div><div class="stat"><span>FIRST-TRY ACCURACY</span>'+correct+' / '+total+'</div></div><p class="story">You practiced Congress, the president, federal courts, and checks and balances. Review any powers you missed before the official civics test.</p><button class="primary" onclick="restart()">PLAY AGAIN FOR A HIGHER SCORE</button></div>';return}let s=stages[state.stage],q=s.items[state.item],total=s.items.length,opts=s.kind==='sort'?s.options:q[3],fb=state.feedback;app.innerHTML='<header><span class="tag">GOVERNMENT ARCADE</span><button class="small" onclick="restart()">↻ Restart</button></header><h1>'+s.icon+' '+esc(s.title)+'</h1><p class="sub">'+esc(s.intro)+'</p><div class="hud"><span class="chip">ZONE '+(state.stage+1)+' / '+stages.length+'</span><span class="chip">SCORE '+state.score+'</span><span class="chip">STREAK '+state.streak+' 🔥</span><span class="chip">MISTAKES '+state.miss+'</span></div><div class="progress"><div style="width:'+Math.round(state.item/total*100)+'%"></div></div><div class="board"><span class="counter">CHALLENGE '+(state.item+1)+' OF '+total+'</span><h2>'+esc(q[0])+'</h2><p class="muted">'+(s.kind==='sort'?'Send the power to its correct branch.':s.kind==='rebuild'?'Choose the correct congressional fact.':s.kind==='decisions'?'Make the constitutional decision.':s.kind==='cases'?'Identify the correct court or idea.':'Defeat this final civics check.')+'</p><div class="'+(s.kind==='sort'?'grid':'choice')+'">'+buttons(opts)+'</div>'+(fb?'<div class="feedback '+(fb.yes?'correct':'wrong')+'">'+(fb.yes?'✓ CORRECT! +POINTS':'✕ NOT QUITE. THE RIGHT ANSWER: '+esc(fb.correct))+'<p>'+esc(fb.why)+'</p></div><button class="primary" onclick="next()">'+(state.item===total-1?(state.stage===stages.length-1?'SEE RESULTS →':'NEXT ARCADE ZONE →'):'NEXT CHALLENGE →')+'</button>':'')+'</div><div class="footer"><span class="muted">Progress saves on this computer.</span><span class="muted">Learn the reason—not just the answer.</span></div>'}draw();
</script></body></html>
