<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Founders’ Defense: Save the Republic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<script src="../../shared/assignments.js?v=20261030c"></script>
<script src="../../shared/turnin.js?v=20261030c"></script>
<style>
:root{--ink:#1b2430;--muted:#5b6574;--bg:#eef1f6;--line:#d6dbe4;--navy:#1d3f73;--navy-d:#122b52;--gold:#e0a526;--gold-d:#b07f12;--gold-l:#fff4d6;--red:#c0392b;--red-d:#8e2a20;--red-l:#fde8e5;--green:#1f8a4c;--green-l:#e2f6ea;--paper:#fffaf0}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:"Nunito","Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.4;min-height:100vh;
 background-image:radial-gradient(circle at 15% 0%,#dde6f3 0,transparent 45%),radial-gradient(circle at 95% 100%,#f3e8cf 0,transparent 40%)}
.disp{font-family:"Lilita One","Arial Black",Arial,sans-serif;font-weight:400;letter-spacing:.4px}
button{font-family:inherit}
/* HUD */
.hud{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 14px;flex-wrap:wrap;box-shadow:0 3px 0 var(--navy-d)}
.hud .title{font-family:"Lilita One","Arial Black",Arial,sans-serif;font-size:1.2rem;margin-right:auto}
.stat{background:rgba(255,255,255,.13);border-radius:10px;padding:4px 10px;font-weight:800;font-size:.92rem;white-space:nowrap}
.hpbar{display:inline-block;width:120px;height:12px;background:rgba(255,255,255,.2);border-radius:6px;vertical-align:middle;margin-left:6px;overflow:hidden}
.hpbar div{height:100%;background:linear-gradient(90deg,#ff6b6b,#ffb36b);transition:width .4s}
.hpbar.ok div{background:linear-gradient(90deg,#3fcf7f,#a6e36b)}
.combo{background:var(--gold)!important;color:#3a2a00}
.hbtn{background:transparent;border:2px solid rgba(255,255,255,.45);color:#fff;border-radius:10px;padding:3px 9px;cursor:pointer;font-size:.85rem;font-weight:800}
main{max-width:1180px;margin:0 auto;padding:14px 12px 40px}
.panel{background:#fff;border-radius:18px;padding:22px;box-shadow:0 4px 0 #cfd5df,0 10px 30px rgba(20,40,80,.08)}
.btn{font-size:1.05rem;font-weight:800;padding:12px 22px;border-radius:14px;border:none;background:var(--gold);color:#3a2a00;cursor:pointer;min-height:50px;box-shadow:0 5px 0 var(--gold-d)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--gold-d)}
.btn.navy{background:var(--navy);color:#fff;box-shadow:0 5px 0 var(--navy-d)}
.btn.ghost{background:#fff;color:var(--navy);border:2px solid #cdd5e2;box-shadow:0 5px 0 #cdd5e2}
.btn.small{font-size:.9rem;padding:8px 14px;min-height:40px;box-shadow:0 4px 0 #cdd5e2}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:14px}
.muted{color:var(--muted)}.small{font-size:.9rem}
input[type=text]{font-family:inherit;font-size:1.1rem;padding:12px 14px;border:3px solid var(--line);border-radius:12px;width:100%;max-width:360px}
label{font-weight:800;display:block;margin:6px 0}
/* board */
.zoneLbl{font-family:"Lilita One","Arial Black",Arial,sans-serif;color:var(--navy);font-size:1.05rem;margin:4px 2px 8px;display:flex;align-items:center;gap:10px}
.zoneLbl .muted{font-family:"Nunito",sans-serif;font-weight:700;font-size:.88rem}
.track{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
.slot{min-height:210px;border:3px dashed #c9d1de;border-radius:18px;display:flex;align-items:center;justify-content:center;color:#9aa5b5;font-weight:800}
.crisis{display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;position:relative;background:#fff;border-radius:18px;border:3px solid #f0c9c4;box-shadow:0 5px 0 #e7b3ad;padding:0;cursor:pointer;text-align:left;color:var(--ink);transition:transform .12s, box-shadow .12s;overflow:hidden;animation:drop .4s ease-out}
@keyframes drop{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
.crisis .top{background:linear-gradient(135deg,#c0392b,#e0573f);color:#fff;padding:8px 12px;display:flex;align-items:center;gap:8px}
.crisis .top .nm{font-family:"Lilita One","Arial Black",Arial,sans-serif;font-size:1.05rem;line-height:1.15}
.crisis .body{padding:10px 12px 12px;font-weight:700;font-size:1rem}
.crisis .meta{display:flex;gap:8px;padding:0 12px 12px;flex-wrap:wrap}
.chip{font-size:.82rem;font-weight:900;border-radius:20px;padding:3px 10px;background:#f1f4f9;color:var(--ink)}
.chip.clock{background:#fff1d1;color:#7a5600}
.chip.clock.urgent{background:var(--red);color:#fff;animation:pulse .7s infinite alternate}
.chip.pow{background:var(--red-l);color:var(--red-d)}
.chip.hint{background:#e6eefa;color:var(--navy)}
@keyframes pulse{to{transform:scale(1.08)}}
.crisis.targetable{border-color:var(--gold);box-shadow:0 5px 0 var(--gold-d),0 0 0 5px rgba(224,165,38,.35)}
.crisis.targetable:hover{transform:translateY(-4px)}
.crisis.boss{border-color:#7d2a8c;box-shadow:0 5px 0 #571d61}
.crisis.boss .top{background:linear-gradient(135deg,#5a1f66,#8e3aa0)}
.phases{display:flex;gap:5px;padding:0 12px 10px}.phases span{flex:1;height:10px;border-radius:5px;background:#8e3aa0}.phases span.done{background:#e3d6e8}
.hinttxt{margin:0 12px 12px;background:#e6eefa;border-radius:10px;padding:8px 10px;font-size:.9rem;font-weight:700;color:var(--navy)}
.hand{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.card{display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;position:relative;background:#fff;border-radius:16px;border:3px solid var(--line);box-shadow:0 5px 0 #c6cedb;padding:0;cursor:pointer;text-align:left;color:var(--ink);overflow:hidden;transition:transform .12s,box-shadow .12s;animation:deal .35s ease-out}
@keyframes deal{from{transform:translateY(40px) rotate(4deg);opacity:0}to{transform:none;opacity:1}}
.card:hover{transform:translateY(-4px)}
.card.sel{transform:translateY(-12px);border-color:var(--navy);box-shadow:0 10px 0 var(--navy-d),0 0 0 5px rgba(29,63,115,.25)}
.card .art{height:92px;background:#dfe7f3;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card .art img{width:100%;height:100%;object-fit:cover;display:block}
.card .art svg{width:64px;height:64px}
.card .cname{font-weight:900;font-size:1rem;line-height:1.15;padding:8px 10px 2px}
.card .ctip{font-size:.8rem;color:var(--muted);font-weight:700;padding:0 10px 10px;line-height:1.25}
.card .ctype{position:absolute;top:6px;left:6px;font-size:.7rem;font-weight:900;background:rgba(255,255,255,.92);border-radius:8px;padding:2px 7px;color:var(--navy)}
.card.burn{animation:burn .5s forwards}
@keyframes burn{to{transform:scale(.6) rotate(-10deg);opacity:0;filter:grayscale(1)}}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0 4px}
.help{background:var(--gold-l);border:2px solid #f0d58d;border-radius:12px;padding:10px 14px;font-weight:700;margin-bottom:12px}
/* result sheet */
.sheetWrap{position:fixed;inset:0;background:rgba(15,25,45,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;padding:14px;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:#fff;border-radius:20px;max-width:720px;width:100%;padding:20px 22px;box-shadow:0 10px 40px rgba(0,0,0,.25);animation:up .3s ease-out;max-height:88vh;overflow:auto}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 6px;font-family:"Lilita One","Arial Black",Arial,sans-serif;font-weight:400;font-size:1.6rem}
.sheet.win h3{color:var(--green)}.sheet.lose h3{color:var(--red)}
.testbox{background:#f1f4f9;border-left:6px solid var(--navy);border-radius:10px;padding:10px 12px;margin:10px 0;font-weight:700}
.testbox b{color:var(--navy)}
.strike{background:var(--red-l);border-radius:10px;padding:8px 12px;margin:8px 0;font-weight:800;color:var(--red-d)}
.pop{position:fixed;z-index:60;font-family:"Lilita One","Arial Black",Arial,sans-serif;font-size:2rem;color:var(--green);pointer-events:none;animation:popup 1s forwards;text-shadow:0 2px 0 #fff}
.pop.bad{color:var(--red)}
@keyframes popup{0%{transform:translateY(0) scale(.6);opacity:0}20%{transform:translateY(-10px) scale(1.15);opacity:1}100%{transform:translateY(-70px);opacity:0}}
.shake{animation:shake .4s}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.confetti{position:fixed;top:-12px;width:10px;height:14px;z-index:70;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}
.act{border-radius:16px;overflow:hidden;border:3px solid var(--line);background:#f6f8fb}
.act img{width:100%;height:110px;object-fit:cover;display:block}
.act .t{padding:10px 12px}
.act .t b{font-family:"Lilita One","Arial Black",Arial,sans-serif;font-weight:400;font-size:1.15rem;color:var(--navy);display:block}
.act.done{border-color:var(--green)}.act.cur{border-color:var(--gold)}.act.locked{opacity:.55}
.bigscore{font-family:"Lilita One","Arial Black",Arial,sans-serif;font-size:3rem;color:var(--navy);line-height:1}
.rank{display:inline-block;background:var(--gold);color:#3a2a00;font-family:"Lilita One","Arial Black",Arial,sans-serif;padding:6px 14px;border-radius:12px;font-size:1.2rem;box-shadow:0 4px 0 var(--gold-d)}
table{border-collapse:collapse;width:100%;margin:10px 0}td,th{border:2px solid var(--line);padding:8px 10px;text-align:left}th{background:#f1f4f9}
.code{font-family:Consolas,monospace;font-size:1.6rem;font-weight:800;letter-spacing:3px;color:var(--navy);background:#f1f4f9;display:inline-block;padding:6px 14px;border-radius:10px}
.credits{font-size:.75rem;color:var(--muted);margin-top:16px}
.credits a{color:var(--muted)}
@media (max-width:900px){.hand{grid-template-columns:repeat(5,minmax(150px,1fr));overflow-x:auto;padding-bottom:12px}.track{grid-template-columns:1fr!important}.slot{min-height:80px}.acts{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.crisis.big{cursor:default;max-width:820px;margin:6px auto 0;border-width:4px}
.crisis.big .nm{font-size:1.5rem}
.crisis.big .body{font-size:1.4rem;padding:16px 20px 18px;line-height:1.35}
.crisis.stopped{border-color:var(--green);box-shadow:0 5px 0 #9fd6b4}
.crisis.stopped .top{background:linear-gradient(135deg,#1f8a4c,#2fa862)}
.fbline{display:none;margin:0 16px 16px;padding:12px 14px;border-radius:12px;font-weight:700;font-size:1.05rem}
.fbline.good{display:block;background:var(--green-l);border:2px solid #a5dbbb}
.fbline.good b{color:var(--green)}
.fbline.try{display:block;background:var(--gold-l);border:2px solid #f0d58d}
.hand{grid-template-columns:repeat(4,1fr)!important;max-width:1000px;margin:0 auto}
.card.dead{opacity:.35;filter:grayscale(1);transform:scale(.96);cursor:not-allowed}
.card.win{border-color:var(--green);box-shadow:0 6px 0 #1f8a4c,0 0 0 5px rgba(31,138,76,.25);transform:translateY(-8px)}
.zoneLbl{justify-content:center}
@media (max-width:900px){.hand{grid-template-columns:1fr 1fr!important}}
</style>
</head>

function actIntro(){var A=ACTS[S.act];hud();
 app.innerHTML="<div class='panel'>"+(IMG[A.img]?"<img src='"+IMG[A.img]+"' alt='' style='width:100%;height:180px;object-fit:cover;border-radius:14px'>":"")+
 "<h2 class='disp' style='color:var(--navy);margin:12px 0 4px;font-size:2rem'>"+A.n+": "+A.t+"</h2><p style='font-size:1.15rem'>"+A.story+"</p>"+
 "<div class='row'><button class='btn' id='go'>Start</button></div></div>";
 $("go").onclick=function(){startAct();route();};}

function board(){
 hud();busy=false;
 var id=cur(),boss=id==="BOSS",D=boss?BOSS:CR[id],p=P();
 var h="<div class='crisis big"+(boss?" boss":"")+"' id='cz'><div class='top'><span style='width:30px;height:30px;display:inline-block'>"+ICON[D.i]+"</span><span class='nm'>"+esc(D.n)+"</span></div>"+
  (boss?"<div class='phases' style='padding-top:12px'>"+BOSS.phases.map(function(_,k){return "<span class='"+(k<S.phase?"done":"")+"'></span>";}).join("")+"</div>":"")+
  "<div class='body'>"+esc(p.s)+"</div><div class='fbline' id='fb'></div></div>";
 h+="<div class='zoneLbl' style='margin-top:18px'>Tap the card that stops this crisis</div><div class='hand'>";
 S.hand.forEach(function(cid,k){var C=CARDS[cid],burnt=S.burned.indexOf(k)>-1;
  h+="<button class='card"+(burnt?" dead":"")+"' data-k='"+k+"' "+(burnt?"disabled":"")+"><div class='art'>"+art(cid)+"</div><div class='cname'>"+esc(C.n)+"</div><div class='ctip'>"+esc(C.t)+"</div></button>";});
 h+="</div>";
 app.innerHTML=h;
 Array.prototype.forEach.call(document.querySelectorAll(".card"),function(b){b.onclick=function(){if(busy||b.disabled)return;play(+b.getAttribute("data-k"),b);};});
}
function play(k,el){
 var p=P(),cid=S.hand[k],good=p.ok.indexOf(cid)>-1,fb=$("fb"),cz=$("cz");
 if(good){
  busy=true;if(S.firstTry[key()]===undefined)S.firstTry[key()]=true;
  sfx.good();el.classList.add("win");cz.classList.add("stopped");
  Array.prototype.forEach.call(document.querySelectorAll(".card"),function(x){x.disabled=true;});
  fb.className="fbline good";fb.innerHTML="<b>Stopped!</b> Test "+p.q+": "+p.test+"<div class='row' style='margin-top:10px'><button class='btn navy' id='nx'>Next</button></div>";
  save();
  $("nx").onclick=function(){
   if(cur()==="BOSS"&&S.phase<BOSS.phases.length-1){S.phase++;}
   else{S.idx++;S.phase=0;}
   if(S.idx>=S.queue.length){S.stage="actDone";save();route();return;}
   dealHand();save();board();};
  $("nx").focus({preventScroll:true});
 } else {
  if(S.firstTry[key()]===undefined)S.firstTry[key()]=false;
  S.shields--;S.lost++;sfx.bad();
  S.burned.push(k);
  cz.classList.remove("shake");void cz.offsetWidth;cz.classList.add("shake");
  if(S.shields<=0){S.stage="lost";save();setTimeout(route,600);return;}
  save();hud();
  el.classList.add("dead");el.disabled=true;
  fb.className="fbline try";fb.innerHTML="<b>That card didn’t work. You lost a shield.</b> Think: "+esc(p.h);
 }
}
function lost(){hud();
 app.innerHTML="<div class='panel'><h2 class='disp' style='color:var(--red);font-size:2rem;margin:0'>Out of shields!</h2>"+
 "<p style='font-size:1.1rem'>The Republic couldn’t hold in <b>"+ACTS[S.act].n+"</b>. Read each crisis closely, because guessing costs shields.</p>"+
 "<div class='row'><button class='btn' id='retry'>Replay "+ACTS[S.act].n+"</button></div></div>";
 $("retry").onclick=function(){S.stage="actIntro";save();route();};}
function actDone(){
 var A=ACTS[S.act];if(S.actsDone.indexOf(S.act)<0)S.actsDone.push(S.act);
 var stars=S.lost===0?3:S.lost<=2?2:1;S.results[S.act]={stars:stars,lost:S.lost};
 sfx.win();confetti();var last=S.act===ACTS.length-1;
 app.innerHTML="<div class='panel'><h2 class='disp' style='color:var(--green);font-size:2rem;margin:0'>"+(last?"The Would-Be King is defeated!":A.n+" complete!")+"</h2>"+
 "<p style='font-size:1.8rem;margin:6px 0;color:var(--gold)'>"+"★★★".slice(0,stars)+"<span style='color:#d7dbe2'>"+"★★★".slice(stars)+"</span></p>"+
 "<p>Shields lost: <b>"+S.lost+"</b></p>"+actsHTML()+
 "<div class='row'><button class='btn' id='go'>"+(last?"See my results":"On to "+ACTS[S.act+1].n)+"</button></div></div>";
 $("go").onclick=function(){if(last){S.stage="end";S.finishedAt=new Date().toISOString();}else{S.act++;S.stage="actIntro";}save();route();};
 save();hud();}
function code(){var ft=Object.keys(S.firstTry).filter(function(k){return S.firstTry[k];}).length;var str=S.name+"|"+ft+"|"+(S.finishedAt||"");var h=0;for(var i=0;i<str.length;i++)h=(h*31+str.charCodeAt(i))>>>0;return "FD-"+(h%46656).toString(36).toUpperCase().padStart(3,"0")+"-"+ft;}
function finish(){hud();
 var keys=Object.keys(S.firstTry),ft=keys.filter(function(k){return S.firstTry[k];}).length,total=keys.length,pct=total?Math.round(ft/total*100):0;
 var st=0;[0,1,2].forEach(function(i){st+=S.results[i]?S.results[i].stars:0;});
 var rank=st>=9?"Guardian of the Constitution":st>=7?"Founding Hero":st>=5?"Patriot":"New Citizen";
 var mq={};keys.forEach(function(k){if(!S.firstTry[k]){var q=k.indexOf("BOSS")===0?BOSS.phases[+k.slice(4)].q:CR[k].q;q.split(" · ").forEach(function(x){mq[x]=1;});}});
 var list=Object.keys(mq).sort(function(a,b){return +a.slice(1)-+b.slice(1);});
 var d=new Date(S.finishedAt||Date.now());
 app.innerHTML="<div class='panel'><h2 class='disp' style='color:var(--navy);font-size:2.2rem;margin:0'>The Republic is safe, "+esc(S.name)+"!</h2>"+
 "<p class='muted'>Founders’ Defense · Civics Test Section 1 · "+d.toLocaleDateString()+" "+d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})+"</p>"+
 "<p><span class='rank'>"+rank+"</span> <span style='font-size:1.6rem;color:var(--gold);margin-left:10px'>"+st+" of 9 stars</span></p>"+
 "<p style='font-size:1.1rem'><b>Test-ready check:</b> you stopped "+ft+" of "+total+" crises on your first try ("+pct+"%). "+(pct>=60?"That’s passing level for the real test (60%).":"Aim for 60% or higher. Play again!")+"</p>"+
 (list.length?"<p><b>Test questions to review:</b> "+list.join(", ")+". Find them on your study sheet.</p>":"<p><b>Flawless!</b> Every crisis stopped on the first try.</p>")+
 "<p>Completion code: <span class='code'>"+code()+"</span></p><p class='small muted'>Tap <b>Turn in to my teacher</b>. If that doesn't work, screenshot this screen and turn it in on Schoology.</p>"+
 "<div class='row'><button class='btn' id='turnin'>Turn in to my teacher</button><button class='btn ghost' id='again'>Play again</button></div><div id='tistatus' style='font-weight:800;margin-top:10px'></div></div>";
 confetti();
 var tb=$("turnin"),ts=$("tistatus");
 if(S.turnedIn){tb.textContent="Turned in";tb.disabled=true;ts.textContent="Your results were sent to your teacher.";ts.style.color="var(--green)";}
 tb.onclick=async function(){
  if(!window.classTurnIn){ts.textContent="Turn-in only works on the class website. Screenshot this screen instead.";ts.style.color="var(--red)";return;}
  tb.disabled=true;ts.textContent="Sending...";ts.style.color="var(--muted)";
  var answers={"Completion code":code(),"Rank":rank,"Stars":st+" of 9","First-try score":ft+" of "+total+" ("+pct+"%)","Test questions to review":list.length?list.join(", "):"None",
   "Act I shields lost":String((S.results[0]||{}).lost),"Act II shields lost":String((S.results[1]||{}).lost),"Act III shields lost":String((S.results[2]||{}).lost)};
  try{var r=await window.classTurnIn("https://fynn-class-assignment-submissions-20261024.neotboy.chatgpt.site/api/submit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({studentName:S.name,assignmentId:"civics-test-s1-founders-defense",assignmentTitle:"Civics Test Section 1 · Founders' Defense",score:pct,answers:answers})});
   var d=await r.json().catch(function(){return{};});if(!r.ok)throw new Error(d.error||"Could not send your results.");
   S.turnedIn=true;save();tb.textContent="Turned in";ts.textContent="Turned in! Your results were sent to your teacher.";ts.style.color="var(--green)";}
  catch(e){tb.disabled=false;ts.textContent=(e&&e.message?e.message:"Could not send.")+" Try again, or screenshot this screen.";ts.style.color="var(--red)";}
 };
 var ag=$("again"),armed=false;ag.onclick=function(){if(!armed){armed=true;ag.textContent="Tap again to start over";return;}var n=S.name;clearSave();S=fresh(n);save();route();};}
start();
</script>
</body>
</html>
