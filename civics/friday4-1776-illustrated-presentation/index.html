<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Friday 4 — The 1776 Files | Illustrated Briefing</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#111b23;color:#f8f2df;font-family:Arial,sans-serif}body{display:flex;flex-direction:column}.deck{flex:1;min-height:0;padding:18px 24px 8px}.slide{height:100%;max-width:1540px;margin:auto;display:grid;grid-template-columns:56% 44%;background:#f2e8d3;color:#17212a;border:5px solid #d9b879;box-shadow:0 8px 40px #0008;overflow:hidden}.left{padding:clamp(18px,3.1vw,52px);display:flex;flex-direction:column;min-width:0}.kicker{font-size:clamp(13px,1.4vw,19px);font-weight:900;letter-spacing:3px;color:#8b422d}.eyebrow{font-size:clamp(13px,1.35vw,18px);letter-spacing:2px;font-weight:800;color:#60624c;margin-top:clamp(12px,2vw,30px)}h1{font-family:Georgia,serif;font-size:clamp(35px,4.65vw,74px);line-height:1.03;letter-spacing:-1.5px;margin:14px 0 10px}h2{font-size:clamp(22px,2.25vw,35px);line-height:1.16;color:#994431;margin:0 0 18px}.body{font-size:clamp(19px,2vw,31px);line-height:1.4;max-width:780px}.question{margin-top:auto;background:#e3d0a7;padding:clamp(12px,1.6vw,23px);border-left:8px solid #a14b31;font-size:clamp(17px,1.55vw,25px);line-height:1.35}.qtag{display:block;font-size:clamp(11px,1vw,15px);font-weight:900;letter-spacing:2px;margin-bottom:5px}.art{position:relative;overflow:hidden;background:repeating-linear-gradient(45deg,#635547,#635547 10px,#776955 10px,#776955 20px)}.art img{display:block;width:100%;height:100%;object-fit:cover;filter:sepia(.11) contrast(1.04)}.credit{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,#101820eb);padding:40px 15px 15px;color:white;font-size:14px}.fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#e9d8ad;font:36px Georgia,serif;text-align:center;padding:30px;z-index:0}.art img{position:relative;z-index:1}.controls{height:78px;display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1540px;width:100%;margin:0 auto;padding:8px 24px 14px}.controls button{font-size:20px;font-weight:800;color:#17212a;background:#f3d38c;border:2px solid #e5b65b;border-radius:9px;padding:12px 22px;cursor:pointer}.controls button:disabled{opacity:.35;cursor:default}#page{font-size:17px;font-weight:bold;letter-spacing:1px}.track{flex:1;height:7px;background:#42515b;border-radius:5px;max-width:400px}.fill{height:100%;background:#e9b965;border-radius:5px;transition:width .15s}@media(max-width:750px){.deck{padding:8px}.slide{grid-template-columns:1fr;grid-template-rows:62% 38%}.left{padding:17px}h1{font-size:30px}.body{font-size:16px}h2{font-size:20px;margin-bottom:8px}.question{font-size:15px;padding:8px}.art{grid-row:2}.controls{height:65px;padding:4px 12px}.controls button{font-size:14px;padding:10px}.track{display:none}}</style></head><body><main class="deck"><div id="slide" class="slide" aria-live="polite"></div></main><footer class="controls"><button id="prev" onclick="move(-1)">◀ BACK</button><div class="track"><div class="fill" id="fill"></div></div><span id="page"></span><button id="next" onclick="move(1)">NEXT ▶</button></footer><script>const slides=[["THE 1776 FILES", "A nation does not begin in 1776", "CASE OPENED", "Before the U.S. existed, people already lived here. Others arrived, and many were brought by force. Those stories shaped what came next.", "Why is \u201cAmerica started in 1776\u201d only part of the story?", "https://commons.wikimedia.org/wiki/Special:FilePath/Thirteen_Colonies_1775.svg", "Map of the thirteen colonies", "01 \u00b7 THE COLONIES"], ["BEFORE THE COLONIES", "Native nations were already here", "FIRST PEOPLES", "Native American nations lived across North America for thousands of years. They had their own governments, cultures, trade networks, and communities.", "What is missing when a history story starts with European settlers?", "https://commons.wikimedia.org/wiki/Special:FilePath/Native_American_Tribes,_1783.png", "Historical map of Native American nations", "01 \u00b7 THE COLONIES"], ["WHY DID PEOPLE COME?", "Different people. Different reasons.", "COLONIAL LIFE", "Some Europeans sought religious freedom, land, work, or a fresh start. Others came to make money or expand their country\u2019s power.", "Would every colonist have had the same experience?", "https://commons.wikimedia.org/wiki/Special:FilePath/The_Embarkation_of_the_Pilgrims.jpg", "Painting of colonial settlers", "01 \u00b7 THE COLONIES"], ["THE PART LEFT OUT", "Slavery was forced\u2014not a choice", "ENSLAVEMENT", "Africans were kidnapped, sold, and transported across the Atlantic. Enslaved people were forced to work without freedom. Colonial economies benefited from their labor.", "How is forced arrival different from choosing to immigrate?", "https://commons.wikimedia.org/wiki/Special:FilePath/Slave_ship_diagram.png", "Historic diagram of a slave ship", "01 \u00b7 THE COLONIES"], ["A GROWING CONFLICT", "Britain ruled the colonies", "THE BREAK", "British leaders made laws and charged taxes. Colonists had no elected members in Britain\u2019s Parliament. Protesters called this \u201ctaxation without representation.\u201d", "Is a tax fair if the people paying it have no say?", "https://commons.wikimedia.org/wiki/Special:FilePath/Boston_Tea_Party_Currier_colored.jpg", "Historic illustration of the Boston Tea Party", "02 \u00b7 THE BREAK"], ["THE POINT OF NO RETURN", "Protest became revolution", "1775", "Fighting began in 1775. The colonies faced the British army. George Washington led the Continental Army during the Revolutionary War.", "Why might protest turn into armed conflict?", "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1b/Washington_Crossing_the_Delaware_by_Emanuel_Leutze%2C_MMA-NYC%2C_1851.jpg/1280px-Washington_Crossing_the_Delaware_by_Emanuel_Leutze%2C_MMA-NYC%2C_1851.jpg", "Washington Crossing the Delaware (1851 painting)", "03 \u00b7 REVOLUTION"], ["JULY 4, 1776", "The colonies declare independence", "THE DOCUMENT", "Thomas Jefferson was the main writer of the Declaration of Independence. Congress adopted it on July 4, 1776. It explained why the colonies wanted to separate from Britain.", "Did declaring independence mean the fighting was finished?", "https://upload.wikimedia.org/wikipedia/commons/thumb/1/13/Signing_of_the_Declaration_of_Independence_4K.jpg/1200px-Signing_of_the_Declaration_of_Independence_4K.jpg", "Trumbull painting of the Declaration being presented", "03 \u00b7 REVOLUTION"], ["WHAT DID THEY CLAIM?", "People have rights", "THE IDEA", "The Declaration said people have basic rights, including life, liberty, and the pursuit of happiness. At the time, those promises did not apply equally to everyone.", "Who was left out of the promise of freedom in 1776?", "https://commons.wikimedia.org/wiki/Special:FilePath/United_States_Declaration_of_Independence.jpg", "Historic Declaration of Independence document", "03 \u00b7 REVOLUTION"], ["THE WAR CONTINUES", "Two battles to remember", "THE TURNING POINT", "Saratoga (1777) helped convince France to support the Americans. Yorktown (1781) was a major British defeat. The war officially ended with a peace treaty in 1783.", "Which event helped America get an important ally?", "https://commons.wikimedia.org/wiki/Special:FilePath/Surrender_of_Lord_Cornwallis.jpg", "Painting depicting surrender at Yorktown", "03 \u00b7 REVOLUTION"], ["THIRTEEN BECOME STATES", "Independent, but not yet united strongly", "THE FIRST STATES", "The original 13 states included Virginia, Massachusetts, New York, Pennsylvania, and Georgia. They had been British colonies before independence.", "Can you name five original states?", "https://commons.wikimedia.org/wiki/Special:FilePath/Thirteen_Colonies_1775.svg", "Map of original colonies", "04 \u00b7 A NEW COUNTRY"], ["A NEW PROBLEM", "How should a country govern itself?", "AFTER THE WAR", "America\u2019s first national system, the Articles of Confederation, made the national government too weak to solve some major problems. Leaders met to create a stronger plan.", "What could go wrong if every state acted completely alone?", "https://commons.wikimedia.org/wiki/Special:FilePath/Scene_at_the_Signing_of_the_Constitution_of_the_United_States.jpg", "Scene at the signing of the Constitution", "04 \u00b7 A NEW COUNTRY"], ["1787: A NEW PLAN", "The Constitution", "NEW RULES", "The U.S. Constitution was written in 1787. It established a federal government with separate branches and rules for how power is shared and limited.", "Why would the founders divide government power?", "https://commons.wikimedia.org/wiki/Special:FilePath/Constitution_of_the_United_States,_page_1.jpg", "First page of the U.S. Constitution", "04 \u00b7 A NEW COUNTRY"], ["SELLING THE PLAN", "The Federalist Papers", "THE DEBATE", "Alexander Hamilton, James Madison, and John Jay wrote essays supporting ratification of the Constitution. Their goal was to persuade people to approve it.", "Why would people argue about a new Constitution?", "https://commons.wikimedia.org/wiki/Special:FilePath/The_Federalist.jpg", "The Federalist title page", "04 \u00b7 A NEW COUNTRY"], ["WHO DID WHAT?", "The founding figures", "MEET THE PEOPLE", "Washington: led the army; first president. Jefferson: main Declaration writer. Madison: key Constitution writer. Hamilton: first treasury secretary. Franklin: diplomat and inventor.", "Which person would you call to help write a constitution?", "https://upload.wikimedia.org/wikipedia/commons/thumb/1/13/Signing_of_the_Declaration_of_Independence_4K.jpg/1200px-Signing_of_the_Declaration_of_Independence_4K.jpg", "Founders in the Continental Congress", "04 \u00b7 A NEW COUNTRY"], ["NOW OPEN THE CASE FILES", "You are the investigation team", "MISSION START", "Use what you learned to examine evidence, rebuild events in order, find misleading claims, and identify the people and documents behind American independence.", "Your mission: solve all eight evidence rooms.", "https://commons.wikimedia.org/wiki/Special:FilePath/United_States_Declaration_of_Independence.jpg", "Declaration of Independence document", "05 \u00b7 INVESTIGATION"]];let i=0;function render(){const s=slides[i];document.getElementById('slide').innerHTML=`<section class="left"><div class="kicker">THE 1776 FILES / FRIDAY 4</div><div class="eyebrow">${s[7]} · ${s[2]}</div><h1>${s[0]}</h1><h2>${s[1]}</h2><div class="body">${s[3]}</div><div class="question"><span class="qtag">THINK / DISCUSS</span>${s[4]}</div></section><div class="art"><div class="fallback">HISTORICAL EVIDENCE</div><img src="${s[5]}" alt="${s[6]}" onerror="this.style.display='none'"/><div class="credit">${s[6]} · historical artwork / public collection</div></div>`;document.getElementById('page').textContent=`${i+1} OF ${slides.length}`;document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===slides.length-1;document.getElementById('fill').style.width=((i+1)/slides.length*100)+'%';}function move(n){i=Math.min(slides.length-1,Math.max(0,i+n));render()}document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();move(1)}if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}});render();</script></body></html>
