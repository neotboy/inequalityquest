<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Friday 4 — The 1776 Files · Historical Artwork</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#101a24;font-family:Arial,sans-serif;color:#192530;display:flex;flex-direction:column}.stage{flex:1;min-height:0;padding:16px 24px 4px}.slide{height:100%;margin:auto;max-width:1500px;background:#f4ecda;border:5px solid #d1ab6c;box-shadow:0 10px 40px #0007;display:grid;grid-template-columns:54% 46%;overflow:hidden}.copy{padding:clamp(20px,3vw,55px);display:flex;flex-direction:column;min-width:0}.chapter{font-weight:900;letter-spacing:2px;color:#a2522d;font-size:clamp(13px,1.3vw,19px)}h1{font:700 clamp(35px,4.9vw,76px)/1.04 Georgia,serif;margin:clamp(14px,3vh,32px) 0 13px}h2{font-size:clamp(23px,2.3vw,38px);line-height:1.12;color:#975033;margin:0 0 25px}.body{font-size:clamp(21px,2.07vw,32px);line-height:1.42;max-width:850px}.q{margin-top:auto;border-left:6px solid #aa5938;background:#e8d9ba;padding:15px 22px;font-size:clamp(18px,1.6vw,25px);line-height:1.3}.q b{display:block;font-size:13px;letter-spacing:1px;margin-bottom:5px}.art{position:relative;background:#3a4651;overflow:hidden;display:flex;align-items:center;justify-content:center}.art img{width:100%;height:100%;object-fit:contain;position:relative;z-index:2}.fail{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:40px;text-align:center;color:#fff3d7;font-size:24px;gap:18px}.fail a{color:#f1d389;font-size:18px}.caption{position:absolute;bottom:0;left:0;right:0;background:#101923dc;color:white;padding:15px 19px;font-size:15px;z-index:3}.caption a{color:#f4cd86}.controls{height:80px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:8px 24px;max-width:1500px;margin:auto;width:100%;color:#fff}.controls button{font-size:18px;font-weight:900;background:#f2cd83;color:#1a2731;border:0;border-radius:9px;padding:14px 22px;cursor:pointer}.controls button:disabled{opacity:.4}.progress{flex:1;max-width:370px;height:7px;border-radius:8px;background:#48525f}.fill{height:100%;background:#e2b46c;border-radius:8px}#count{white-space:nowrap}@media(max-width:750px){.stage{padding:5px}.slide{display:flex;flex-direction:column}.copy{padding:16px;min-height:58%;flex:1}h1{font-size:30px;margin:10px 0}h2{font-size:21px;margin-bottom:9px}.body{font-size:17px}.q{font-size:16px;padding:9px}.art{height:42%;flex-shrink:0}.controls{height:60px;padding:5px}.controls button{font-size:14px;padding:10px}.progress{display:none}}
</style></head><body><main class="stage"><div id="slide" class="slide"></div></main><footer class="controls"><button id="back">◀ BACK</button><div class="progress"><div id="fill" class="fill"></div></div><span id="count"></span><button id="next">NEXT ▶</button></footer><script>const slides=[{"title": "THE 1776 FILES", "subtitle": "How did 13 colonies become a country?", "body": "Start with this mystery: In 1776, thirteen British colonies announced that they were breaking away from Britain. But the story started long before that—and winning freedom was only the beginning.", "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Thirteen_Colonies_1775.svg?width=900", "caption": "Map of the thirteen British colonies", "chapter": "OUR STORY BEGINS", "question": null}, {"title": "BEFORE BRITAIN", "subtitle": "North America was already home to many nations", "body": "Native American nations had lived here for thousands of years. They built towns, traded, farmed, and governed their communities. European settlers entered lands that already belonged to other people.", "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Native_American_Tribes,_1783.png?width=900", "caption": "Historical map of Native American nations", "chapter": "CHAPTER 1 • LIFE IN THE COLONIES", "question": null}, {"title": "WHY PEOPLE ARRIVED", "subtitle": "Not everyone came for the same reason", "body": "Some Europeans crossed the ocean for land, jobs, or religious freedom. Others wanted wealth and power for their countries. They built thirteen British colonies along the Atlantic coast.", "image": "https://commons.wikimedia.org/wiki/Special:FilePath/The_Embarkation_of_the_Pilgrims.jpg?width=900", "caption": "Historical painting of European settlers", "chapter": "CHAPTER 1 • LIFE IN THE COLONIES", "question": null}, {"title": "A DIFFERENT STORY", "subtitle": "Many people were brought by force", "body": "European colonists also enslaved Africans. People were taken from their homes, carried across the ocean, and forced to work. Their labor helped build colonial wealth, even though they were denied freedom.", "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Slave_ship_diagram.png?width=900", "caption": "Historical diagram of a ship used to transport enslaved people", "chapter": "CHAPTER 1 • LIFE IN THE COLONIES", "question": null}, {"title": "WHO MADE THE RULES?", "subtitle": "The colonies answered to Britain", "body": "For many years, Britain controlled the colonies. After an expensive war, Britain placed more taxes on them. Many colonists were angry because they had no elected representatives in Britain’s Parliament.", "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Thirteen_Colonies_1775.svg?width=900", "caption": "Map of British colonies in North America", "chapter": "CHAPTER 2 • THE BREAK WITH BRITAIN", "question": null}, {"title": "BOSTON, 1773", "subtitle": "Anger turned into protest", "body": "Colonists argued that taxes without a voice in Parliament were unfair. In Boston, protesters dumped British tea into the harbor. Britain punished Massachusetts, and the conflict grew worse.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/1/17/Boston_Tea_Party-Cooper.jpg/1000px-Boston_Tea_Party-Cooper.jpg", "caption": "Historic engraving of the Boston Tea Party", "chapter": "CHAPTER 2 • THE BREAK WITH BRITAIN", "question": "Was dumping the tea a protest, a crime, or both? Why?"}, {"title": "1775: WAR BEGINS", "subtitle": "The argument became a revolution", "body": "Fighting began at Lexington and Concord in April 1775. Colonists formed an army, and George Washington became its commander. Now they had to decide whether to stay British—or form a new country.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1b/Washington_Crossing_the_Delaware_by_Emanuel_Leutze%2C_MMA-NYC%2C_1851.jpg/1280px-Washington_Crossing_the_Delaware_by_Emanuel_Leutze%2C_MMA-NYC%2C_1851.jpg", "caption": "Nineteenth-century painting of George Washington", "chapter": "CHAPTER 3 • INDEPENDENCE", "question": null}, {"title": "JULY 4, 1776", "subtitle": "A letter to the world", "body": "Thomas Jefferson was the main writer of the Declaration of Independence. Congress adopted it on July 4, 1776. The document explained why the colonies were separating from Britain. But declaring freedom did not end the war.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/1/13/Signing_of_the_Declaration_of_Independence_4K.jpg/1200px-Signing_of_the_Declaration_of_Independence_4K.jpg", "caption": "John Trumbull’s painting of the Declaration committee", "chapter": "CHAPTER 3 • INDEPENDENCE", "question": null}, {"title": "WHAT DID IT PROMISE?", "subtitle": "Freedom was an idea—and a challenge", "body": "The Declaration said people have rights to life, liberty, and the pursuit of happiness. Yet slavery continued, and women and many others had little political power. The country would spend generations arguing over who received those rights.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/1/13/Signing_of_the_Declaration_of_Independence_4K.jpg/1200px-Signing_of_the_Declaration_of_Independence_4K.jpg", "caption": "Historical painting of the Declaration of Independence", "chapter": "CHAPTER 3 • INDEPENDENCE", "question": "Why did the Declaration’s promise not match everyone’s life in 1776?"}, {"title": "THE FIGHT TO WIN", "subtitle": "Two major victories changed the war", "body": "In 1777, the American victory at Saratoga helped win support from France. In 1781, British forces surrendered at Yorktown. The peace treaty of 1783 recognized American independence.", "image": "https://upload.wikimedia.org/wikipedia/commons/1/13/Flickr_-_USCapitol_-_Surrender_of_Lord_Cornwallis.jpg", "caption": "John Trumbull’s Surrender of Lord Cornwallis", "chapter": "CHAPTER 3 • INDEPENDENCE", "question": null}, {"title": "THIRTEEN STATES", "subtitle": "Independence created a new problem", "body": "The former colonies became thirteen states. They needed to work together, but each wanted to keep its power. The country first tried a loose agreement called the Articles of Confederation.", "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Thirteen_Colonies_1775.svg?width=900", "caption": "Map of the original thirteen states", "chapter": "CHAPTER 4 • BUILDING A GOVERNMENT", "question": null}, {"title": "THE FIRST PLAN FAILED", "subtitle": "The national government was too weak", "body": "Under the Articles of Confederation, Congress could not easily collect taxes or enforce national laws. State disagreements were hard to solve. Leaders feared that the new country could fall apart.", "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Washington_Constitutional_Convention_1787.jpg?width=1000", "caption": "Historical painting of delegates at the Constitutional Convention", "chapter": "CHAPTER 4 • BUILDING A GOVERNMENT", "question": null}, {"title": "1787: A NEW PLAN", "subtitle": "The Constitution divided power", "body": "Delegates met in Philadelphia and wrote the Constitution in 1787. It created three branches of government and divided power between the states and the nation. The goal was a government strong enough to work—but not too powerful.", "image": "https://s3.amazonaws.com/cms.ipressroom.com/173/files/20241/65c677712cfac24e8e3948e6_Constitution/Constitution_mid.jpg", "caption": "Photograph of the original U.S. Constitution", "chapter": "CHAPTER 4 • BUILDING A GOVERNMENT", "question": "Why might giving one person all government power be dangerous?"}, {"title": "THE BIG DEBATE", "subtitle": "Would the new plan protect freedom?", "body": "The Constitution still needed approval. Alexander Hamilton, James Madison, and John Jay wrote the Federalist Papers to support it. Others worried the new government needed stronger protections for people’s rights.", "image": "https://commons.wikimedia.org/wiki/Special:FilePath/The_Federalist.jpg?width=900", "caption": "Historical title page from The Federalist", "chapter": "CHAPTER 4 • BUILDING A GOVERNMENT", "question": null}, {"title": "CASE FILES OPEN", "subtitle": "Can you prove how the country began?", "body": "You know the story: different lives in the colonies, growing anger toward Britain, independence, a long war, and a new Constitution. Now use the evidence to solve the eight rooms of The 1776 Files.", "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/1/13/Signing_of_the_Declaration_of_Independence_4K.jpg/1200px-Signing_of_the_Declaration_of_Independence_4K.jpg", "caption": "Historical painting of the Declaration of Independence", "chapter": "YOUR INVESTIGATION STARTS", "question": null}];let current=0;function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const x=slides[current];const art=document.getElementById('slide');art.innerHTML='<section class="copy"><div class="chapter">THE 1776 FILES / '+esc(x.chapter)+'</div><h1>'+esc(x.title)+'</h1><h2>'+esc(x.subtitle)+'</h2><div class="body">'+esc(x.body)+'</div>'+(x.question?'<div class="q"><b>DISCUSS</b>'+esc(x.question)+'</div>':'')+'</section><div class="art"><div class="fail"><b>View this historical image at its source</b><a href="'+esc(x.image)+'" target="_blank" rel="noopener">Open artwork ↗</a></div><img alt="'+esc(x.caption)+'" referrerpolicy="no-referrer" src="'+esc(x.image)+'" onerror="this.hidden=true"><div class="caption">'+esc(x.caption)+' · <a href="'+esc(x.image)+'" target="_blank" rel="noopener">View source ↗</a></div></div>';document.getElementById('count').textContent=(current+1)+' / '+slides.length;document.getElementById('fill').style.width=((current+1)/slides.length*100)+'%';document.getElementById('back').disabled=current===0;document.getElementById('next').disabled=current===slides.length-1}function move(n){current=Math.max(0,Math.min(slides.length-1,current+n));render()}document.getElementById('back').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();move(1)}if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}});render();</script></body></html>
