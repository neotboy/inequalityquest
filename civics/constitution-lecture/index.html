<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Missing Constitution | Teacher Lecture</title><style>
*{box-sizing:border-box}body{margin:0;background:#0a1320;color:#fff;font-family:Arial,'Segoe UI',sans-serif;overflow:hidden}.slide{height:100vh;width:100vw;display:flex;flex-direction:column;padding:5vh 5vw 11vh;gap:2vh}.top{display:flex;align-items:center;gap:2vw}.tag{font-size:clamp(19px,2.15vw,31px);font-weight:900;color:#f6c76d;letter-spacing:.06em;text-transform:uppercase}.rule{flex:1;height:5px;background:#e6b353}h1{font-size:clamp(48px,5.15vw,88px);font-weight:1000;line-height:1.04;letter-spacing:-.035em;margin:0;text-transform:uppercase}.body{flex:1;display:flex;align-items:center;gap:3vw;min-height:0}.teach{flex:1;display:flex;flex-direction:column;justify-content:center;gap:3vh;min-width:0}.main{font-weight:900;font-size:clamp(30px,3.25vw,56px);line-height:1.19;margin:0;text-wrap:pretty}.example{background:#233a52;border-left:11px solid #f9c86d;padding:2.1vh 2.3vw;border-radius:0 12px 12px 0;font-size:clamp(26px,2.75vw,46px);line-height:1.18;font-weight:850;margin:0}.visual{display:none;flex:0 0 27%;height:min(48vh,480px);position:relative;overflow:hidden;background:#18293b;border-radius:10px;border:3px solid #e2c17a}.visual img{width:100%;height:100%;object-fit:cover}.credit{position:absolute;left:0;bottom:0;width:100%;font-size:13px;font-weight:700;background:#091422e8;padding:7px}.with-image .visual{display:block}.nav{position:fixed;bottom:0;left:0;width:100%;height:8.5vh;background:#050a13;display:flex;align-items:center;justify-content:space-between;padding:0 5vw}.nav button{font-size:clamp(16px,1.4vw,23px);padding:1vh 1.6vw;background:#1b304a;color:#fff;border:2px solid #768da8;border-radius:6px;font-weight:850;cursor:pointer}.nav button:focus{outline:4px solid #f4d179}.count{font-size:20px;font-weight:900;color:#dfc186}@media(max-width:800px){.slide{padding:4vh 4vw 12vh}h1{font-size:9vw}.main{font-size:5vw}.example{font-size:4.4vw}.with-image .visual{flex-basis:26%;height:30vh}.credit{font-size:8px}}</style></head><body><main id="slide" class="slide"><div class="top"><div id="tag" class="tag"></div><div class="rule"></div></div><h1 id="title"></h1><div class="body"><div class="teach"><p id="main" class="main"></p><p id="example" class="example"></p></div><div id="visual" class="visual"><img id="pic" alt="Real archival photo"><span id="credit" class="credit"></span></div></div></main><div class="nav"><button id="prev">◀ BACK</button><span id="count" class="count"></span><button id="full">FULL SCREEN ⛶</button><button id="next">NEXT ▶</button></div><script>const deck=[["THE MISSING CONSTITUTION","WHAT YOU MUST KNOW","Understand the ideas behind 12 evidence puzzles and 4 vault locks.","You do not need to memorize puzzle codes. You need to know why answers are right.","https://images.wral.com/9affeaf6-a0d1-53b3-924c-dc50ae2d7a35?h=900&w=1600","National Archives exhibit; AP/WRAL"],["1 · REPUBLIC","WE ELECT LEADERS TO MAKE LAWS","The United States is a republic. Voters choose representatives who make decisions for them.","REAL LIFE: Iowa voters elect people to Congress. Those members vote on laws for the country.",null,null],["1 · DEMOCRACY","DIRECT VOTE OR ELECTED LEADERS?","Direct democracy: voters decide laws themselves. Representative democracy: voters choose lawmakers.","EXAMPLE: A class votes on every rule vs. electing a class council to make decisions.",null,null],["1 · POPULAR SOVEREIGNTY","THE PEOPLE GIVE GOVERNMENT POWER","The Constitution starts with “We the People.” Leaders get authority from the people, not from a king.","REAL LIFE: If voters disagree with a senator, they can vote for a different senator at the next election.",null,null],["1 · CONSTITUTION","THE CONSTITUTION HAS THREE JOBS","It BUILDS the government. It GIVES and LIMITS power. It PROTECTS basic rights.","REAL LIFE: Congress can make laws, but those laws must follow the Constitution.","https://images.wral.com/9affeaf6-a0d1-53b3-924c-dc50ae2d7a35?h=900&w=1600","Original founding documents on display — AP/WRAL"],["1 · SUPREME LAW","THE CONSTITUTION IS ABOVE STATE LAWS","The Constitution is the highest law in the United States. Federal and state governments must obey it.","REAL LIFE: A state cannot pass a law that violates freedom of speech.","https://images.wral.com/9affeaf6-a0d1-53b3-924c-dc50ae2d7a35?h=900&w=1600","Original U.S. founding documents at the National Archives — AP/WRAL"],["2 · AMENDMENTS","AN AMENDMENT CHANGES THE CONSTITUTION","The Constitution can change, but it is hard on purpose. There are 27 amendments today.","REAL LIFE: The 19th Amendment banned denying the vote because of sex.",null,null],["2 · HOW IT CHANGES","TWO-THIRDS → THREE-FOURTHS","The usual process: TWO-THIRDS of both houses of Congress propose an amendment. THREE-FOURTHS of state legislatures approve it.","Why so difficult? One political party cannot easily rewrite the rules alone.",null,null],["2 · BILL OF RIGHTS","THE FIRST TEN AMENDMENTS","The Bill of Rights was ratified in 1791. It protects freedoms and sets limits on government power.","REAL LIFE: People have protections when accused of crimes. Government cannot simply ignore those rights.","https://visit.archives.gov/sites/default/files/2019-02/bill-of-rights-top-3W1A3942.JPG","Original Bill of Rights — National Archives Museum"],["2 · FIRST AMENDMENT","FIVE FREEDOMS TO REMEMBER","SPEECH • RELIGION • PRESS • PEACEFUL ASSEMBLY • PETITION.","REAL LIFE: You can peacefully criticize a policy, publish an opinion, meet with others, or ask officials to change it.","https://visit.archives.gov/sites/default/files/2019-02/bill-of-rights-top-3W1A3942.JPG","Original Bill of Rights — National Archives Museum"],["2 · REAL-LIFE CASE","CAN STUDENTS PROTEST A RULE?","A group dislikes a new school rule. Students can express an opinion and ask for a change.","BUT: Schools may enforce reasonable rules against threats or major disruption. Rights have limits.",null,null],["3 · INDEPENDENCE","WHAT HAPPENED IN 1776?","The colonies announced that they were separating from Great Britain. This was the Declaration of Independence.","Thomas Jefferson was the main writer. It explained WHY the colonies wanted to break away.","https://www.nist.gov/sites/default/files/styles/1400_x_1400_limit/public/images/2017/06/27/man_looking_at_doi_in_its_encasement.jpg?itok=cj-nZ9bK","Original Declaration on display — NIST / National Archives"],["3 · TWO DOCUMENTS","DECLARATION = WHY. CONSTITUTION = HOW.","The Declaration explains why the colonies wanted freedom from Britain.","The Constitution explains how the new national government works.",null,null],["3 · NATURAL RIGHTS","LIFE. LIBERTY. PURSUIT OF HAPPINESS.","The Declaration says people have basic rights. Government is supposed to protect them.","REAL HISTORY: These ideas did not become reality for everyone. Enslaved people and women were denied many rights.","https://www.nist.gov/sites/default/files/styles/1400_x_1400_limit/public/images/2017/06/27/man_looking_at_doi_in_its_encasement.jpg?itok=cj-nZ9bK","Original Declaration of Independence — NIST"],["3 · KEY DATES","KNOW THE ORDER OF EVENTS","1776: Declaration. 1787: Constitution written.","1788: Constitution approved. 1791: Bill of Rights approved.",null,null],["4 · ECONOMY","WHAT IS A MARKET ECONOMY?","Private businesses sell goods. Customers choose what to buy. Businesses compete for sales.","REAL LIFE: Two stores sell the same sneakers. One lowers its price to attract more customers.",null,null],["4 · RULE OF LAW","THE LAW APPLIES TO EVERYONE","No one is above the law—not regular people, mayors, or presidents.","REAL LIFE: A mayor should not cancel parking tickets only for friends. Power does not give a free pass.",null,null],["4 · FIRST GOVERNMENT","THE ARTICLES OF CONFEDERATION","The Articles created the first U.S. national government. It was too weak to solve many national problems.","EXAMPLE: Congress could request money from states, but could not directly collect national taxes.",null,null],["4 · OTHER EARLY DOCUMENTS","IDEAS BEFORE AND AFTER 1787","MAYFLOWER COMPACT: People agreed to govern together. FEDERALIST PAPERS: Essays supporting the new Constitution.","Haudenosaunee nations also had a long tradition of shared government; direct influence on the Constitution is debated.",null,null],["4 · THE BIG DIFFERENCE","POWER FROM PEOPLE vs. RULE OF LAW","POPULAR SOVEREIGNTY asks: Where does government power come from? From the people.","RULE OF LAW asks: Who must obey the law? Everyone—including leaders.",null,null],["CHECK BEFORE PLAY","CAN YOU EXPLAIN THESE?","1. Why is America a republic?  2. What is the supreme law?  3. Name three First Amendment rights.","4. Declaration vs. Constitution?  5. What is an amendment?  6. What does rule of law mean?",null,null],["BEGIN INVESTIGATION","THE VAULT OPENS WITH KNOWLEDGE","Look closely at each clue. Think about what the words mean. Use what you learned to solve each room.","WORK SOLO OR WITH A PARTNER • ALLOW 30–35 MINUTES","https://images.wral.com/9affeaf6-a0d1-53b3-924c-dc50ae2d7a35?h=900&w=1600","Founding documents, National Archives — AP/WRAL"]];let i=0;const $=id=>document.getElementById(id);function render(){let s=deck[i];$('tag').textContent=s[0];$('title').textContent=s[1];$('main').textContent=s[2];$('example').textContent=s[3];$('count').textContent=(i+1)+' / '+deck.length;const v=$('visual');v.style.display=s[4]?'block':'none';if(s[4]){$('pic').src=s[4];$('pic').onerror=()=>{v.style.display='none'};$('credit').textContent=s[5];}}function move(x){i=Math.max(0,Math.min(deck.length-1,i+x));render()}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('full').onclick=()=>document.documentElement.requestFullscreen?.();document.onkeydown=e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();move(1)}if(e.key==='ArrowLeft')move(-1)};render();</script></body></html>
