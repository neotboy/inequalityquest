<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Missing Constitution — Board Lecture</title><style>
*{box-sizing:border-box}body{margin:0;background:#07111d;color:white;font-family:Arial,Helvetica,sans-serif;overflow:hidden}.screen{width:100vw;height:100vh;display:grid;grid-template-columns:54% 46%}.left{padding:4.2vh 3.6vw;display:flex;flex-direction:column;justify-content:center;gap:2.3vh}.eyebrow{color:#ffd179;font-size:clamp(18px,2.1vw,35px);font-weight:900;letter-spacing:.08em;text-transform:uppercase}h1{font-size:clamp(41px,5.2vw,86px);line-height:1.03;margin:0;letter-spacing:-.035em;font-weight:1000;text-wrap:balance}p{font-size:clamp(24px,2.55vw,43px);line-height:1.2;font-weight:800;margin:0}.example{border-left:12px solid #f6ba57;padding-left:1.2vw;color:#fce2a3}.right{position:relative;background:#ad9675;display:flex;align-items:center;justify-content:center;overflow:hidden}.right img{width:100%;height:100%;object-fit:cover;object-position:center}.credit{position:absolute;bottom:4%;left:3%;right:3%;background:#07111de0;padding:9px 13px;font-size:clamp(12px,1.1vw,18px);font-weight:700}.toolbar{position:fixed;bottom:1.1vh;left:2%;display:flex;gap:12px;align-items:center}.toolbar button{border:1px solid #a1adc2;background:#16283e;color:white;padding:8px 14px;border-radius:7px;font-size:17px;cursor:pointer}.toolbar span{font-size:15px;color:#dddecf;font-weight:800}.toolbar button:focus{outline:3px solid #ffdd85}@media(max-width:750px){.screen{grid-template-columns:1fr}.right{position:absolute;inset:0;opacity:.18}.left{position:relative;z-index:2;background:#06111bc9;padding:8vw}.credit{display:none}h1{font-size:10vw}p{font-size:5.5vw}}</style></head><body><main class="screen"><section class="left"><div class="eyebrow" id="topic"></div><h1 id="title"></h1><p id="a"></p><p class="example" id="b"></p></section><section class="right"><img id="pic" alt="Authentic digitized historic document"><div class="credit" id="credit"></div></section></main><nav class="toolbar"><button onclick="move(-1)">◀ BACK</button><span id="count"></span><button onclick="move(1)">NEXT ▶</button><button onclick="document.documentElement.requestFullscreen?.()">FULL SCREEN ⛶</button></nav><script>const slides=[["MISSION BRIEFING","THE CONSTITUTION IS MISSING","To open the vault, you must understand how the U.S. government works.","Your job: learn the evidence, then solve the mystery.","https://constitutioncenter.org/images/uploads/general/CONST_img01.jpg","Original U.S. Constitution — National Constitution Center"],["REPUBLIC","WE ELECT PEOPLE TO MAKE LAWS","A republic is a country where people choose leaders to represent them.","REAL LIFE: Voters elect members of Congress to vote on laws. We do not vote on every law ourselves.","https://chronicle.brightspotcdn.com/dims4/default/b4343c2/2147483647/strip/true/crop/2294x1529%2B327%2B0/resize/840x560%21/quality/90/?url=http%3A%2F%2Fchronicle-brightspot.s3.us-east-1.amazonaws.com%2F52%2F6f%2Fda52b931441bab4cf5245e56646d%2Fcapitol052820.jpg","U.S. Capitol photograph — Chronicle of Higher Education"],["POPULAR SOVEREIGNTY","POWER STARTS WITH THE PEOPLE","“We the People” means government gets its power from the people.","REAL LIFE: If voters dislike a lawmaker, they can vote for someone else in the next election.","https://aarp-states.brightspotcdn.com/f4/7c/627ac64b4420939d467545d0e1b0/gettyimages-142021101.jpg","Real polling-place photo — Getty Images / AARP"],["THE CONSTITUTION","THREE BIG JOBS","1. Sets up our government.  2. Gives leaders powers and limits.  3. Protects rights.","REAL LIFE: Congress makes federal laws, but it cannot pass laws that violate the Constitution.","https://constitutioncenter.org/images/uploads/general/CONST_img01.jpg","Original Constitution — National Constitution Center"],["SUPREME LAW","THE CONSTITUTION COMES FIRST","The U.S. Constitution is the highest law in the country.","REAL LIFE: A state cannot enforce a law that violates the U.S. Constitution.","https://constitutioncenter.org/images/uploads/general/CONST_img01.jpg","Original U.S. Constitution — National Constitution Center"],["AMENDMENTS","HOW CAN THE CONSTITUTION CHANGE?","An amendment is a change or addition to the Constitution.","USUAL PATH: 2/3 of both houses of Congress propose it → 3/4 of the states approve it.","https://upload.wikimedia.org/wikipedia/commons/7/79/Bill_of_Rights_Pg1of1_AC.jpg","Original Bill of Rights — U.S. National Archives / Wikimedia Commons"],["BILL OF RIGHTS","THE FIRST TEN AMENDMENTS","The Bill of Rights protects key freedoms and limits government power.","REAL LIFE: Government cannot ban peaceful criticism just because leaders dislike it.","https://upload.wikimedia.org/wikipedia/commons/7/79/Bill_of_Rights_Pg1of1_AC.jpg","Original Bill of Rights — U.S. National Archives / Wikimedia Commons"],["FIRST AMENDMENT","KNOW ALL FIVE FREEDOMS","SPEECH • RELIGION • PRESS • PEACEFUL ASSEMBLY • PETITION","REAL LIFE: Write a critical article, attend a peaceful protest, or ask officials to change a rule.","https://upload.wikimedia.org/wikipedia/commons/7/79/Bill_of_Rights_Pg1of1_AC.jpg","Original Bill of Rights — U.S. National Archives / Wikimedia Commons"],["RIGHTS IN REAL LIFE","CAN A CITY BAN PEACEFUL CRITICISM?","People can criticize government decisions. The First Amendment protects that right.","DISCUSS: What changes if the protest blocks a hospital entrance or threatens others?","https://news.lehigh.edu/sites/news/files/2020-12/DoingDemocracy-LeonardFreed-LUAG-LehighUniversity-main-1.jpg","1971 antiwar protest photo — Leonard Freed / Lehigh University"],["DECLARATION OF INDEPENDENCE","WHY DID THE COLONIES BREAK AWAY?","In 1776, the colonies declared independence from Great Britain.","Thomas Jefferson was the main writer. The Declaration explained why the colonies wanted to leave.","https://loc.gov/exhibits/creating-the-united-states/DeclarationofIndependence/BattleJoined/Assets/us0036_03_enlarge.jpg","1776 Declaration broadside — Library of Congress"],["TWO DIFFERENT DOCUMENTS","WHY vs. HOW","DECLARATION: Explains why the colonies became independent.","CONSTITUTION: Explains how the U.S. government is set up.","https://loc.gov/exhibits/creating-the-united-states/DeclarationofIndependence/BattleJoined/Assets/us0036_03_enlarge.jpg","Declaration of Independence — Library of Congress"],["NATURAL RIGHTS","LIFE, LIBERTY & HAPPINESS","The Declaration says people have rights that government should protect.","REAL HISTORY: In 1776, enslaved people, women, and many others were denied equal rights.","https://loc.gov/exhibits/creating-the-united-states/DeclarationofIndependence/BattleJoined/Assets/us0036_03_enlarge.jpg","Declaration of Independence — Library of Congress"],["REMEMBER THESE DATES","1776 → 1787 → 1788 → 1791","1776: Declaration. 1787: Constitution written.","1788: Constitution ratified. 1791: Bill of Rights ratified.","https://constitutioncenter.org/images/uploads/general/CONST_img01.jpg","Original U.S. Constitution — National Constitution Center"],["MARKET ECONOMY","BUYERS + BUSINESSES MAKE CHOICES","A market economy uses private businesses, buyers, competition, and prices.","REAL LIFE: Two sneaker stores compete. If one charges much more, shoppers may choose the other.","https://upload.wikimedia.org/wikipedia/commons/thumb/a/af/Ehrwald_-_SPAR_interior_2.jpg/1280px-Ehrwald_-_SPAR_interior_2.jpg","Real grocery store photograph — Wikimedia Commons"],["RULE OF LAW","NO ONE IS ABOVE THE LAW","Ordinary people and government leaders must follow the law.","REAL LIFE: A mayor cannot legally erase friends’ tickets just because they are friends.","https://constitutioncenter.org/images/uploads/general/CONST_img01.jpg","Original U.S. Constitution — National Constitution Center"],["DOCUMENTS THAT SHAPED GOVERNMENT","KNOW THE THREE KEY SOURCES","MAYFLOWER COMPACT: Agreement to govern together.","ARTICLES OF CONFEDERATION: First weak national plan. FEDERALIST PAPERS: Arguments for the new Constitution.","https://constitutioncenter.org/images/uploads/general/CONST_img01.jpg","Original U.S. Constitution — National Constitution Center"],["READY FOR THE GAME?","USE WHAT YOU JUST LEARNED","REPUBLIC • PEOPLE’S POWER • HIGHEST LAW • AMENDMENTS • RIGHTS","INDEPENDENCE • DOCUMENTS • MARKET ECONOMY • RULE OF LAW","https://constitutioncenter.org/images/uploads/general/CONST_img01.jpg","Original U.S. Constitution — National Constitution Center"]];let i=0;function show(){const s=slides[i];for(const [id,v] of [['topic',s[0]],['title',s[1]],['a',s[2]],['b',s[3]],['credit',s[5]]])document.getElementById(id).textContent=v;document.getElementById('pic').src=s[4];document.getElementById('count').textContent=(i+1)+' / '+slides.length;}function move(n){i=Math.max(0,Math.min(slides.length-1,i+n));show();}document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();move(1)}if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}});show();</script></body></html>
