<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FRIDAY 4 · THE 1776 FILES</title><style>
:root{--ink:#2b211b;--paper:#f6ebd2;--rust:#af4d35;--gold:#deb16b;--green:#2e6655;--shadow:#30231c}*{box-sizing:border-box}body{margin:0;background:repeating-linear-gradient(0deg,#292320,#292320 12px,#302825 12px,#302825 24px);font-family:Georgia,'Times New Roman',serif;color:var(--ink)}button{font:inherit;cursor:pointer}button:focus-visible{outline:4px solid #e7aa48;outline-offset:2px}#screen{max-width:1200px;min-height:100dvh;margin:auto;padding:21px 26px 90px;background:var(--paper);border-left:12px ridge #9a7b55;border-right:12px ridge #9a7b55;box-shadow:0 0 45px #0009}.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;border-bottom:3px solid var(--ink);padding-bottom:11px}.brand{font:bold 19px Arial,sans-serif;letter-spacing:3px}.pill{font:bold 16px Arial,sans-serif;background:#2d3b34;color:white;padding:9px 14px;border-radius:5px}.heading{font-size:clamp(39px,5.6vw,77px);line-height:1.01;margin:26px 0 12px;letter-spacing:-2px}.lead{font-size:clamp(21px,2.2vw,29px);line-height:1.4;max-width:900px}.page{background:#fff9e9;border:2px solid #9c7853;border-radius:5px;padding:clamp(17px,2vw,26px);margin:17px 0;box-shadow:6px 7px #4e3e32}.caption{font:bold 14px Arial,sans-serif;letter-spacing:3px;color:#a04b30;margin-bottom:12px}.learn{background:#e7dfbf;border-left:9px solid #547b68}.learn p,.page p{font-size:clamp(20px,1.8vw,25px);line-height:1.35}.actions{display:flex;gap:12px;flex-wrap:wrap}.btn{font:bold 20px Arial,sans-serif;padding:15px 19px;border:2px solid #2d2822;border-radius:4px;background:#e7c389;box-shadow:4px 4px #453a2d}.btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px #453a2d}.btn.secondary{background:#f7f1e5}.btn.selected{background:#8bc4aa}.btn.bad{background:#dfa6a0}.flex{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.option{display:block;width:100%;background:#f3e7cd;border:2px solid #a1825c;border-radius:5px;padding:20px;text-align:left;font-size:clamp(20px,1.8vw,25px);font-weight:bold;min-height:76px}.option:hover{background:#e9cfaa}.option.done{opacity:.5}.note{border:2px dashed #a96148;padding:16px 20px;background:#f2ddbb;font-size:21px;line-height:1.35}.note strong{display:block;margin-bottom:9px}.slots{display:flex;gap:10px;flex-wrap:wrap;min-height:60px;margin:12px 0}.slot{background:#d4e2d0;padding:12px 17px;font-size:20px;border:2px solid var(--green)}.progress{display:flex;gap:7px;margin:15px 0}.progress span{flex:1;height:13px;background:#cebca0;border:1px solid #8e795d}.progress .full{background:var(--green)}.foot{position:fixed;bottom:0;left:0;right:0;background:#241d19;color:#fff;display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;padding:11px;font: bold 16px Arial,sans-serif}.foot button{background:#e9bc6a;color:#241d19;padding:10px 16px;font:bold 17px Arial,sans-serif;border:0;border-radius:5px}.map{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0}.pin{background:#e7d6b5;border:3px solid #836b52;min-height:107px;padding:12px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:6px;font:bold 17px Arial,sans-serif}.pin strong{font: bold 31px Georgia}.pin.active{background:#e2bb72}.pin.solved{background:#b3d2bc}.pin[disabled]{cursor:default}.count{font:bold 25px Arial,sans-serif;color:#8f3e2e}.big{font-size:clamp(27px,3.8vw,48px);font-weight:bold;line-height:1.2}.stamp{font-size:72px;border:7px double var(--rust);padding:14px;display:inline-block;transform:rotate(-6deg);color:var(--rust)}@media(max-width:690px){#screen{padding:15px 14px 96px;border-width:4px}.flex,.map{grid-template-columns:repeat(2,1fr)}.heading{font-size:40px}.foot{font-size:12px}.btn{font-size:16px}}</style></head><body><main id="screen"></main><div class="foot"><span>1776 FILES · HISTORY DETECTIVE</span><button id="homebtn">CASE BOARD</button><span id="footprogress"></span></div><script>
const rooms=[{"label":"01 • ARRIVAL","title":"THE FIRST INHABITANTS","clue":"A map claims nobody lived in North America before European ships arrived. Find the lie.","learn":"Native Americans lived throughout North America long before Europeans arrived. European colonists came for many reasons, including religion, freedom, and economic opportunity.","type":"sort","prompt":"Sort each evidence card into the correct file.","entries":[["Native nations had their own governments before Europeans arrived","TRUE"],["European settlers found an empty continent","FALSE"],["Some settlers came for land and opportunity","TRUE"],["All settlers had exactly the same reasons","FALSE"],["Native nations had different cultures and traditions","TRUE"]],"q":74,"test":"Who lived in America before Europeans arrived?","answer":"Native Americans","choices":["Native Americans","Pilgrims","British governors","French soldiers"]},{"label":"02 • HIDDEN CARGO","title":"THE FORCED JOURNEY","clue":"A shipping record describes human beings as property. Identify what it reveals.","learn":"Enslaved Africans were taken to the Americas against their will and sold. Slavery was central to colonial economies and denied basic freedom and humanity.","type":"evidence","prompt":"Which label best describes the record?","options":["Voluntary travel","The forced enslavement of Africans","A free trade agreement"],"correct":1,"q":75,"test":"What group was taken and sold as slaves?","answer":"Africans","choices":["Africans","European nobles","British settlers","French soldiers"]},{"label":"03 • TAX PROTEST","title":"THE KING’S DEMAND","clue":"A colonist found this message: “You must pay taxes. You cannot vote for the people making the rules.”","learn":"Many colonists opposed British taxes because they had no elected representatives in Parliament. “Taxation without representation” became a major complaint.","type":"evidence","prompt":"Which demand would best explain the colonists’ anger?","options":["A tax without a voice in government","The colonies chose their own tax laws","Britain offered free land"],"correct":0,"q":77,"test":"Name one reason Americans declared independence.","answer":"Taxation without representation","choices":["Taxation without representation","The Civil War","The Louisiana Purchase","The signing of the Constitution"]},{"label":"04 • DOCUMENT LAB","title":"A DECLARATION IS MISSING","clue":"A torn document says: “We declare these colonies free and independent states.” Restore its identity.","learn":"The Declaration of Independence was adopted July 4, 1776. Thomas Jefferson was its main writer. It announced separation from Britain; it did not set up today’s three branches.","type":"assemble","prompt":"Put these events in order:","entries":["Colonists challenge British rule","Jefferson helps draft the Declaration","Declaration adopted in 1776"],"q":78,"test":"Who wrote the Declaration of Independence?","answer":"Thomas Jefferson","choices":["Thomas Jefferson","Alexander Hamilton","George Washington","John Jay"]},{"label":"05 • BATTLE MAP","title":"THE REVOLUTION BEGINS","clue":"A dispatch from the Continental Army names a war and several important places. Match the evidence.","learn":"The American Revolutionary War was fought to win independence from Britain. Bunker Hill, Saratoga, Valley Forge, Trenton, and Yorktown are key events.","type":"sort","prompt":"Which items belong in a Revolutionary War evidence file?","entries":[["Saratoga helped secure French support","TRUE"],["Gettysburg occurred during the Revolutionary War","FALSE"],["Yorktown was a major British defeat","TRUE"],["The Declaration immediately ended the war","FALSE"],["Washington led the Continental Army","TRUE"]],"q":80,"test":"Name one important American Revolution event.","answer":"Battle of Yorktown","choices":["Battle of Saratoga","Battle of Gettysburg","Battle of Antietam","Battle of Midway"]},{"label":"06 • COLONY VAULT","title":"THIRTEEN KEYS","clue":"A locked map needs five names of original states. Select the real colonies.","learn":"The original 13 states came from the 13 British colonies. Examples include Virginia, Massachusetts, New York, Pennsylvania, and Georgia.","type":"sort","prompt":"Mark whether each state was one of the original 13.","entries":[["Virginia","TRUE"],["California","FALSE"],["Georgia","TRUE"],["Pennsylvania","TRUE"],["Texas","FALSE"],["Massachusetts","TRUE"]],"q":81,"test":"Name five original states.","answer":"Virginia, Massachusetts, New York, Pennsylvania, Georgia","choices":["Virginia, Massachusetts, New York, Pennsylvania, Georgia","California, Texas, Florida, Iowa, Nevada","Virginia, California, Texas, New York, Ohio","Alaska, Hawaii, Oregon, Nevada, Utah"]},{"label":"07 • FOUNDERS FILES","title":"WHO WROTE WHAT?","clue":"Four historical figures left notes behind. Reconnect them to their accomplishments.","learn":"Washington commanded the Continental Army and became the first president. Jefferson wrote the Declaration. Madison is called the Father of the Constitution. Hamilton helped write the Federalist Papers and became the first Treasury secretary.","type":"match","prompt":"Match each founder to the correct role.","entries":[["George Washington","First U.S. president"],["Thomas Jefferson","Declaration writer"],["James Madison","Father of the Constitution"],["Alexander Hamilton","First Treasury secretary"]],"q":88,"test":"What is James Madison famous for?","answer":"Father of the Constitution","choices":["Father of the Constitution","First chief justice","Author of the Emancipation Proclamation","Commander of the British army"]},{"label":"08 • FINAL ARCHIVE","title":"THE NEW GOVERNMENT","clue":"After independence, the country still needed a strong plan for government. Rebuild the final document trail.","learn":"The Constitution was written in 1787. The Federalist Papers were essays supporting its approval and explaining the plan. Alexander Hamilton, James Madison, and John Jay wrote them.","type":"assemble","prompt":"Arrange the founding documents from earliest to latest.","entries":["Declaration of Independence adopted (1776)","Articles of Confederation ratified (1781)","Constitution written (1787)","Bill of Rights ratified (1791)"],"q":83,"test":"Name one writer of the Federalist Papers.","answer":"Alexander Hamilton","choices":["Alexander Hamilton","Abraham Lincoln","Patrick Henry","King George III"]}];const extras=[["73","Why did some colonists come to America?","Religious freedom",["Religious freedom","To join the United Nations","To fight in the Civil War","To build the White House"]],["76","What war won independence from Britain?","American Revolution",["American Revolutionary War","Civil War","War of 1812","Mexican American War"]],["79","When was the Declaration adopted?","July 4, 1776",["July 4, 1776","September 17, 1787","July 4, 1789","December 15, 1791"]],["82","What founding document was written in 1787?","U.S. Constitution",["U.S. Constitution","Bill of Rights","Emancipation Proclamation","Mayflower Compact"]],["84","Why were the Federalist Papers important?","They supported approving the Constitution",["To support the Constitution","To declare war on Britain","To end the Civil War","To replace the Declaration"]],["85","Name one thing Benjamin Franklin did.","Inventor",["Inventor and diplomat","First president","Civil War general","Writer of the Emancipation Proclamation"]],["86","Name one thing George Washington did.","First president",["First president","Author of the Gettysburg Address","British king","Leader of the Confederacy"]],["87","Name one thing Thomas Jefferson did.","Wrote the Declaration",["Main writer of the Declaration","British general","Writer of the 13th Amendment","First chief justice"]],["89","Name one thing Alexander Hamilton did.","First Secretary of the Treasury",["First Treasury secretary","Confederate president","First chief justice","British general"]]];
const state={phase:'intro',room:0,sub:'learn',done:[],answers:[],sortIndex:0,assem:[],matchIndex:0,miniDone:false,wrong:0,clues:0,extraIndex:0,feedback:''};const $=s=>document.querySelector(s);const esc=t=>String(t).replaceAll('&','&amp;').replaceAll('<','&lt;');const bt=(label,act,arg='',klass='btn')=>'<button class="'+klass+'" data-act="'+act+'" data-arg="'+esc(arg)+'">'+label+'</button>';function layout(body){$('#screen').innerHTML='<div class="top"><div class="brand">TOP SECRET · AMERICAN HISTORY</div><div class="pill">EVIDENCE '+state.done.length+' / 8</div></div><div class="progress">'+rooms.map((r,i)=>'<span class="'+(state.done.includes(i)?'full':'')+'"></span>').join('')+'</div>'+body;$('#footprogress').textContent='FILES '+state.done.length+'/8'}
function render(){if(state.phase==='intro'){layout('<div class="caption">CLASSIFIED FILE · OPEN 1776</div><h1 class="heading">THE 1776 FILES</h1><div class="page"><div class="big">History has been erased.</div><p class="lead">Travel through eight evidence rooms. Rebuild the story of how the United States began. Every clue unlocks a piece of the final archive.</p><div class="note">HOW TO PLAY: Read a short case note, complete its evidence task, then answer one test question. Use the case board to choose your next file.</div></div>'+bt('OPEN INVESTIGATION →','board'));return}if(state.phase==='board'){layout('<h1 class="heading">THE CASE BOARD</h1><p class="lead">Pick an unsolved file. Each one contains a different piece of American history.</p><div class="map">'+rooms.map((r,i)=>'<button class="pin '+(state.done.includes(i)?'solved':'')+'" data-act="enter" data-arg="'+i+'"><strong>'+(state.done.includes(i)?'✓':String(i+1).padStart(2,'0'))+'</strong>'+esc(r.title)+'</button>').join('')+'</div>'+(state.done.length===rooms.length?bt('OPEN FINAL VAULT →','final'):''));return}if(state.phase==='final'){layout('<div class="caption">ALL EVIDENCE RECOVERED</div><h1 class="heading">THE FINAL VAULT</h1><div class="page"><div class="stamp">CASE CLOSED</div><p class="lead">You restored eight missing history files. Now finish these last pieces of exam evidence.</p><div class="count">FINAL FACT '+(state.extraIndex+1)+' / '+extras.length+'</div><div class="big">'+esc(extras[state.extraIndex][1])+'</div><div class="note">Answer correctly to unlock the next file. No skipping.</div><div class="flex">'+extras[state.extraIndex][3].map((v,j)=>bt(esc(v),'finalAnswer',String(j),'option')).join('')+'</div><div class="note" aria-live="polite">'+esc(state.feedback)+'</div></div>');return}if(state.phase==='end'){layout('<h1 class="heading">ARCHIVE RESTORED</h1><div class="page"><div class="stamp">MISSION DONE</div><p class="lead">You recovered the founding story and practiced USCIS 2025 civics questions 73–89. Your report is ready.</p>'+bt('RESTART INVESTIGATION','restart')+'</div>');return}const r=rooms[state.room];let inner='<div class="caption">'+esc(r.label)+' · CASE '+(state.room+1)+' OF 8</div><h1 class="heading">'+esc(r.title)+'</h1><p class="lead">'+esc(r.clue)+'</p>';if(state.sub==='learn'){inner+='<section class="page learn"><div class="caption">READ YOUR EVIDENCE FIRST</div><p>'+esc(r.learn)+'</p></section>'+bt('INVESTIGATE →','task')}else if(state.sub==='task'){inner+='<section class="page"><div class="caption">EVIDENCE TASK</div><h2>'+esc(r.prompt)+'</h2>';if(r.type==='sort'){const e=r.entries[state.sortIndex];inner+='<div class="count">CARD '+(state.sortIndex+1)+' / '+r.entries.length+'</div><p class="big">'+esc(e[0])+'</p><div class="actions">'+bt('✓ BELONGS IN FILE','sort','TRUE')+bt('✕ DOES NOT BELONG','sort','FALSE')+'</div>'}else if(r.type==='evidence'){inner+='<div class="flex">'+r.options.map((o,j)=>bt(esc(o),'option',String(j),'option')).join('')+'</div>'}else if(r.type==='assemble'){inner+='<div class="caption">YOUR TIMELINE</div><div class="slots">'+state.assem.map(x=>'<span class="slot">'+esc(x)+'</span>').join('')+'</div><div class="flex">'+r.entries.filter(x=>!state.assem.includes(x)).sort().map(x=>bt(esc(x),'assembly',x,'option')).join('')+'</div>'}else if(r.type==='match'){const e=r.entries[state.matchIndex];inner+='<p class="big">'+esc(e[0])+'</p><div class="flex">'+r.entries.map((x,j)=>bt(esc(x[1]),'match',String(j),'option')).join('')+'</div>'}inner+='</section>'}else if(state.sub==='test'){inner+='<section class="page"><div class="caption">CIVICS TEST FILE · QUESTION '+r.q+'</div><h2>'+esc(r.test)+'</h2><div class="note">Choose the right answer to complete the case. You must get it correct.</div><div class="flex">'+r.choices.map((v,j)=>bt(esc(v),'testAnswer',String(j),'option')).join('')+'</div><div class="note" aria-live="polite">'+esc(state.feedback)+'</div></section>'}layout(inner)}
function react(act,arg){const r=rooms[state.room];if(act==='board'){state.phase='board'}if(act==='enter'){let j=Number(arg);if(state.done.includes(j))return;state.phase='room';state.room=j;state.sub='learn';state.sortIndex=0;state.assem=[];state.matchIndex=0;state.feedback=''}if(act==='task')state.sub='task';if(act==='sort'){if(arg===r.entries[state.sortIndex][1]){state.sortIndex++;if(state.sortIndex===r.entries.length)state.sub='test'}else{state.wrong++;alert('Check the evidence again. That label does not fit.')}}if(act==='option'){if(Number(arg)===r.correct)state.sub='test';else alert('Not quite. Read the evidence and try again.')}if(act==='assembly'){if(arg===r.entries[state.assem.length]){state.assem.push(arg);if(state.assem.length===r.entries.length)state.sub='test'}else alert('Not the next event. Try the timeline again.')}if(act==='match'){if(Number(arg)===state.matchIndex){state.matchIndex++;if(state.matchIndex===r.entries.length)state.sub='test'}else alert('That is another founder’s role. Try again.')}if(act==='testAnswer'){if(state.phase==='room'&&state.sub==='test'){if(Number(arg)===0){if(!state.done.includes(state.room))state.done.push(state.room);state.phase='board';state.feedback=''}else{state.wrong++;state.feedback='Incorrect. Review the case notes and try again.'}}}if(act==='final'){if(state.done.length!==rooms.length)return;state.phase='final';state.extraIndex=0;state.feedback=''}if(act==='finalAnswer'){if(state.phase==='final'){if(Number(arg)===0){state.extraIndex++;state.feedback='';if(state.extraIndex>=extras.length)state.phase='end'}else{state.wrong++;state.feedback='Incorrect. Check the evidence and choose again.'}}}if(act==='restart'){state.phase='intro';state.done=[];state.extraIndex=0;state.feedback=''}render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b)react(b.dataset.act,b.dataset.arg)});$('#homebtn').onclick=()=>{state.phase='board';render()};render();
</script></body></html>
