'use strict';const canvas=document.querySelector('#world'),ctx=canvas.getContext('2d'),wrap=document.querySelector('#wrap'),title=document.querySelector('#dialogTitle'),body=document.querySelector('#dialogBody'),options=document.querySelector('#options'),sceneLabel=document.querySelector('#sceneLabel');ctx.imageSmoothingEnabled=false;

function building(b){const d=visited.has(b.id);ctx.fillStyle='#513f61';ctx.fillRect(b.x+7,b.y+9,b.w,b.h);ctx.fillStyle=b.c;ctx.fillRect(b.x,b.y,b.w,b.h);ctx.fillStyle=b.roof;ctx.beginPath();ctx.moveTo(b.x-10,b.y+7);ctx.lineTo(b.x+b.w/2,b.y-38);ctx.lineTo(b.x+b.w+10,b.y+7);ctx.fill();ctx.fillStyle='#fdf8e6';ctx.fillRect(b.x+20,b.y+45,55,51);ctx.fillRect(b.x+b.w-76,b.y+45,55,51);ctx.fillStyle='#5e729f';ctx.fillRect(b.x+29,b.y+53,36,34);ctx.fillRect(b.x+b.w-67,b.y+53,36,34);ctx.fillStyle='#fff9e9';ctx.fillRect(b.x+18,b.y+14,b.w-36,32);ctx.fillStyle='#352842';ctx.textAlign='center';ctx.font='bold 17px monospace';ctx.fillText(b.short,b.x+b.w/2,b.y+37);ctx.font='33px sans-serif';ctx.fillText(d?'✅':b.icon,b.x+b.w/2,b.y+128);if(d){ctx.fillStyle='#48b56f';ctx.fillRect(b.x+4,b.y+b.h-11,b.w-8,8)}}
function draw(){bg();for(let i=0;i<45;i++){let x=(i*79+24)%1200,y=(i*139+29)%650;let covered=buildings.some(b=>x>=b.x-20&&x<=b.x+b.w+20&&y>=b.y-30&&y<=b.y+b.h+12);if(!covered){ctx.fillStyle='#6bbc8d';ctx.fillRect(x,y,6,13);ctx.fillRect(x-5,y+4,17,4)}}buildings.forEach(building);ctx.fillStyle='#352842';ctx.fillRect(player.x-16,player.y+12,32,6);ctx.fillStyle='#fcbd83';ctx.fillRect(player.x-13,player.y-24,26,21);ctx.fillStyle='#50467a';ctx.fillRect(player.x-15,player.y-31,30,10);ctx.fillStyle='#ec5795';ctx.fillRect(player.x-18,player.y-2,36,25);ctx.fillStyle='#352842';ctx.fillRect(player.x-13,player.y+22,10,12);ctx.fillRect(player.x+4,player.y+22,10,12);ctx.fillStyle='#fff';ctx.fillRect(player.x+3,player.y-17,5,5);ctx.fillStyle='#222';ctx.fillRect(player.x+5,player.y-16,3,3);const near=closest();document.querySelector('#hint').textContent=near?'PRESS E — '+near.name+(visited.has(near.id)?' ✓ COMPLETED':' · MISSION AVAILABLE'):'MOVE AROUND THE TOWN · VISIT THE BUILDINGS';document.querySelector('#stamp').textContent='⭐ '+visited.size+' / 7 STAMPS';document.querySelector('#turn').textContent=visited.size>=6?'FINAL DAY':visited.size>=3?'DAY 2':'DAY 1'}
function closest(){let best=null,dist=999;for(const b of buildings){let cx=Math.max(b.x-10,Math.min(player.x,b.x+b.w+10)),cy=Math.max(b.y-40,Math.min(player.y,b.y+b.h+20)),d=Math.hypot(cx-player.x,cy-player.y);if(d<dist){dist=d;best=b}}return dist<88?best:null}
function move(dx,dy){if(locked)return;player.x=Math.max(18,Math.min(1182,player.x+dx));player.y=Math.max(24,Math.min(610,player.y+dy));draw()}function hide(){wrap.classList.remove('open');locked=false;current=null;draw()}function show(t,label,p,opts){locked=true;wrap.classList.add('open');title.textContent=t;sceneLabel.textContent=label;body.innerHTML=p;options.innerHTML='';opts.forEach(o=>{let btn=document.createElement('button');btn.textContent=o[0];btn.addEventListener('click',o[1]);options.appendChild(btn)})}function explain(t,txt,cb){show(t,'★ CIVICS UNLOCKED ★','<p>'+txt+'</p>',[['CONTINUE →',cb]])}function finish(id){visited.add(id);explain('MISSION COMPLETE!','You earned a town stamp. Move to another building. Your decisions are changing election week!',hide)}function promptMission(b){if(visited.has(b.id)){show('ALREADY CLEARED','STAMPS','<p>This location is complete. Explore another part of town.</p>',[['BACK TO TOWN',hide]]);return}if(b.id==='final'&&visited.size<6){show('THE FINAL STAGE IS LOCKED','ELECTION WEEK','<p>Complete the six town missions first. You have '+visited.size+' of 6.</p>',[['BACK TO TOWN',hide]]);return}missions[b.id]()}
const lessons={
 vote:['VOTING HALL','A U.S. citizen who is 18 or older may vote if they meet their state’s rules. Iowa voters also need to check registration and ID rules.','SORT THE VOTER CARDS'],

let missionBusy=false;let questScores={};let gameplayTicks=0;let stepTicker=null;const esc=t=>String(t).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
function beginQuest(id){let a=lessons[id];show('WELCOME TO '+a[0],'★ LEARN BEFORE YOU PLAY ★','<p style="font-size:1.18em;font-weight:800">'+a[1]+'</p><div class="note">YOUR MISSION: '+a[2]+'</div>',[['PLAY THE MINI-GAME →',()=>mini[id]()],['COME BACK LATER',hide]])}

function missionComplete(id,description){visited.add(id);record.facts++;panel('⭐ QUEST CLEARED!','TOWN STAMP EARNED',progress(description)+'<p>Explore another building. Every completed station brings you closer to Election Night.</p>',[['BACK TO PIXEL TOWN',hide]])}
function promptMission(b){if(b.id==='final'){if(visited.size<6){panel('ELECTION NIGHT IS LOCKED','THE GRAND FINALE','<p>Finish all six station games first. You have '+visited.size+' of 6 stamps.</p>',[['BACK TO TOWN',hide]]);return}mini.final();return}if(visited.has(b.id)){panel('YOU CLEARED THIS STATION','STAMP COLLECTED','<p>Nice work! Find a building without a green check mark.</p>',[['BACK TO TOWN',hide]]);return}beginQuest(b.id)}
function createCards(arr,callback,heading){let host=document.createElement('div');host.style.cssText='display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:10px 0';arr.forEach((c,i)=>{let b=document.createElement('button');b.textContent=c;b.style.cssText='background:#fff5ce;color:#403450;border:3px solid #8f69a7;border-radius:10px;padding:13px;min-height:68px;text-align:center;font-weight:900;cursor:pointer;font-size:clamp(15px,2vw,23px)';b.onclick=()=>callback(i,b);host.append(b)});body.append(host);return host}
const mini={
 vote(){const voters=[['Alex, 18, U.S. citizen and registered','YES','Eligible for this activity: 18+, citizen, and registered.'],['Jess, 16, U.S. citizen','NOT YET','The federal voting age is 18.'],['Maya, 30, U.S. citizen and registered','YES','Adults who meet voting rules may vote.'],['Sam, 23, permanent resident, not a citizen','NOT YET','Federal elections are for eligible U.S. citizens.'],['Taylor, 17, turns 18 after Election Day','NOT YET','The person must be 18 by Election Day.'],['Jordan, 19, U.S. citizen and registered','YES','This voter meets the basic facts in the card.']];let idx=0,points=0;function turn(){if(idx>=voters.length){missionComplete('vote','You helped '+points+' of 6 people correctly. In real life, check state registration rules too.');return}let v=voters[idx];panel('VOTER CHECK-IN','🗳️ ID DESK · CARD '+(idx+1)+' / 6','<p>Decide whether this person can vote in a federal election, based on the details on the card.</p>'+progress(esc(v[0])),[['LET THEM VOTE',()=>ans('YES')],['NOT ELIGIBLE YET',()=>ans('NOT YET')]]);function ans(x){if(x===v[1]){points++;idx++;turn()}else panel('DOUBLE-CHECK THE RULE','VOTER TRAINING',progress(v[2]),[['TRY THIS CARD AGAIN',turn]])}}turn()},
 news(){const leads=[['VIRAL POST','An anonymous video claims polling places close at noon.'],['OFFICIAL WEBSITE','The Iowa Secretary of State election page lists voting hours.'],['GROUP CHAT','A friend says you can cast a ballot by text.'],['COUNTY ELECTION OFFICE','A county election office confirms how ballots are cast.']];let verified=new Set();function scene(){panel('STOP THE VOTING RUMOR','📰 INVESTIGATION · '+verified.size+' / 2 SOURCES VERIFIED','<p>A rumor says: “Vote by texting a candidate’s name.” Tap TWO reliable sources to check the claim.</p>');createCards(leads.map(a=>a[0]+'\n'+a[1]),(i,b)=>{if(i===1||i===3){verified.add(i);b.style.background='#a6eab7';b.textContent='✓ VERIFIED '+leads[i][0];if(verified.size===2)panel('THE STORY IS READY','📰 WRITE YOUR HEADLINE','<p>Both official sources confirm voting does not happen by texting a candidate.</p>',[['PUBLISH: “TEXT VOTING IS A RUMOR”',()=>missionComplete('news','You checked two official sources before publishing.')],['PUBLISH THE FALSE RUMOR',()=>panel('CHECK YOUR EVIDENCE','EDITOR’S DESK','<p>The newsroom must report what reliable sources show.</p>',[['BACK TO EDITOR',scene]])]])}else{b.style.background='#ffc7ce';b.textContent='? NOT VERIFIED';}},'SOURCES')}scene()},
 rights(){let people=[{name:'Student',reason:'Free speech'},{name:'Parent',reason:'Peaceful assembly'},{name:'Reporter',reason:'Freedom of the press'},{name:'Neighbor',reason:'Petition the government'},{name:'Shop owner',reason:'Keep entrances clear'},{name:'Volunteer',reason:'Follow park safety rules'}];let invited=new Set();function scene(){panel('PLAN THE RALLY','📢 TALK TO YOUR NEIGHBORS','<p>Recruit four people for a peaceful rally. Tap characters around the park. Then choose your rally plan.</p>'+progress('PEOPLE RECRUITED: '+invited.size+' / 4'));createCards(people.map((p,i)=>(invited.has(i)?'✓ ':'👤 ')+p.name+' · '+p.reason),(i,b)=>{invited.add(i);b.style.background='#a6eab7';b.textContent='✓ '+people[i].name;if(invited.size>=4)panel('RALLY READY!','📢 FINAL EVENT','<p>People are ready to meet peacefully. What will your rally do?</p>',[['GATHER PEACEFULLY & LEAVE PATHS OPEN',()=>missionComplete('rights','You used speech and assembly rights while respecting safety rules.')],['BLOCK EMERGENCY VEHICLES',()=>panel('PLAN NEEDS A CHANGE','FIRST AMENDMENT','<p>The right to protest does not mean emergency access can be blocked.</p>',[['FIX THE RALLY PLAN',scene]])]])});}scene()},
 civic(){const steps=['Explain the crosswalk problem','Collect real signatures','Bring the request to city hall','Attend the public meeting'];let done=[];function scene(){if(done.length===4){panel('PETITION COMPLETE!','🏛️ CITY HALL','<p>Your neighbors ask for a safer crosswalk. You have written, signed, and delivered the request.</p>',[['HAND IT TO CITY COUNCIL',()=>missionComplete('civic','You practiced petitioning the government; officials must consider the request through their process.')]]);return}panel('MAKE CITY HALL LISTEN','🏛️ BUILD THE PETITION · '+done.length+' / 4 STEPS','<p>Put the petition steps in the right order. Select the NEXT thing your group should do.</p>');createCards(steps.map((x,i)=>(done.includes(i)?'✓ ':'')+x),(i,b)=>{if(done.includes(i))return;if(i===done.length){done.push(i);scene()}else panel('WRONG ORDER','TRY THE NEXT STEP',progress('First describe the problem. Then collect signatures, deliver the petition, and attend the meeting.'),[['TRY AGAIN',scene]])})}scene()},
 citizen(){const pairs=[['BORN IN THE U.S.','Generally a citizen at birth'],['NATURALIZATION','Legal process to become a citizen'],['OATH OF ALLEGIANCE','Promise to support the Constitution'],['JURY DUTY','Serve when summoned and eligible'],['PLEDGE OF ALLEGIANCE','Promise of loyalty to the flag and republic'],['TAXES','Pay what the law requires']];let cards=[];pairs.forEach((p,i)=>{cards.push({id:i,t:p[0]},{id:i,t:p[1]})});cards=[cards[4],cards[1],cards[9],cards[6],cards[0],cards[11],cards[3],cards[8],cards[10],cards[5],cards[7],cards[2]];let selected=[],solved=new Set(),errors=0;function scene(){panel('MEMORY MATCH','📜 FLIP CARDS · '+solved.size+' / 6 PAIRS','<p>Flip two cards. Match each civics word with its meaning.</p>');let host=createCards(cards.map((c,i)=>solved.has(c.id)?'✓ MATCHED':'❔ CARD '+(i+1)),(i,b)=>{if(solved.has(cards[i].id)||selected.some(x=>x===i)||selected.length>=2)return;selected.push(i);b.textContent=cards[i].t;b.style.background='#fff';if(selected.length===2){let [a,z]=selected;const match=cards[a].id===cards[z].id;setTimeout(()=>{if(match)solved.add(cards[a].id);else errors++;selected=[];if(solved.size===6){panel('ALL PAIRS FOUND!','📜 CIVICS EXPERT',progress('You matched every citizenship and responsibility card.'),[['EARN YOUR STAMP',()=>missionComplete('citizen','You connected six important facts about citizens, oaths, and duties.')]])}else scene()},match?450:1050)}},'MEMORY');}scene()},
 tax(){let budget=100;let selected=[];const items=[['BUS ROUTE',60,'Helps workers travel'],['LIBRARY',30,'Free books and internet'],['CROSSWALK',40,'Safer route to school'],['PARK LIGHTS',20,'Safer evening spaces'],['SCHOOL MEALS',50,'Food for students'],['ROAD REPAIRS',40,'Fixes damaged streets']];function scene(){panel('RUN THE CITY BUDGET','💰 $'+budget+' LEFT','<p>The town has $100 in tax money. Fund at least TWO services. You cannot spend more than you have.</p>'+progress('FUNDED: '+(selected.length?selected.map(i=>items[i][0]).join(', '):'NOTHING YET')));createCards(items.map((v,i)=>(selected.includes(i)?'✓ ':'')+v[0]+' ($'+v[1]+')'),(i,b)=>{if(selected.includes(i))return;if(items[i][1]>budget){panel('NOT ENOUGH MONEY','CITY BUDGET','<p>You have only $'+budget+'. '+items[i][0]+' costs $'+items[i][1]+'. Pick something you can afford.</p>',[['BACK TO BUDGET',scene]]);return}selected.push(i);budget-=items[i][1];scene()});if(selected.length>=2){let btn=document.createElement('button');btn.textContent='✓ APPROVE THIS BUDGET';btn.style.cssText='background:#8de6ba;color:#173c2b;padding:12px;font-weight:900;border-radius:10px;grid-column:1/-1';btn.onclick=()=>panel('CITY BUDGET APPROVED','💰 YOUR PLAN','<p>You funded '+selected.map(i=>items[i][0]).join(' and ')+'. You have $'+budget+' left. Some other services must wait.</p>',[['EARN YOUR STAMP',()=>missionComplete('tax','You funded real public services and made choices with limited tax money.')]]);body.append(btn)}}scene()},
 final(){panel('ELECTION NIGHT IS HERE','🏆 FINAL TOWN MISSION','<p>All six areas are ready. Deliver the town’s election-night report!</p>'+progress('You learned voting, press rights, peaceful assembly, petitions, citizenship, and taxes.'),[['PREPARE THE REPORT',()=>{panel('FINAL NEWSROOM REPORT','🏆 CHOOSE WHAT TO REPORT','<p>Choose the TRUE statement to put on Election Night news.</p>',[['ALL CITIZENS MUST VOTE',()=>panel('TRY AGAIN','ELECTION NIGHT','<p>Voting is important, but the U.S. does not require everyone to vote.</p>',[['RETURN',mini.final]])],['CITIZENS MAY VOTE WHEN ELIGIBLE',()=>{visited.add('final');panel('🎉 YOU SAVED PIXEL TOWN!','ALL 7 STAMPS COLLECTED','<p>Congratulations! You helped six places around town and completed Election Night.</p>'+progress('CIVICS SKILLS: Voting · Free Press · Assembly · Petition · Citizenship · Taxes'),[['EXPLORE THE TOWN',hide],['PLAY AGAIN',reset]])}]])}]] )}
};
function finish(id){missionComplete(id,'Station complete!')}
function reset(){visited.clear();questScores={};player={...start};hide();draw()}
document.addEventListener('keydown',e=>{if(locked){if(e.key==='Escape')hide();return}let k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d','e',' '].includes(k))e.preventDefault();if(k==='arrowup'||k==='w')move(0,-25);if(k==='arrowdown'||k==='s')move(0,25);if(k==='arrowleft'||k==='a')move(-25,0);if(k==='arrowright'||k==='d')move(25,0);if(k==='e'||k===' '){let b=closest();if(b)promptMission(b)}});document.querySelector('#mapGuide').onclick=()=>show('THE TOWN MAP','GAME GUIDE','<p>Move around the town using the arrow keys. Stand near a building and press E to enter. Complete all six different mini-games to unlock the Election Stage in the middle.</p><div class="note">The class can vote together on what the character does next. Missions teach real civics facts.</div>',[['LET’S EXPLORE',hide]]);document.querySelector('#restart').onclick=()=>{if(confirm('Restart this adventure?'))reset()};document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{let d={up:[0,-25],down:[0,25],left:[-25,0],right:[25,0]};move(...d[b.dataset.m])});document.querySelector('#touchE').onclick=()=>{let b=closest();if(b)promptMission(b)};draw();
