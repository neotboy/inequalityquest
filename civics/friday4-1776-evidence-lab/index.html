<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1776 Files | Evidence Lab</title><style>
:root{--bg:#101c26;--paper:#f8efdd;--ink:#182a31;--red:#ab4236;--gold:#d2a55c;--green:#176456}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:18px/1.48 Arial,sans-serif;color:var(--ink)}button{cursor:pointer;font:inherit}button:focus-visible{outline:4px solid #f6c24e}.shell{max-width:1200px;margin:auto;padding:20px 24px 100px}.bar{display:flex;align-items:center;justify-content:space-between;color:#ffe3aa;font-weight:bold;letter-spacing:2px;gap:20px}.brand{font-size:23px}.meter{border:1px solid #af9d78;padding:8px 13px}.paper{background:var(--paper);border:7px solid #a88f6b;box-shadow:10px 12px 0 #0007;padding:clamp(20px,4vw,48px);margin-top:20px;min-height:450px}.tag{font-size:15px;font-weight:900;letter-spacing:3px;color:var(--red)}h1{font:700 clamp(38px,5vw,68px)/1.03 Georgia,serif;margin:16px 0 18px}h2{font:700 clamp(26px,3vw,36px)/1.2 Georgia,serif;margin:12px 0}p{font-size:clamp(18px,1.9vw,23px)}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.file{min-height:155px;background:#decba6;border:3px solid #776245;text-align:left;padding:15px;font-weight:bold;display:flex;flex-direction:column;justify-content:space-between}.file:hover,.choice:hover{background:#f1d496}.file strong{font:30px Georgia}.file.done{background:#bdd5c4;border-color:#176456}.file small{font-size:12px;letter-spacing:2px}.btn{padding:15px 20px;background:#efc675;color:#182a31;border:3px solid #6a4b2b;font-weight:900;box-shadow:4px 4px 0 #705a3f;margin:7px 8px 7px 0}.btn:disabled{opacity:.35;cursor:not-allowed}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:18px 0}.choice{padding:19px;text-align:left;border:2px solid #8b7055;background:#eee1c9;font-weight:700;min-height:70px}.clue{background:#e3d6bc;border-left:7px solid var(--gold);padding:18px 22px;margin:18px 0}.envelope{background:#fffcf3;border:2px dashed #976a46;padding:18px;margin:20px 0}.trail{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0}.piece{background:#c5dccc;border:2px solid #176456;padding:8px 12px;font-weight:bold}.feedback{min-height:46px;margin-top:14px;font-weight:bold;color:#8b342d}.hint{font-size:16px;color:#4d534e}.bottom{position:fixed;bottom:0;left:0;right:0;padding:12px;background:#101c26;color:white;border-top:3px solid #d2a55c;display:flex;justify-content:center;align-items:center;gap:20px}.bottom button{padding:10px 16px;background:#edc36d;border:0;font-weight:800}.stamp{display:inline-block;border:6px double var(--red);color:var(--red);font:900 35px Georgia;padding:16px;transform:rotate(-5deg)}
@media(max-width:700px){.shell{padding:10px 9px 100px}.paper{padding:16px}.board,.choices{grid-template-columns:repeat(2,1fr)}.file{min-height:125px}.bottom{font-size:14px}h1{font-size:36px}}
</style></head><body><div class="shell"><div class="bar"><span class="brand">THE 1776 FILES // EVIDENCE LAB</span><span class="meter" id="score">0 / 8 CASES</span></div><main class="paper" id="app"></main></div><footer class="bottom"><button id="board">CASE BOARD</button><span id="status">INVESTIGATION IN PROGRESS</span></footer><script>
const rooms=[{"label":"01 • ARRIVAL","title":"THE FIRST INHABITANTS","clue":"A map claims nobody lived in North America before European ships arrived. Find the lie.","learn":"Native Americans lived throughout North America long before Europeans arrived. European colonists came for many reasons, including religion, freedom, and economic opportunity.","type":"sort","prompt":"Sort each evidence card into the correct file.","entries":[["Native nations had their own governments before Europeans arrived","TRUE"],["European settlers found an empty continent","FALSE"],["Some settlers came for land and opportunity","TRUE"],["All settlers had exactly the same reasons","FALSE"],["Native nations had different cultures and traditions","TRUE"]],"q":74,"test":"Who lived in America before Europeans arrived?","answer":"Native Americans","choices":["British governors","French soldiers","Native Americans","Pilgrims"],"correctChoice":2},{"label":"02 • HIDDEN CARGO","title":"THE FORCED JOURNEY","clue":"A shipping record describes human beings as property. Identify what it reveals.","learn":"Enslaved Africans were taken to the Americas against their will and sold. Slavery was central to colonial economies and denied basic freedom and humanity.","type":"evidence","prompt":"Which label best describes the record?","options":["Voluntary travel","The forced enslavement of Africans","A free trade agreement"],"correct":1,"q":75,"test":"What group was taken and sold as slaves?","answer":"Africans","choices":["French soldiers","Africans","European nobles","British settlers"],"correctChoice":1},{"label":"03 • TAX PROTEST","title":"THE KING’S DEMAND","clue":"A colonist found this message: “You must pay taxes. You cannot vote for the people making the rules.”","learn":"Many colonists opposed British taxes because they had no elected representatives in Parliament. “Taxation without representation” became a major complaint.","type":"evidence","prompt":"Which demand would best explain the colonists’ anger?","options":["A tax without a voice in government","The colonies chose their own tax laws","Britain offered free land"],"correct":0,"q":77,"test":"Name one reason Americans declared independence.","answer":"Taxation without representation","choices":["The Civil War","The Louisiana Purchase","The signing of the Constitution","Taxation without representation"],"correctChoice":3},{"label":"04 • DOCUMENT LAB","title":"A DECLARATION IS MISSING","clue":"A torn document says: “We declare these colonies free and independent states.” Restore its identity.","learn":"The Declaration of Independence was adopted July 4, 1776. Thomas Jefferson was its main writer. It announced separation from Britain; it did not set up today’s three branches.","type":"assemble","prompt":"Put these events in order:","entries":["Colonists challenge British rule","Jefferson helps draft the Declaration","Declaration adopted in 1776"],"q":78,"test":"Who wrote the Declaration of Independence?","answer":"Thomas Jefferson","choices":["Thomas Jefferson","Alexander Hamilton","George Washington","John Jay"],"correctChoice":0},{"label":"05 • BATTLE MAP","title":"THE REVOLUTION BEGINS","clue":"A dispatch from the Continental Army names a war and several important places. Match the evidence.","learn":"The American Revolutionary War was fought to win independence from Britain. Bunker Hill, Saratoga, Valley Forge, Trenton, and Yorktown are key events.","type":"sort","prompt":"Which items belong in a Revolutionary War evidence file?","entries":[["Saratoga helped secure French support","TRUE"],["Gettysburg occurred during the Revolutionary War","FALSE"],["Yorktown was a major British defeat","TRUE"],["The Declaration immediately ended the war","FALSE"],["Washington led the Continental Army","TRUE"]],"q":80,"test":"Name one important American Revolution event.","answer":"Battle of Yorktown","choices":["Battle of Antietam","Battle of Midway","Battle of Saratoga","Battle of Gettysburg"],"correctChoice":2},{"label":"06 • COLONY VAULT","title":"THIRTEEN KEYS","clue":"A locked map needs five names of original states. Select the real colonies.","learn":"The original 13 states came from the 13 British colonies. Examples include Virginia, Massachusetts, New York, Pennsylvania, and Georgia.","type":"sort","prompt":"Mark whether each state was one of the original 13.","entries":[["Virginia","TRUE"],["California","FALSE"],["Georgia","TRUE"],["Pennsylvania","TRUE"],["Texas","FALSE"],["Massachusetts","TRUE"]],"q":81,"test":"Name five original states.","answer":"Virginia, Massachusetts, New York, Pennsylvania, Georgia","choices":["California, Texas, Florida, Iowa, Nevada","Virginia, California, Texas, New York, Ohio","Alaska, Hawaii, Oregon, Nevada, Utah","Virginia, Massachusetts, New York, Pennsylvania, Georgia"],"correctChoice":3},{"label":"07 • FOUNDERS FILES","title":"WHO WROTE WHAT?","clue":"Four historical figures left notes behind. Reconnect them to their accomplishments.","learn":"Washington commanded the Continental Army and became the first president. Jefferson wrote the Declaration. Madison is called the Father of the Constitution. Hamilton helped write the Federalist Papers and became the first Treasury secretary.","type":"match","prompt":"Match each founder to the correct role.","entries":[["George Washington","First U.S. president"],["Thomas Jefferson","Declaration writer"],["James Madison","Father of the Constitution"],["Alexander Hamilton","First Treasury secretary"]],"q":88,"test":"What is James Madison famous for?","answer":"Father of the Constitution","choices":["Commander of the British army","Father of the Constitution","First chief justice","Author of the Emancipation Proclamation"],"correctChoice":1},{"label":"08 • FINAL ARCHIVE","title":"THE NEW GOVERNMENT","clue":"After independence, the country still needed a strong plan for government. Rebuild the final document trail.","learn":"The Constitution was written in 1787. The Federalist Papers were essays supporting its approval and explaining the plan. Alexander Hamilton, James Madison, and John Jay wrote them.","type":"assemble","prompt":"Arrange the founding documents from earliest to latest.","entries":["Declaration of Independence adopted (1776)","Articles of Confederation ratified (1781)","Constitution written (1787)","Bill of Rights ratified (1791)"],"q":83,"test":"Name one writer of the Federalist Papers.","answer":"Alexander Hamilton","choices":["Patrick Henry","King George III","Alexander Hamilton","Abraham Lincoln"],"correctChoice":2}];
const extras=[["73","Why did some colonists come to America?","Religious freedom",["To join the United Nations","To fight in the Civil War","To build the White House","Religious freedom"],3],["76","What war won independence from Britain?","American Revolution",["Mexican American War","American Revolutionary War","Civil War","War of 1812"],1],["79","When was the Declaration adopted?","July 4, 1776",["July 4, 1789","December 15, 1791","July 4, 1776","September 17, 1787"],2],["82","What founding document was written in 1787?","U.S. Constitution",["U.S. Constitution","Bill of Rights","Emancipation Proclamation","Mayflower Compact"],0],["84","Why were the Federalist Papers important?","They supported approving the Constitution",["To replace the Declaration","To support the Constitution","To declare war on Britain","To end the Civil War"],1],["85","Name one thing Benjamin Franklin did.","Inventor",["First president","Civil War general","Writer of the Emancipation Proclamation","Inventor and diplomat"],3],["86","Name one thing George Washington did.","First president",["British king","Leader of the Confederacy","First president","Author of the Gettysburg Address"],2],["87","Name one thing Thomas Jefferson did.","Wrote the Declaration",["Main writer of the Declaration","British general","Writer of the 13th Amendment","First chief justice"],0],["89","Name one thing Alexander Hamilton did.","First Secretary of the Treasury",["First chief justice","British general","First Treasury secretary","Confederate president"],2]];
const s={view:'start',room:0,step:0,done:[],progress:0,wrong:0,feedback:'',final:0,selected:[],arranged:[]};
const root=document.getElementById('app');
const esc=t=>String(t).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');
const btn=(text,action,value='',cl='choice')=>'<button class="'+cl+'" data-a="'+action+'" data-v="'+esc(value)+'">'+esc(text)+'</button>';
function choiceShuffle(items,rotate){return items.slice(rotate).concat(items.slice(0,rotate))}
function paint(){
 document.getElementById('score').textContent=s.done.length+' / 8 CASES';
 if(s.view==='start'){root.innerHTML='<div class="tag">CLASSIFIED // FRIDAY 4</div><h1>THE 1776 FILES</h1><p>Eight history files have been tampered with. Examine the clues, repair each file, and pass the historian’s knowledge check. A wrong answer will not finish the case.</p><div class="clue">Unlike an ordinary quiz, you will sort real and false claims, reconstruct a timeline, and match historical people to their work. Every case must be cleared before the final vault opens.</div>'+btn('OPEN CASE BOARD','board','','btn');return}
 if(s.view==='board'){root.innerHTML='<div class="tag">YOUR INVESTIGATION</div><h1>THE CASE BOARD</h1><p>Choose an open case. Each requires an evidence investigation and a correct civics test answer.</p><div class="board">'+rooms.map((r,i)=>'<button class="file '+(s.done.includes(i)?'done':'')+'" data-a="enter" data-v="'+i+'"><strong>'+(s.done.includes(i)?'✓':String(i+1).padStart(2,'0'))+'</strong><span>'+esc(r.title)+'</span><small>'+(s.done.includes(i)?'SOLVED':'OPEN CASE')+'</small></button>').join('')+'</div>'+(s.done.length===8?'<p>'+btn('UNLOCK FINAL VAULT','vault','','btn')+'</p>':'');return}
 if(s.view==='vault'){const e=extras[s.final];root.innerHTML='<div class="tag">FINAL VAULT // LOCK '+(s.final+1)+' OF '+extras.length+'</div><h1>THE MASTER ARCHIVE</h1><p>'+esc(e[1])+'</p><div class="choices">'+e[3].map((v,j)=>btn(v,'vaultanswer',j)).join('')+'</div><div class="feedback">'+esc(s.feedback)+'</div>';return}
 if(s.view==='win'){root.innerHTML='<div class="tag">ALL EVIDENCE VERIFIED</div><h1>CASE CLOSED</h1><div class="stamp">ARCHIVE RESTORED</div><p>All eight investigations are complete, and every final civics question has been answered correctly.</p><p>Answers corrected along the way: '+s.wrong+'</p>'+btn('PLAY AGAIN','restart','','btn');return}
 const r=rooms[s.room];let view='<div class="tag">EVIDENCE FILE '+(s.room+1)+' / 8 · '+esc(r.label)+'</div><h1>'+esc(r.title)+'</h1><p>'+esc(r.clue)+'</p>';
 if(s.step===0){view+='<div class="clue"><strong>HISTORICAL BACKGROUND</strong><p>'+esc(r.learn)+'</p></div>'+btn('OPEN EVIDENCE ENVELOPE','next','','btn')}
 if(s.step===1){view+='<div class="envelope"><div class="tag">EVIDENCE TASK</div><h2>'+esc(r.prompt)+'</h2>';
 if(r.type==='sort'){const item=r.entries[s.progress];view+='<div class="hint">Evidence '+(s.progress+1)+' of '+r.entries.length+'</div><p><strong>'+esc(item[0])+'</strong></p><div class="choices">'+btn('SUPPORTED BY HISTORY','sort','TRUE')+btn('FALSE OR MISLEADING','sort','FALSE')+'</div>'}
 if(r.type==='assemble'){view+='<p class="hint">Select the next event in chronological order.</p><div class="trail">'+s.arranged.map(x=>'<div class="piece">'+esc(x)+'</div>').join('')+'</div><div class="choices">'+r.entries.filter(x=>!s.arranged.includes(x)).reverse().map(x=>btn(x,'arrange',x)).join('')+'</div>'}
 if(r.type==='match'){const item=r.entries[s.progress];view+='<div class="hint">Person '+(s.progress+1)+' of '+r.entries.length+'</div><h2>'+esc(item[0])+'</h2><div class="choices">'+choiceShuffle(r.entries.map(x=>x[1]),(s.progress+1)%r.entries.length).map(x=>btn(x,'match',x)).join('')+'</div>'}
 if(r.type==='evidence'){view+='<p>Examine the choices. Which statement fits the source most accurately?</p><div class="choices">'+r.options.map((x,i)=>btn(x,'evidence',i)).join('')+'</div>'}
 view+='</div><div class="feedback" aria-live="polite">'+esc(s.feedback)+'</div>'}
 if(s.step===2){view+='<div class="envelope"><div class="tag">REQUIRED CIVICS CHECK</div><h2>'+esc(r.test)+'</h2><p>Choose the correct answer. This file cannot be completed without it.</p><div class="choices">'+r.choices.map((x,i)=>btn(x,'test',i)).join('')+'</div></div><div class="feedback" aria-live="polite">'+esc(s.feedback)+'</div>'}
 root.innerHTML=view;
}
function act(action,value){
 const r=rooms[s.room];s.feedback='';
 if(action==='board'){s.view='board';paint();return}
 if(action==='restart'){s.view='start';s.room=0;s.done=[];s.wrong=0;s.final=0;paint();return}
 if(action==='enter'){if(s.done.includes(Number(value)))return;s.room=Number(value);s.view='case';s.step=0;s.progress=0;s.arranged=[]}
 if(action==='next'){s.step=1}
 if(action==='sort'){if(value===r.entries[s.progress][1]){s.progress++;if(s.progress===r.entries.length)s.step=2}else{s.wrong++;s.feedback='That claim is in the wrong file. Review the evidence and try again.'}}
 if(action==='arrange'){if(value===r.entries[s.arranged.length]){s.arranged.push(value);if(s.arranged.length===r.entries.length)s.step=2}else{s.wrong++;s.feedback='That event does not come next. Rebuild the timeline in order.'}}
 if(action==='match'){if(value===r.entries[s.progress][1]){s.progress++;if(s.progress===r.entries.length)s.step=2}else{s.wrong++;s.feedback='Check that person’s actual historical role.'}}
 if(action==='evidence'){if(Number(value)===r.correct)s.step=2;else{s.wrong++;s.feedback='This reading does not match the document. Try again.'}}
 if(action==='test'){if(Number(value)===r.correctChoice){s.done.push(s.room);s.view='board'}else{s.wrong++;s.feedback='Incorrect. You must identify the right civics answer to seal this file.'}}
 if(action==='vault'){if(s.done.length!==8)return;s.view='vault';s.final=0}
 if(action==='vaultanswer'){const e=extras[s.final];if(Number(value)===e[4]){s.final++;if(s.final===extras.length)s.view='win'}else{s.wrong++;s.feedback='Wrong archive code. Look closely at the history you studied.'}}
 paint();
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b.dataset.v)});
document.getElementById('board').onclick=()=>act('board');
paint();
</script></body></html>
