<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Friday 5 | The 1800s Express</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#1b201b;color:#28241d;font-family:Georgia,'Times New Roman',serif}button{cursor:pointer}button:focus-visible{outline:4px solid #af602d;outline-offset:3px}.shell{max-width:1200px;margin:auto;padding:16px 24px 85px;background:#eee3c7;min-height:100vh;box-shadow:0 0 45px #0009}.mast{border:5px double #302b21;padding:13px;text-align:center;background:#f8eed7}.mast h1{font-size:clamp(37px,5vw,66px);margin:4px 0 0;letter-spacing:-2px}.mast small{letter-spacing:3px;font:900 14px Arial}.topline{display:flex;justify-content:space-between;gap:10px;font:700 14px Arial;border-bottom:3px solid #302b21;padding:9px 0}.page{border:2px solid #95866c;padding:clamp(18px,2.7vw,36px);margin:19px 0;background:#faf2df}.label{font:900 14px Arial;letter-spacing:3px;color:#9a452e}h2{font:700 clamp(31px,4vw,52px)/1.1 Georgia;margin:15px 0}h3{font-size:26px;margin:13px 0}.story{font-size:clamp(19px,1.9vw,25px);line-height:1.44;max-width:900px}.note{background:#e8d5b5;border-left:7px solid #8b3c2d;padding:16px;margin:15px 0;font-size:19px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:18px 0}.card{background:#f4e6cb;border:3px solid #9b8664;min-height:78px;padding:17px;font:700 19px/1.28 Arial;text-align:left}.card:hover{background:#e8c995}.card.selected{background:#bcd1b5;border-color:#376c53}.card.wrong{background:#ead0c8}.btn{padding:14px 22px;border:3px solid #3c3529;background:#d6aa69;font:900 18px Arial;box-shadow:4px 4px 0 #6f604c}.btn:disabled{opacity:.4;cursor:not-allowed}.edition{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;margin:18px 0}.issue{background:#dcccad;border:3px solid #8b795d;padding:12px;font:900 16px Arial;min-height:108px;text-align:left}.issue strong{display:block;font:28px Georgia;margin-bottom:7px}.issue.done{background:#b9d2ba}.press{height:18px;background:repeating-linear-gradient(90deg,#735f45 0 28px,#d2b48c 28px 33px);border:3px solid #3b3025;margin:14px 0}.ordered{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0}.cutout{padding:11px 15px;border:2px solid #52765c;background:#cfddc4;font:700 17px Arial}.feedback{font:700 18px Arial;color:#8b3c2d;min-height:25px}.ticker{position:fixed;bottom:0;left:0;right:0;background:#232720;color:#f8edd6;padding:10px 16px;display:flex;justify-content:center;align-items:center;gap:20px;font:700 14px Arial;border-top:4px double #e0b97a}.ticker button{background:#e2b977;border:0;padding:11px 17px;font:900 15px Arial}.stamp{display:inline-block;border:7px double #a04332;color:#a04332;transform:rotate(-4deg);font:900 31px Georgia;padding:17px;margin:20px 0}@media(max-width:760px){.shell{padding:8px 9px 88px}.edition{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.mast h1{font-size:35px}.story{font-size:19px}}
</style></head><body><div class="shell"><header class="mast"><small>ESTABLISHED 1803 · AMERICAN HISTORY</small><h1>THE 1800s EXPRESS</h1><div class="topline"><span>THE PEOPLE'S HISTORICAL NEWSPAPER</span><span id="counter">0 / 5 EDITIONS PRINTED</span></div></header><main id="app"></main></div><footer class="ticker"><button id="desk">NEWS DESK</button><span id="ticker">THE PRESSES ARE WAITING</span></footer><script>
const editions=[{"year":"1803","title":"THE LAND DEAL","context":"News from Washington: President Jefferson has agreed to buy a huge territory from France. Your newspaper must explain what changed and what the deal meant.","mechanic":"sort","prompt":"Decide which reports belong in the verified news column.","cards":[["Jefferson bought the Louisiana Territory from France.",true],["The deal took place in 1803.",true],["The purchase involved land already inhabited by Native peoples.",true],["France sold the state of California alone.",false],["The Louisiana Purchase started the Civil War.",false]],"quiz":[0,1]},{"year":"1812–1861","title":"THE COUNTRY SPLITS","context":"Telegraph reports are arriving from across the growing United States. Some stories are from the wrong century. Others leave out why the Civil War began.","mechanic":"timeline","prompt":"Rebuild the publication timeline in the correct order.","cards":["War of 1812 begins","Mexican-American War begins","Abraham Lincoln elected president","Confederates attack Fort Sumter"],"quiz":[2,3]},{"year":"1863","title":"LINCOLN'S BIG DECISION","context":"The country is at war. A major proclamation has been issued, and your newsroom must identify what it actually did. You cannot publish an incorrect claim about slavery.","mechanic":"investigate","prompt":"Choose all three historically accurate claims before printing.","cards":[["Lincoln served as the 16th president.",true],["The Emancipation Proclamation applied to enslaved people in rebelling Confederate states.",true],["The Emancipation Proclamation instantly ended slavery everywhere in the United States.",false],["The Civil War was fought between Union and Confederate states.",true],["Lincoln was president during World War I.",false]],"quiz":[4,5]},{"year":"1865","title":"THE WAR ENDS","context":"Reports from the battlefront say the Confederacy is collapsing. Your paper must rebuild the story before it goes to press.","mechanic":"timeline","prompt":"Put these moments in order.","cards":["Fort Sumter attacked in 1861","Emancipation Proclamation issued in 1863","Lee surrenders at Appomattox in 1865","13th Amendment ratified in 1865"],"quiz":[6,7]},{"year":"1868–1920","title":"WHO HAS A VOICE?","context":"After the Civil War, Americans argued about citizenship, voting, and equal rights. Your newspaper must distinguish changes in the law from rights people still struggled to use.","mechanic":"investigate","prompt":"Choose all four accurate statements about rights.","cards":[["14th Amendment defined national citizenship.",true],["15th Amendment barred denying voting rights on grounds of race.",true],["The 15th Amendment made voter intimidation impossible.",false],["Susan B. Anthony was a women's rights leader.",true],["Women gained nationwide constitutional voting protection in 1920.",true],["The Civil War immediately guaranteed equal political power to everyone.",false]],"quiz":[8,9]}];const questions=[["What territory did the United States buy from France in 1803?",["Louisiana Territory","Oregon Territory","Alaska","Florida"],0],["Name one war fought by the United States in the 1800s.",["World War II","American Revolutionary War","Mexican-American War","Korean War"],2],["Name the U.S. war between the North and the South.",["Civil War","War of 1812","Spanish-American War","Revolutionary War"],0],["The Civil War had many important events. Name one.",["Boston Tea Party","Battle of Gettysburg","Pearl Harbor","Louisiana Purchase"],1],["Abraham Lincoln is famous for many things. Name one.",["First president","16th president","Writer of the Constitution","Led the British army"],1],["What did the Emancipation Proclamation do?",["Ended every form of discrimination","Freed enslaved people in the Confederacy","Gave women voting rights","Created the U.S. Constitution"],1],["What U.S. war ended slavery?",["War of 1812","Mexican-American War","Civil War","Spanish-American War"],2],["Which amendment says people born or naturalized in the United States, subject to its jurisdiction, are citizens?",["10th Amendment","14th Amendment","15th Amendment","19th Amendment"],1],["When did all men get the right to vote under the 15th Amendment?",["1776","1803","1870","1920"],2],["Name one leader of the women's rights movement in the 1800s.",["Susan B. Anthony","George Washington","Abraham Lincoln","King George III"],0]];
const st={view:'intro',issue:0,phase:0,done:[],card:0,selected:[],placed:[],qa:0,wrong:0,feedback:''};
const root=document.getElementById('app');const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');
const button=(label,action,value='',className='card')=>'<button class="'+className+'" data-action="'+action+'" data-value="'+esc(value)+'">'+esc(label)+'</button>';
function render(){document.getElementById('counter').textContent=st.done.length+' / 5 EDITIONS PRINTED';
if(st.view==='intro'){root.innerHTML='<section class="page"><div class="label">WELCOME TO THE PRESS ROOM</div><h2>YOU ARE THE EDITOR</h2><p class="story">History is happening fast. From 1803 to 1920, your newsroom will publish five editions. Each edition has evidence to investigate and two civics test questions. Nothing goes to print until the facts are correct.</p><div class="note">Gameplay: verify reports, repair timelines, solve historical contradictions, answer both required questions, and operate the printing press. There are no answer-reveal or skip buttons.</div>'+button('START THE NEWSPAPER','desk','','btn')+'</section>';return}
if(st.view==='desk'){root.innerHTML='<section class="page"><div class="label">CHOOSE AN EDITION</div><h2>NEWS DESK</h2><p class="story">Complete each edition to build your newspaper's collection. You can investigate them in any order.</p><div class="edition">'+editions.map((e,i)=>'<button class="issue '+(st.done.includes(i)?'done':'')+'" data-action="open" data-value="'+i+'"><strong>'+e.year+'</strong>'+e.title+(st.done.includes(i)?' ✓':'')+'</button>').join('')+'</div>'+(st.done.length===5?button('PRINT THE FINAL FRONT PAGE','finish','','btn'):'')+'</section>';return}
if(st.view==='finish'){root.innerHTML='<section class="page"><div class="label">SPECIAL HISTORICAL EDITION</div><h2>ALL FIVE EDITIONS PUBLISHED!</h2><div class="stamp">PRESS VERIFIED</div><p class="story">You published the story of 19th-century America and correctly answered all ten civics questions.</p><p class="story">Historical corrections made: '+st.wrong+'</p>'+button('RESTART NEWSROOM','restart','','btn')+'</section>';return}
const ed=editions[st.issue];let content='<section class="page"><div class="label">'+ed.year+' · EDITION '+(st.issue+1)+' OF 5</div><h2>'+ed.title+'</h2><p class="story">'+ed.context+'</p>';
if(st.phase===0){content+='<div class="note"><b>REPORTING ASSIGNMENT</b><p>'+ed.prompt+'</p></div>'+button('OPEN NEWSWIRE','next','','btn')}
if(st.phase===1){content+='<div class="label">FACT CHECK DESK</div><h3>'+ed.prompt+'</h3>';
if(ed.mechanic==='sort'){const c=ed.cards[st.card];content+='<p class="story"><b>REPORT '+(st.card+1)+' / '+ed.cards.length+':</b> '+esc(c[0])+'</p><div class="grid">'+button('VERIFIED FACT','sort','true')+button('FALSE REPORT','sort','false')+'</div>'}
if(ed.mechanic==='timeline'){content+='<p class="story">Choose the next event. Events must be printed in chronological order.</p><div class="ordered">'+st.placed.map(x=>'<span class="cutout">'+esc(x)+'</span>').join('')+'</div><div class="grid">'+ed.cards.filter(x=>!st.placed.includes(x)).slice().reverse().map(x=>button(x,'place',x)).join('')+'</div>'}
if(ed.mechanic==='investigate'){const needed=ed.cards.filter(x=>x[1]).length;content+='<p class="story">Select exactly '+needed+' accurate statements. Click a statement again to remove it.</p><div class="grid">'+ed.cards.map((x,i)=>'<button class="card '+(st.selected.includes(i)?'selected':'')+'" data-action="pick" data-value="'+i+'">'+esc(x[0])+'</button>').join('')+'</div>'+button('SUBMIT VERIFIED REPORTS','verify','','btn')}
content+='<div class="feedback" aria-live="polite">'+esc(st.feedback)+'</div>'}
if(st.phase===2){const qix=ed.quiz[st.qa],q=questions[qix];content+='<div class="label">OFFICIAL CIVICS TEST · QUESTION '+(90+qix)+'</div><h3>'+esc(q[0])+'</h3><div class="grid">'+q[1].map((x,i)=>button(x,'answer',i)).join('')+'</div><div class="feedback" aria-live="polite">'+esc(st.feedback)+'</div><p>Correct answers are required to unlock the printing press.</p>'}
if(st.phase===3){content+='<div class="label">APPROVED FOR PRINT</div><h3>Your facts have been checked.</h3><div class="press"></div><p>Place this edition into the printing press to publish it.</p>'+button('RUN THE PRINTING PRESS','publish','','btn')}
content+='</section>';root.innerHTML=content}
function act(action,value){const ed=editions[st.issue];st.feedback='';
if(action==='desk'){st.view='desk';render();return}
if(action==='restart'){st.view='intro';st.done=[];st.wrong=0;render();return}
if(action==='open'){const i=Number(value);if(st.done.includes(i))return;st.issue=i;st.view='issue';st.phase=0;st.card=0;st.qa=0;st.placed=[];st.selected=[]}
if(action==='next')st.phase=1;
if(action==='sort'){if(String(ed.cards[st.card][1])===value){st.card++;if(st.card===ed.cards.length)st.phase=2}else{st.wrong++;st.feedback='Check the date and claim. This report is not classified correctly.'}}
if(action==='place'){if(value===ed.cards[st.placed.length]){st.placed.push(value);if(st.placed.length===ed.cards.length)st.phase=2}else{st.wrong++;st.feedback='This event comes later. Find the next moment in history.'}}
if(action==='pick'){const i=Number(value);if(st.selected.includes(i))st.selected=st.selected.filter(x=>x!==i);else st.selected.push(i)}
if(action==='verify'){const expected=ed.cards.map((x,i)=>x[1]?i:-1).filter(x=>x>=0);if(expected.length===st.selected.length&&expected.every(i=>st.selected.includes(i))){st.phase=2}else{st.wrong++;st.feedback='Some of these reports are false or a true report is missing. Check again.'}}
if(action==='answer'){const q=questions[ed.quiz[st.qa]];if(Number(value)===q[2]){st.qa++;if(st.qa===2)st.phase=3}else{st.wrong++;st.feedback='That is incorrect. Use what you learned in the briefing and try again.'}}
if(action==='publish'){if(!st.done.includes(st.issue))st.done.push(st.issue);st.view='desk'}
if(action==='finish'){if(st.done.length===5)st.view='finish'}
render()}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el)act(el.dataset.action,el.dataset.value)});
document.getElementById('desk').onclick=()=>act('desk');render();
</script></body></html>
