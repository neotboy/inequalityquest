<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Capitol Control — Clear Class Simulation</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080e1b;color:#f9fbff;font-family:Arial,system-ui,sans-serif}button{font:inherit;cursor:pointer}#app{max-width:1320px;margin:auto;padding:26px 28px 100px}.header{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:1000;color:#fed27a;letter-spacing:.09em}.tag{padding:9px 13px;border:1px solid #5a799b;background:#1b3755;border-radius:9px;font-weight:900}.teams{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:20px 0}.team{border:2px solid #385d82;background:#172c47;border-radius:12px;padding:12px;font-size:18px;font-weight:950;display:flex;justify-content:space-between}.team b{color:#ffd273}.team.current{background:#345474;border-color:#ffd273}.panel{border:2px solid #395d84;border-radius:19px;background:linear-gradient(130deg,#162f4e,#102039);padding:clamp(20px,3vw,40px);min-height:430px}.eyebrow{color:#ffd477;font-size:19px;font-weight:1000;letter-spacing:.06em}h1{font-size:clamp(36px,4.4vw,66px);line-height:1.06;margin:12px 0 20px}h2{font-size:clamp(28px,3vw,44px);margin:8px 0 16px}.lead{font-size:clamp(22px,2.2vw,33px);line-height:1.28;font-weight:800;max-width:1020px}.learn{background:#fbefcd;color:#162943;padding:22px;border-left:10px solid #e4a63f;border-radius:10px;font-size:clamp(22px,2.2vw,31px);line-height:1.3;font-weight:850}.learn small{display:block;color:#8f5e1c;font-size:18px;font-weight:1000;margin-bottom:10px}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:24px 0}.options button{border:3px solid #8faecb;border-radius:12px;background:#edf5ff;color:#122f51;padding:20px;font-size:clamp(21px,1.8vw,29px);font-weight:950;text-align:left;min-height:95px}.options button:hover{background:#ffe0a3}.options button.selected{background:#fbd47e;border-color:#d68b20}.options button:disabled{cursor:default}.argument{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:21px 0}.argument section{background:#284564;border:1px solid #6889a9;padding:20px;border-radius:12px;font-size:clamp(20px,1.7vw,26px);line-height:1.3}.argument b{color:#ffdc95;display:block;margin-bottom:8px}.news{background:#3b263d;border-left:9px solid #fa8ea7;padding:20px;border-radius:8px;font-size:clamp(21px,1.9vw,29px);line-height:1.25;font-weight:800}.result{background:#1d4359;border-left:10px solid #6ee0b9;padding:22px;border-radius:8px;font-size:clamp(22px,1.9vw,29px);line-height:1.3;font-weight:800}.small{font-size:19px;color:#c9d9e9;line-height:1.3}.footer{position:fixed;bottom:0;left:0;right:0;background:#040916;padding:14px 4%;display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:2px solid #355273}.btn{background:#ffd174;color:#142d47;border:0;border-radius:10px;padding:14px 23px;font-size:19px;font-weight:1000}.secondary{background:#263f5a;color:white;border:1px solid #718fb1}.topicgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.topicgrid button{border:2px solid #7594b3;background:#e9f2ff;color:#152b48;border-radius:12px;text-align:left;padding:17px;font-weight:950;font-size:clamp(20px,1.7vw,26px)}.topicgrid button:disabled{opacity:.3}.statline{display:flex;gap:16px;flex-wrap:wrap}.stat{background:#254665;padding:12px 18px;border-radius:11px;font-weight:900}.stat b{font-size:30px;color:#f9cd78}.highlight{color:#ffda8a}.report{background:#223f5d;border-radius:13px;padding:18px;margin:16px 0;font-size:22px;line-height:1.3}.report strong{color:#ffd57b}.chip{display:inline-block;background:#294c68;padding:8px 12px;border-radius:8px;font-size:18px;font-weight:900}.timer{font-size:19px;font-weight:950}.progress{height:10px;background:#213a56;border-radius:7px;margin:15px 0;overflow:hidden}.progress div{height:100%;background:#e8be6c}.billstrip{background:#f9e9b8;color:#172b46;border-left:9px solid #edaf39;padding:17px 20px;border-radius:12px;margin:14px 0;font-size:clamp(20px,1.8vw,27px);line-height:1.26;font-weight:850}.billstrip strong{display:block;font-size:16px;color:#7e4e0c;letter-spacing:.055em;margin-bottom:5px}.talk{background:#193d5c;border:2px solid #8ac5ec;padding:17px 20px;border-radius:13px;margin:17px 0;font-size:clamp(19px,1.8vw,26px);font-weight:850;line-height:1.3}.talk b{color:#9ee3ff}.argument{margin:15px 0}.topicgrid{max-height:none;overflow:visible}.pagebar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;flex-wrap:wrap}.pagebar button{background:#fcd380;color:#152b48;border:0;border-radius:10px;padding:15px 18px;font-size:19px;font-weight:950}.pagebar button:disabled{opacity:.35}.pagebar b{font-size:17px}.options button{font-size:clamp(20px,1.8vw,27px)}@media(max-width:750px){#app{padding:13px 13px 95px}.teams{grid-template-columns:repeat(2,1fr)}.topicgrid,.argument,.options{grid-template-columns:1fr}.panel{padding:18px}.footer .btn{font-size:15px;padding:10px}.timer{font-size:14px}}</style></head><body><div id="app"><div class="header"><div class="brand">CAPITOL CONTROL · CIVICS FRIDAY 2</div><div class="tag" id="step">BILL 1 / 3</div></div><div class="teams" id="teams"></div><div class="panel" id="screen"></div></div><div class="footer"><button class="btn secondary" id="restart">↻ RESTART</button><span class="timer">HOUSE → SENATE → PRESIDENT → COURT</span><button class="btn" id="next">CONTINUE →</button></div><script>const topics=[["END THE FEDERAL DEATH PENALTY","The federal government would stop using the death penalty for federal crimes.","Supporters say innocent people could be executed.","Opponents say some crimes deserve the strongest punishment.","A relative of a murder victim demands the law remain.","Constitutional questions about punishment and due process."],["BRING BACK THE DRAFT","Adults could be required to serve if the country faced a major war.","Supporters say the country needs enough troops to defend itself.","Opponents say nobody should be forced into military service.","Students learn they could be called to serve in a war.","Legal questions about Congress’s military powers."],["BAN SPORTS-BETTING ADS","Sports-betting companies could no longer advertise on TV or online.","Supporters say the ads encourage gambling among young people.","Opponents say adults and businesses should make their own choices.","A big game airs with no betting ads, angering some fans.","Free-speech questions about advertising."],["PATH TO CITIZENSHIP","Some undocumented residents who meet requirements could apply for citizenship.","Supporters point to families and years of work in the U.S.","Opponents say immigration laws should be enforced consistently.","Families want answers about whether they can stay together.","Federal immigration powers and equal-protection questions."],["LIMIT POLICE LIES TO TEENS","Federal investigators could not lie about evidence while questioning someone under 18.","Supporters worry teens could make false confessions.","Opponents say police need ways to question suspects.","A 16-year-old confesses after hearing fake evidence.","Due-process rights during criminal questioning."],["BAN CONVERSION THERAPY FOR MINORS","A federal law would prohibit licensed counselors from using practices that claim to change a minor’s sexual orientation.","Supporters cite concerns about harm to young people.","Opponents raise questions about speech, religion, and family choices.","A family challenges whether a counselor can offer certain services.","First Amendment and federal-power questions."],["NATIONAL 15-WEEK ABORTION LIMIT","Federal law would restrict most abortions after 15 weeks with specified exceptions.","Supporters seek nationwide limits with exceptions.","Opponents raise concerns about bodily autonomy and medical care.","Patients and doctors face a new national rule.","Federal authority, due process, and other constitutional questions."],["REQUIRE PHOTO ID TO VOTE NATIONWIDE","Voters in all federal elections would need to show an approved photo ID. The bill would also fund free IDs for people who need them.","Supporters say photo IDs help confirm who is voting and build trust in elections.","Opponents say even free IDs may be difficult for some citizens to get, which could block eligible voters.","Some voters say elections feel more secure. Others say it is harder to cast a ballot.","Congress can make laws about federal elections, but a bill cannot violate constitutional voting rights."],["ALLOW VOTING AT AGE 16","A proposed constitutional amendment would lower the national voting age to 16.","Supporters say teens are affected by laws and should vote.","Opponents say 18 is the better national minimum age.","Students debate whether 16-year-olds should vote for president.","This would require changing the Constitution, not passing an ordinary bill."],["TRY 16- AND 17-YEAR-OLDS AS ADULTS FOR VIOLENT FEDERAL CRIMES?","In federal cases involving certain serious violent crimes, prosecutors could request an adult trial for defendants who are 16 or 17. A judge would still review the request.","Supporters say serious crimes deserve serious consequences and victims need justice.","Opponents say teenagers are still developing and should have a greater chance to change.","A 16-year-old charged with a serious federal crime may face an adult trial instead of juvenile court.","Federal courts must follow due process. A judge would consider the law and the facts; a new bill cannot remove constitutional protections."],["BAN CERTAIN GUN SALES","Federal law would restrict new sales of specified semiautomatic rifles.","Supporters say it could reduce access to dangerous weapons.","Opponents say it limits law-abiding gun owners.","Gun stores receive new sales rules after a national vote.","Second Amendment questions."],["RESTRICT SCHOOL LIBRARY BOOKS","A bill would set rules about books that can be bought using certain federal school funds, with limits on how those rules apply.","Supporters want parents to have more control over content.","Opponents say students should have access to a wide range of ideas.","A school removes a controversial book while students protest.","First Amendment and federal education-power questions."],["BAN GOVERNMENT VACCINE REQUIREMENTS?","Federal agencies could not require vaccines for most civilian workers or federally funded public programs. Exceptions would apply to certain military and healthcare roles.","Supporters say people should make their own medical choices without government pressure.","Opponents say vaccine requirements can protect vulnerable people during serious outbreaks.","Some workers regain more choice, while hospitals worry about protecting high-risk patients.","Congress can set limits on federal agencies, but state public-health powers are separate."],["REQUIRE DAILY PRAYER IN PUBLIC SCHOOLS?","Public schools receiving federal education funds would have to lead a short group prayer each morning. Students could choose not to join.","Supporters say the rule recognizes religion and allows time for shared reflection.","Opponents say government-led prayer in public schools conflicts with religious freedom, even if students may opt out.","Some families welcome the new routine; others challenge it in court.","The First Amendment restricts government-sponsored religion. Students may pray voluntarily on their own."],["STOP AI FACE AND VOICE FAKES","Making or sharing realistic fake videos or audio to impersonate someone without consent for harmful purposes would face federal penalties.","Supporters say fake clips can destroy reputations and trick people.","Opponents worry broad rules may limit satire and free expression.","A fake video shows a student saying something they never said.","Free-speech protections and laws against harmful impersonation."],["CANCEL FEDERAL STUDENT LOAN DEBT?","The federal government would cancel up to $10,000 of eligible federal student loans per borrower, paid for through federal funds.","Supporters say debt relief could help young adults afford housing and other needs.","Opponents say taxpayers would pay for loans they did not take and future students might face the same costs.","Some borrowers have smaller monthly bills; others say the plan is unfair to people who already paid.","Congress controls federal spending and can create laws about federal loan programs."],["STOP SCHOOLS FROM SEARCHING STUDENT PHONES WITHOUT A REASON","A federal law would limit when public schools can search a student's phone, with narrow safety exceptions.","Supporters say private messages and photos deserve protection.","Opponents say schools may need to respond quickly to safety threats.","A principal asks to read a student's messages after a rumor spreads.","The Fourth Amendment protects against unreasonable government searches. School rules have special limits."],["STOP U.S. MILITARY AID TO FOREIGN WARS?","Congress would stop new federal funding for military equipment sent to countries fighting overseas wars, while allowing food and medical aid.","Supporters say the U.S. should spend less on overseas fighting and focus on needs at home.","Opponents say helping allies can protect national security and discourage attacks.","Allied countries receive less U.S. military help, and Congress debates what the savings should fund.","Congress controls federal spending; the president directs foreign policy and commands the military within constitutional limits."],["PUNISH STUDENTS FOR HARMFUL POSTS MADE OFF CAMPUS?","Public schools receiving federal funds would be required to investigate serious online threats or targeted harassment against students, even when posts are made away from school. Punishment would require a fair review.","Supporters say schools must protect students from threats and targeted harassment that follow them into class.","Opponents worry schools could punish students for opinions or jokes made outside school.","A student posts a threatening video at home. The school must decide whether it can discipline the student.","Public schools must respect students’ First Amendment rights. Threats and harassment may be treated differently from ordinary criticism; facts matter."]];
let G;const fresh=()=>({round:1,phase:'welcome',topic:null,used:[],house:null,senate:null,deal:0,president:null,override:null,court:null,quizIndex:0,quizBranch:'house',quizCounts:{house:0,senate:0,president:0,court:0},quizChoice:null,quizNext:'',report:null,history:[],points:[0,0,0,0],votes:[],stance:[],stanceTurn:0,topicPage:0}); G=fresh();
const P=document.getElementById('screen');const app=document.getElementById('app');const names=['HOUSE','SENATE','PRESIDENT','COURT'];const sym=['🏛','🤝','🦅','⚖'];const questions={
 house:[
 ['How many voting members are in the U.S. House?',['435','100','50'],0,'The House has 435 voting members.'],
 ['How long does a U.S. House member serve?',['6 years','2 years','4 years'],1,'House terms last two years.'],
 ['How many U.S. House districts does Iowa have?',['2','4','8'],1,'Iowa has four U.S. House districts.'],
 ['Who makes federal laws?',['The president alone','Congress','The Supreme Court'],1,'Congress makes federal laws.'],
 ['Which part of Congress starts a bill in this game?',['The House','The Supreme Court','The Cabinet'],0,'The House can introduce and vote on bills.'],
 ['Which part of Congress can introduce most types of bills?',['Only the Senate','Only the House','Either chamber'],2,'Most bills can start in either the House or the Senate.']
 ],
 senate:[
 ['How many U.S. senators does each state have?',['2','4','6'],0,'Every state has two U.S. senators.'],
 ['How many U.S. senators are there in total?',['50','435','100'],2,'The U.S. Senate has 100 members.'],
 ['How long is a U.S. senator’s term?',['2 years','6 years','4 years'],1,'U.S. senators serve six-year terms.'],
 ['Who does a U.S. senator represent?',['A district','The whole state','Just the capital city'],1,'A senator represents the whole state.'],
 ['What must the House and Senate agree on for a bill to pass?',['The same bill text','Different bills','The court’s opinion'],0,'Both chambers must pass the same text.'],
 ['Which chamber confirms many presidential appointments?',['House','Senate','Supreme Court'],1,'The Senate votes to confirm many presidential nominees.']
 ],
 president:[
 ['Who can sign or veto a federal bill?',['The president','The Chief Justice','The Speaker'],0,'The president signs or vetoes bills.'],
 ['Which branch does the president lead?',['Judicial','Executive','Legislative'],1,'The president leads the executive branch.'],
 ['What is the president’s main job with federal laws?',['Enforce them','Write every law','Judge all cases'],0,'The executive branch enforces federal laws.'],
 ['How can Congress override a presidential veto?',['A simple majority','Two-thirds in both chambers','A judge’s signature'],1,'A two-thirds vote in each chamber can override a veto.'],
 ['Who is commander in chief of the U.S. military?',['The president','The Senate leader','The Chief Justice'],0,'The president commands the armed forces.'],
 ['Who advises the president through executive departments?',['The Cabinet','The Supreme Court','House members'],0,'Cabinet leaders advise the president and lead executive departments.']
 ],
 court:[
 ['What is the highest court in the United States?',['Federal district court','U.S. Supreme Court','The Senate'],1,'The Supreme Court is the highest court.'],
 ['What is the job of the judicial branch?',['Enforce laws','Interpret laws','Write bills'],1,'The judicial branch interprets laws and decides cases.'],
 ['How many justices normally serve on the U.S. Supreme Court?',['7','9','12'],1,'The U.S. Supreme Court has nine justices.'],
 ['What is judicial review?',['Courts check whether laws follow the Constitution','President vetoes a bill','Congress elects judges'],0,'Courts may rule laws unconstitutional in cases.'],
 ['Who nominates U.S. Supreme Court justices?',['The president','State governors','The House'],0,'The president nominates, and the Senate confirms.'],
 ['Where does a federal case usually begin?',['District court','U.S. Supreme Court','The Senate'],0,'U.S. district courts are federal trial courts.']
 ]};

function E(x){return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')};function btn(label,act,val){return '<button data-act="'+act+'" data-val="'+val+'">'+label+'</button>'};function lesson(text){return '<div class="learn"><small>📘 LEARN THIS FIRST</small>'+text+'</div>'};function cards(a,act){return '<div class="options">'+a.map((v,i)=>btn(E(v),act,i)).join('')+'</div>'};function proposal(t,change=false){return t?'<div class="billstrip"><strong>📄 THE EXACT BILL YOUR TEAM IS DECIDING ON</strong>'+E(t[1])+(change?'<hr><strong>NEW SENATE CHANGE</strong>The law would apply only for two years, then Congress must vote again to continue it.':'')+'</div>':''};function discuss(who,question){return '<div class="talk"><b>🗣 TIME TO TALK — '+who+'</b><div>'+question+'</div><div style="font-size:17px;font-weight:700;margin-top:8px">Take 60–90 seconds. Have one person explain your team’s choice. Then the teacher clicks the vote.</div></div>'};function heading(ey,t){return '<div class="eyebrow">'+ey+'</div><h1>'+t+'</h1>'};function report(title,reason,effect){G.report={title,reason,effect};G.history.push({topic:G.topic,title,reason,effect});G.phase='report'};function quiz(branch,next){G.quizBranch=branch;G.quizIndex=G.quizCounts[branch]%questions[branch].length;G.quizCounts[branch]++;G.quizChoice=null;G.quizNext=next;G.phase='quiz'};
function render(){let phase=G.phase,t=G.topic===null?null:topics[G.topic];let h='',next=false,active=-1;document.getElementById('step').textContent='BILL '+G.round+' / 3';document.getElementById('teams').innerHTML=names.map((n,i)=>'<div class="team '+((phase==='house'&&i===0||phase==='senate'&&i===1||phase==='president'&&i===2||phase==='court'&&i===3)?'current':'')+'">'+sym[i]+' '+n+' <b>'+G.points[i]+'</b></div>').join('');
if(phase==='welcome'){h=heading('GOVERNMENT SIMULATION','YOUR CLASS RUNS CONGRESS')+'<p class="lead">Your class is divided into the House, Senate, President, and Supreme Court. You will debate real issues and try to make laws.</p>'+lesson('A proposed law is called a BILL. To become law, it must pass the House and Senate, then go to the president.')+'<p class="small">Play 3 bills. You control the votes. Each team earns points for knowing its powers—not for which opinion it holds.</p>';next=true}
if(phase==='choose'){let size=4,pages=Math.ceil(topics.length/size),page=Math.max(0,Math.min(pages-1,G.topicPage||0));h=heading('NEW BILL · ROUND '+G.round,'WHAT SHOULD WE TRY TO CHANGE?')+'<p class="lead">House team: Pick ONE bill. Everyone will hear both sides before the vote.</p><div class="topicgrid">'+topics.slice(page*size,(page+1)*size).map((a,j)=>{let i=page*size+j;return btn(E(a[0]),'topic',i).replace('<button','<button '+(G.used.includes(i)?'disabled':''))}).join('')+'</div><div class="pagebar"><button data-act="page" data-val="-1" '+(page===0?'disabled':'')+'>◀ PREVIOUS TOPICS</button><b>TOPICS '+(page*size+1)+'–'+Math.min(topics.length,(page+1)*size)+' OF '+topics.length+'</b><button data-act="page" data-val="1" '+(page===pages-1?'disabled':'')+'>MORE TOPICS ▶</button></div>';next=false}
if(phase==='brief'){h=heading('BREAKING NEWS · '+G.round,t[0])+'<div class="news">'+E(t[4])+'</div><p class="lead">The proposed law: '+E(t[1])+'</p>'+discuss('EVERYONE','Read the proposed law. Who does it help? Who might oppose it?');next=true}
if(phase==='sides'){h=heading('CLASS DEBATE','SHOULD THIS BECOME A LAW?')+'<p class="lead">Let students argue BOTH sides, even if they disagree.</p><div class="argument"><section><b>✅ REASONS TO SUPPORT</b>'+E(t[2])+'</section><section><b>❌ REASONS TO OPPOSE</b>'+E(t[3])+'</section></div>'+proposal(t)+discuss('EVERY TEAM','Decide SUPPORT or OPPOSE, and say one reason. Each group speaks before the House vote.');next=true}
if(phase==='house'){h=heading('🏛 HOUSE TURN','PASS OR REJECT THE BILL?')+lesson('The House has 435 voting members. Its members serve two-year terms. A bill usually needs a majority vote to pass.')+proposal(t)+discuss('HOUSE','Do you support this exact law? Hear both sides. Then House members vote YES or NO.')+cards(['PASS — Send it to the Senate','REJECT — Stop this bill'],'house');next=false}
if(phase==='senate'){h=heading('🤝 SENATE TURN','KEEP IT, CHANGE IT, OR STOP IT?')+lesson('Each state has TWO senators, so there are 100 in all. Senators serve SIX years. The House and Senate must approve the SAME bill.')+proposal(t)+discuss('SENATE','Would you pass this exact law, change it, or stop it? Give a reason before voting.')+cards(['PASS the same bill','ASK for a change','REJECT the bill'],'senate');next=false}
if(phase==='change'){h=heading('🏛 HOUSE TURN · NEW DEAL','WILL THE HOUSE ACCEPT THE CHANGE?')+lesson('When the Senate changes a bill, the House must agree to the new version. If they cannot agree, the bill can die.')+proposal(t,true)+discuss('HOUSE','Does the two-year limit make this a better deal? Vote YES to accept the new wording or NO to stop the bill.')+cards(['ACCEPT the change','REFUSE — Bill dies'],'change');next=false}
if(phase==='president'){h=heading('🦅 PRESIDENT TURN','SIGN OR VETO?')+lesson('The president leads the executive branch. The president can SIGN a bill into law or VETO it and send it back to Congress.')+proposal(t,G.senateChoice===1)+discuss('PRESIDENT','Would you sign THIS law or send it back with a veto? Explain why.')+cards(['SIGN — Make it law','VETO — Send it back'],'president');next=false}
if(phase==='override'){h=heading('🏛 CONGRESS · VETO CHALLENGE','CAN CONGRESS OVERRIDE THE PRESIDENT?')+lesson('Congress can override a veto only with a TWO-THIRDS vote in both the House and Senate.')+proposal(t,G.senateChoice===1)+discuss('HOUSE AND SENATE','Vote separately. Do at least two-thirds of EACH team support overriding the veto?')+cards(['YES — Both reached two-thirds','NO — At least one did not'],'override');next=false}
if(phase==='court'){h=heading('⚖ COURT TURN','A CONSTITUTIONAL CHALLENGE')+lesson('Courts decide legal cases. The Supreme Court is the highest court. It can rule that a law violates the Constitution.')+proposal(t,G.senateChoice===1)+'<div class="news">Legal issue: '+E(t[5])+'</div>'+discuss('COURT','Do not vote on whether you like the law. Does it break the Constitution? Explain your decision.')+cards(['UPHOLD — Law stays','STRIKE DOWN — Law cannot stand'],'court');h+='<p class="small">Classroom ruling is a simulation. Real judges use legal arguments and evidence, not personal opinions.</p>';next=false}
if(phase==='quiz'){let q=questions[G.quizBranch][G.quizIndex];h=heading('⭐ CIVICS POWER-UP','SHOW WHAT YOUR TEAM LEARNED')+'<p class="lead">'+E(q[0])+'</p>'+(G.quizChoice===null?cards(q[1],'answer'):'<div class="result">'+(G.quizChoice===q[2]?'✅ Correct! +15 team points.':'The correct answer is '+E(q[1][q[2]])+'.')+'<p>'+E(q[3])+'</p></div>');next=G.quizChoice!==null}
if(phase==='report'){let r=G.report;h=heading('📺 NEWS ALERT',''+E(r.title))+'<div class="news">'+E(r.reason)+'</div><div class="argument"><section><b>WHY IT HAPPENED</b>'+E(r.effect)+'</section><section><b>WHAT HAPPENS NOW</b>'+('The issue is still important, but '+(r.title==='LAW TAKES EFFECT'?'the new law is in place.':'the proposed change does not take effect.')+' The next bill begins a new round.')+'</section></div>';next=true}
if(phase==='end'){let points=G.points.map((n,i)=>({name:names[i],n})).sort((a,b)=>b.n-a.n);h=heading('🏆 THE TERM IS OVER','YOUR GOVERNMENT’S RECORD')+'<div class="statline"><div class="stat">Bills debated: <b>'+G.history.length+'</b></div><div class="stat">Laws passed: <b>'+G.history.filter(x=>x.title==='LAW TAKES EFFECT').length+'</b></div><div class="stat">Top team: <b>'+points[0].name+'</b></div></div>'+G.history.map((x,i)=>'<div class="report"><strong>BILL '+(i+1)+': '+E(topics[x.topic][0])+'</strong><div>'+E(x.title)+' — '+E(x.reason)+'</div></div>').join('')+'<p class="lead">Your class just used Congress, the president, and the courts to make government decisions.</p>';next=true}
P.innerHTML=h;const b=document.getElementById('next');b.hidden=!next;b.textContent=phase==='end'?'NEW GAME ↻':phase==='report'?(G.round===3?'FINAL REPORT →':'NEW BILL →'):'CONTINUE →'}
function action(a,v){let n=Number(v),t=topics[G.topic];if(a==='page'){G.topicPage=Math.max(0,Math.min(Math.ceil(topics.length/4)-1,(G.topicPage||0)+n));render();return}if(a==='topic'){G.topic=n;G.used.push(n);G.phase='brief'}if(a==='house'){if(n===0){G.points[0]+=10;quiz('house','senate')}else{G.points[0]+=5;report('HOUSE REJECTS BILL','The House voted no. The proposal stops.','A bill must pass the House before the Senate can consider it. The existing law stays unchanged.')}}if(a==='senate'){if(n===0){G.points[1]+=10;G.senateChoice=0;quiz('senate','president')}if(n===1){G.points[1]+=10;G.senateChoice=1;G.phase='change'}if(n===2){G.points[1]+=5;report('SENATE REJECTS BILL','The Senate voted no. The proposal stops.','Both chambers must approve the same bill. The existing rules do not change.')}}if(a==='change'){if(n===0){G.points[0]+=10;G.points[1]+=10;quiz('senate','president')}else{report('CONGRESS CANNOT AGREE','The House rejected the Senate’s change. No law passed.','Both chambers have to approve identical wording. No agreement means the old rules stay in place.')}}if(a==='president'){if(n===0){G.points[2]+=10;quiz('president','court')}else{G.points[2]+=10;G.phase='override'}}if(a==='override'){if(n===0){G.points[0]+=10;G.points[1]+=10;quiz('president','court')}else{report('THE VETO STANDS','Congress did not reach two-thirds in both chambers. The bill stops.','A presidential veto prevents a bill from becoming law unless Congress overrides it.')}}if(a==='court'){if(n===0){G.points[3]+=10;quiz('court','law')}else{G.points[3]+=10;quiz('court','strike')}}if(a==='answer'){if(G.quizChoice!==null)return;G.quizChoice=n;if(questions[G.quizBranch][G.quizIndex][2]===n){const team=quizTeam[G.quizBranch];G.points[team]+=15}}render()}
function next(){if(G.phase==='welcome'){G.phase='choose'}else if(G.phase==='brief'){G.phase='sides'}else if(G.phase==='sides'){G.phase='house'}else if(G.phase==='quiz'){if(G.quizChoice===null)return;if(G.quizNext==='law')report('LAW TAKES EFFECT','The class court upheld the new law in the simulated case.','The bill passed both chambers, was signed or survived a veto, and was upheld by the court.');else if(G.quizNext==='strike')report('COURT BLOCKS THE LAW','The class court ruled that this law violates the Constitution.','Courts can rule laws unconstitutional in legal cases. Congress would need a different plan.');else G.phase=G.quizNext}else if(G.phase==='report'){if(G.round===3)G.phase='end';else{G.round++;G.topic=null;G.phase='choose';G.senateChoice=0}}else if(G.phase==='end')G=fresh();render()}
document.addEventListener('click',e=>{let b=e.target.closest('[data-act]');if(b)action(b.dataset.act,b.dataset.val)});document.getElementById('next').onclick=next;document.getElementById('restart').onclick=()=>{if(confirm('Restart the class game?')){G=fresh();render()}};render();</script></body></html>
