<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Friday 5 | History Presentation TEXT ONLY</title><style>*{box-sizing:border-box}html,body{margin:0;background:#19252c;color:#17232d;font-family:Arial,sans-serif}main{min-height:calc(100dvh - 74px);padding:14px;display:flex}.slide{width:100%;max-width:1200px;min-height:calc(100dvh - 102px);margin:auto;background:#f6efdf;border:5px solid #c8a36b;box-shadow:0 8px 30px #0006;padding:clamp(24px,5vw,65px);display:flex;flex-direction:column;justify-content:center}.tag{font-weight:900;letter-spacing:2px;color:#9f5637;font-size:clamp(13px,1.3vw,19px)}h1{font:700 clamp(35px,4.7vw,68px)/1.08 Georgia,serif;margin:20px 0 10px}h2{font-size:clamp(21px,2vw,31px);color:#985037;margin:0 0 26px}.body{font-size:clamp(21px,2.15vw,32px);line-height:1.48;max-width:1050px}.check{margin-top:36px;padding:17px 21px;background:#e8d7b5;border-left:7px solid #a65437;font-size:clamp(18px,1.7vw,26px);line-height:1.35}.check strong{display:block;font-size:14px;letter-spacing:1px;margin-bottom:9px}.answer{display:block;margin-top:12px;font-weight:700}nav{max-width:1200px;margin:auto;height:74px;display:flex;justify-content:space-between;align-items:center;padding:8px 16px;color:#fff}button{background:#f0c878;color:#1c2931;border:0;border-radius:6px;padding:12px 22px;font:bold 18px Arial;cursor:pointer}button:disabled{opacity:.35}@media(max-width:650px){.slide{padding:20px}.body{font-size:19px}.check{font-size:17px}h1{font-size:33px}}</style></head><body><main><article class="slide" id="slide"></article></main><nav><button id="back">◀ BACK</button><strong id="page"></strong><button id="next">NEXT ▶</button></nav><script>const slides=[["THE LOUISIANA PURCHASE","1803","President Thomas Jefferson wanted the United States to have better access to the Mississippi River. France offered to sell a huge area of land. The Louisiana Purchase nearly doubled the size of the country, although Native nations already lived on that land.","What territory did the U.S. buy from France in 1803?","Louisiana Territory"],["WARS OF THE 1800s","1800s","The United States fought several wars as the country grew. The War of 1812 was against Britain. The Mexican-American War brought major land changes. By 1898, the Spanish-American War extended American power overseas.","Name one war fought by the United States in the 1800s.","Spanish-American War"],["A NATION DIVIDED","1861","For decades, Americans argued over slavery and its expansion. Southern states left the United States after Lincoln was elected. Their attempt to form a separate country led to war against the Union.","What was the war between the North and South?","The Civil War"],["A WAR THAT CHANGED AMERICA","1863","The Civil War included terrible battles and major decisions. In 1863, Lincoln issued the Emancipation Proclamation. Later that year, Union victories at Gettysburg and Vicksburg helped turn the war.","Name one important event of the Civil War.","The Emancipation Proclamation"],["LINCOLN LEADS THE UNION","1861–1865","Abraham Lincoln became the sixteenth president in 1861. He led the United States through the Civil War and fought to keep the Union together. His Gettysburg Address challenged Americans to protect a government based on equality.","What is Abraham Lincoln famous for?","He led the United States during the Civil War."],["THE EMANCIPATION PROCLAMATION","1863","Lincoln declared that enslaved people in states rebelling against the Union were free. The order did not immediately end slavery across the country, but it helped turn the war into a fight for freedom as well as national unity.","What did the Emancipation Proclamation do?","It declared enslaved people in Confederate states free."],["THE CIVIL WAR ENDS","1865","After four years of fighting, Confederate forces surrendered. The Union survived, and the Thirteenth Amendment ended slavery in the United States, except as punishment for a crime. The country now faced the challenge of rebuilding.","What U.S. war ended slavery?","The Civil War."],["CITIZENSHIP AFTER THE WAR","1868","After the Civil War, the nation had to decide who would be recognized and protected as a citizen. The Fourteenth Amendment established national citizenship for people born or naturalized in the United States and subject to its jurisdiction.","Which amendment defines citizenship for people born or naturalized in the United States?","14th Amendment"],["VOTING RIGHTS EXPAND","1870","The Fifteenth Amendment stopped governments from denying voting rights based on race, color, or previous enslavement. Many Black men gained the vote, though violence and discriminatory laws later kept many from using it.","When did all men get the right to vote, according to the test?","1870."],["WOMEN FIGHT FOR THE VOTE","1800s","Women organized meetings, speeches, petitions, and protests to demand equal political rights. Elizabeth Cady Stanton helped lead the movement in the 1800s. The fight continued long after her lifetime.","Name one leader of the women's rights movement in the 1800s.","Elizabeth Cady Stanton."],["AMERICA ENTERS THE 1900s","1900s","The next century brought new wars, economic crises, and major battles over civil rights. American decisions would increasingly affect people around the world.","Name one war fought by the United States in the 1900s.","World War II."],["WORLD WAR I","1917","World War I began in Europe in 1914. The United States stayed out at first. German submarine attacks and other developments helped push America into the conflict in 1917, when it joined the Allied Powers.","Why did the U.S. enter World War I, according to the test choices?","To support the Allied Powers."],["THE NINETEENTH AMENDMENT","1920","After generations of activism, the Nineteenth Amendment stopped states from denying the vote based on sex. Many women could vote nationwide in 1920, although barriers still kept some women of color from the polls.","When did women get the right to vote?","1920."],["THE GREAT DEPRESSION","1930s","Banks failed, businesses closed, and millions of workers lost their jobs. Families struggled to afford housing and food. The Great Depression was much more than a bad week on Wall Street. It lasted for years.","What was the Great Depression?","A very long and severe economic downturn."],["THE CRASH OF 1929","1929","Stock prices fell sharply in October 1929, helping trigger a wider economic crisis. The crash was an important starting point, but problems with banks, debt, and the economy made the Depression last much longer.","When did the Great Depression start?","With the stock market crash of 1929."],["FRANKLIN D. ROOSEVELT","1933–1945","Franklin Roosevelt became president during the Great Depression. His New Deal programs tried to help struggling Americans and support the economy. Later, he led the country through much of World War II.","Who was president during the Great Depression and World War II?","Franklin Roosevelt."],["PEARL HARBOR","DECEMBER 7, 1941","The United States had been helping the Allies while remaining outside direct combat in World War II. Japan attacked the U.S. naval base at Pearl Harbor in Hawaii. America entered the war soon afterward.","Why did the U.S. enter World War II?","Japan attacked Pearl Harbor."],["EISENHOWER IN WORLD WAR II","1944","Dwight Eisenhower was a top Allied military commander. He directed the D-Day invasion of Normandy, a major operation against Nazi Germany. Years later, Americans elected him president.","What is Dwight Eisenhower famous for?","He was a general during World War II."],["THE COLD WAR BEGINS","AFTER 1945","The United States and the Soviet Union emerged from World War II as superpowers. They competed over military power, political influence, and different ideas about government, even without fighting a direct war against each other.","Who was the United States' main rival during the Cold War?","The Soviet Union, also called Russia on the test."],["FEAR OF COMMUNISM","COLD WAR","The Soviet Union had a communist government. American leaders worried that communist movements might spread to other countries. This fear shaped U.S. alliances, foreign aid, and military decisions for decades.","What was one main U.S. concern during the Cold War?","The spread of communism."],["THE KOREAN WAR","1950–1953","North Korea invaded South Korea in 1950. The United States joined a United Nations force supporting South Korea. American leaders viewed the war as part of their effort to contain communism.","Why did the U.S. enter the Korean War?","To stop the spread of communism."],["THE VIETNAM WAR","1960s–1970s","American leaders feared that a communist victory in Vietnam would strengthen communism in Asia. U.S. military involvement expanded, and the war became increasingly unpopular at home. It ended with a communist victory in 1975.","Why did the U.S. enter the Vietnam War?","To stop the spread of communism."],["THE CIVIL RIGHTS MOVEMENT","1950s–1960s","Black Americans and allies challenged segregation and unequal treatment. They organized boycotts, marches, court cases, and voter registration drives. Their goal was to end racial discrimination and make equal rights a reality.","What did the civil rights movement fight to do?","End racial discrimination."],["MARTIN LUTHER KING JR.","1963","Martin Luther King Jr. became a major leader of the civil rights movement. He supported nonviolent protest and helped organize marches that demanded equal rights. His speeches encouraged Americans to confront injustice.","What is Martin Luther King Jr. famous for?","Fighting for civil rights."],["THE PERSIAN GULF WAR","1990–1991","Iraq invaded the nearby country of Kuwait in 1990. The United States led an international coalition that used military force in 1991 to remove Iraqi troops from Kuwait.","Why did the U.S. enter the Persian Gulf War?","To force Iraqi forces out of Kuwait."],["SEPTEMBER 11, 2001","2001","Terrorists from al-Qaeda hijacked four passenger planes. Two struck the World Trade Center in New York City, and one hit the Pentagon. A fourth crashed in Pennsylvania after passengers resisted. Thousands of people were killed.","What happened in the United States on September 11, 2001?","Terrorists attacked the United States."],["AFTER SEPTEMBER 11","2001 AND AFTER","The United States launched military operations after the September 11 attacks. The Global War on Terror included the war in Afghanistan and counterterrorism missions in several countries. These actions led to long debates about security and civil liberties.","Name one U.S. military conflict after September 11, 2001.","The Global War on Terror."],["NATIVE NATIONS TODAY","PAST AND PRESENT","Native American nations were here long before the United States existed and remain part of America today. They have their own histories, communities, cultures, and governments. The Apache, Cherokee, and Navajo are examples of Native nations.","Name one American Indian tribe.","Apache, Cherokee, or Navajo."],["AMERICAN INVENTIONS","1800s–1900s","New technologies changed how Americans lived and worked. The light bulb helped bring electric lighting into homes. The airplane changed travel. The assembly line allowed factories to make products much faster.","Name one American innovation.","The airplane, light bulb, or assembly line."]];let i=0;function esc(v){return String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function render(){const s=slides[i];document.getElementById('slide').innerHTML='<div class="tag">FRIDAY 5 · U.S. HISTORY & CIVICS</div><h1>'+esc(s[0])+'</h1><h2>'+esc(s[1])+'</h2><div class="body">'+esc(s[2])+'</div>'+(s[3]?'<div class="check"><strong>CIVICS TEST QUESTION</strong>'+esc(s[3])+'<span class="answer">Answer: '+esc(s[4])+'</span></div>':'');document.getElementById('page').textContent=(i+1)+' / '+slides.length;document.getElementById('back').disabled=i===0;document.getElementById('next').disabled=i===slides.length-1}function move(n){i=Math.max(0,Math.min(slides.length-1,i+n));render()}document.getElementById('back').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});render()</script></body></html>
