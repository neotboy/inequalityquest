<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Friday 5 — The 1800s Express Briefing</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#172129;color:#162331}main{padding:16px;min-height:calc(100vh - 68px)}.slide{max-width:1500px;margin:auto;background:#f5edd9;border:5px solid #c9a46f;display:grid;grid-template-columns:57% 43%;min-height:calc(100vh - 108px);box-shadow:0 10px 30px #0008}.story{padding:clamp(20px,3.3vw,48px);display:flex;flex-direction:column;gap:14px}.tag{color:#975134;font-weight:900;letter-spacing:2px;font-size:clamp(13px,1.25vw,18px)}h1{font:700 clamp(34px,4.3vw,66px)/1.06 Georgia,serif;margin:14px 0 0}h2{font-size:clamp(20px,2vw,31px);color:#965035;margin:0}.body{font-size:clamp(19px,1.86vw,29px);line-height:1.42}.check{margin-top:auto;border-left:6px solid #ad5c36;background:#e8d9b8;padding:13px 17px;font-size:clamp(17px,1.45vw,24px)}.check b{display:block;font-size:13px;letter-spacing:1px;margin-bottom:6px}.check span{display:block;font-size:16px;margin-top:7px;color:#394d4b}.art{background:#d9c5a2;display:flex;align-items:center;justify-content:center;overflow:hidden;border-left:3px solid #ba9f72}.art svg{width:100%;max-height:80vh}.nav{max-width:1500px;margin:auto;min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:15px;padding:10px 16px;color:white}.nav button{background:#f0c779;border:0;border-radius:5px;padding:11px 20px;font-weight:900;font-size:16px;cursor:pointer}.nav button:disabled{opacity:.3}.frame{fill:#ebdbbd;stroke:#533e2e;stroke-width:10}.ink{fill:#493c34}.red{fill:#a2523d}.gold{fill:#c49a60}svg text{font-family:Georgia,serif;fill:#493c34;font-weight:bold}@media(max-width:850px){.slide{grid-template-columns:1fr;min-height:0}.art{border-left:0;border-top:3px solid #ba9f72;min-height:250px}.art svg{max-height:300px}.body{font-size:19px}.story{padding:18px}}
</style></head><body><main><div class="slide"><div id="story" class="story"></div><div class="art" id="art"></div></div></main><nav class="nav"><button id="back">◀ BACK</button><strong id="count"></strong><button id="next">NEXT ▶</button></nav><script>
const slides=[["A COUNTRY GROWS","1803","The new United States was still a small country east of the Mississippi River. President Thomas Jefferson wanted access to the Mississippi River for trade. France offered to sell a huge stretch of land. Jefferson agreed, and the Louisiana Purchase nearly doubled the country’s size.","What territory did the United States buy from France in 1803?","Louisiana Territory","map"],["MORE LAND, MORE CONFLICT","1803–1850","As settlers moved west, the United States took control of land where Native nations already lived. The government forced many Native communities from their homes. New territories also raised a bitter question: would slavery be allowed there?","","","west"],["THE NATION FIGHTS WARS","1800s","The United States fought several wars during this century. The War of 1812 was fought against Britain. The Mexican-American War brought more land under U.S. control. The Civil War tore the country apart. Later, the Spanish-American War expanded U.S. influence overseas.","Name one war the United States fought in the 1800s.","War of 1812, Mexican-American War, Civil War, or Spanish-American War","timeline"],["A COUNTRY DIVIDED","BEFORE 1861","Slavery was central to the economy of many Southern states. Enslaved people were forced to work and had no freedom. Many Northerners opposed slavery spreading west, while abolitionists demanded an end to slavery everywhere. Political fights grew as the country expanded.","","","divide"],["THE CIVIL WAR BEGINS","1861","Abraham Lincoln won the 1860 presidential election. Southern states began leaving the United States because they feared slavery would be restricted. They formed the Confederacy. In April 1861, Confederate forces attacked Fort Sumter. The Civil War had begun.","What was the war between the North and the South called?","The Civil War","fort"],["WHO WAS ABRAHAM LINCOLN?","1861–1865","Lincoln was the 16th president. During the Civil War, he led the Union government and worked to keep the United States together. In 1863, he gave the Gettysburg Address, a short speech about equality, sacrifice, and the future of democracy.","Name one thing Abraham Lincoln is known for.","16th president; led the nation in the Civil War; preserved the Union; Gettysburg Address; Emancipation Proclamation","lincoln"],["THE PROMISE OF FREEDOM","1863","Lincoln issued the Emancipation Proclamation. It declared enslaved people in states rebelling against the Union free. It did not immediately end slavery everywhere, and freedom depended on Union victory and enforcement. Still, it changed the purpose of the war and opened the door for more Black soldiers to fight for the Union.","What did the Emancipation Proclamation do?","Freed enslaved people in the Confederacy","document"],["THE WAR TURNS","1863–1865","The Union won important victories at Gettysburg and Vicksburg in 1863. Fighting continued until Confederate general Robert E. Lee surrendered at Appomattox Court House in April 1865. Only days later, Lincoln was assassinated. The Union survived, but rebuilding the country would be difficult.","Name one important event of the Civil War.","Fort Sumter, Gettysburg, Vicksburg, Appomattox, Emancipation Proclamation, or Lincoln’s assassination","war"],["SLAVERY ENDS IN LAW","1865","Winning the Civil War did not solve every problem, but it helped bring an end to slavery. The 13th Amendment, ratified in 1865, abolished slavery, except as punishment for a crime. Millions of formerly enslaved people faced the enormous challenge of building lives after generations of forced labor.","What U.S. war ended slavery?","The Civil War","chains"],["WHO COUNTS AS A CITIZEN?","1868","After the war, the United States entered Reconstruction. The 14th Amendment said that people born or naturalized in the United States, and subject to its jurisdiction, are citizens. It also required states to provide equal protection of the laws.","Which amendment defines citizenship for people born or naturalized in the United States?","14th Amendment","amend"],["A NEW VOTING RIGHT","1870","The 15th Amendment prohibited denying voting rights because of race, color, or previous enslavement. In principle, Black men could now vote. However, violence, intimidation, poll taxes, and unfair tests later blocked many Black Americans from voting. A constitutional right did not always mean fair access.","When did all men get the right to vote under the 15th Amendment?","1870; after the Civil War; during Reconstruction","ballot"],["WOMEN DEMAND A VOICE","1800s","Women could not vote in most U.S. elections during the 1800s. Leaders such as Susan B. Anthony, Elizabeth Cady Stanton, Sojourner Truth, and Lucretia Mott fought for political rights. Their movement lasted for generations. Women’s suffrage became protected nationwide with the 19th Amendment in 1920.","Name one leader of the women's rights movement in the 1800s.","Susan B. Anthony, Elizabeth Cady Stanton, Sojourner Truth, Lucretia Mott, Lucy Stone, or Harriet Tubman","women"],["THE 1800s EXPRESS","MISSION BRIEF","You are about to run a newspaper during an age of expansion, war, and major changes in rights. Some reports will be accurate. Others will leave out important facts or give the wrong date. Your job is to investigate the evidence and publish the correct history.","","","press"]];let page=0;
function illustration(kind){const label={map:"LOUISIANA PURCHASE",west:"WESTWARD MOVEMENT",timeline:"NINETEENTH CENTURY",divide:"A NATION DIVIDED",fort:"FORT SUMTER 1861",lincoln:"ABRAHAM LINCOLN",document:"EMANCIPATION 1863",war:"THE CIVIL WAR",chains:"13TH AMENDMENT",amend:"14TH AMENDMENT",ballot:"15TH AMENDMENT",women:"WOMEN'S RIGHTS",press:"THE 1800s EXPRESS"}[kind];let picture='';
if(kind==='map'||kind==='west')picture='<path d="M92 160 L180 95 255 125 300 215 258 322 140 340 78 255Z" fill="#b98e64" stroke="#493c34" stroke-width="6"/><path d="M280 132 L428 150 505 232 460 344 308 314 283 230Z" fill="#8d9b7b" stroke="#493c34" stroke-width="6"/><path d="M280 92 Q290 210 283 350" fill="none" stroke="#4b7181" stroke-width="12"/>';
else if(kind==='fort'||kind==='war')picture='<path d="M105 310 V205 L170 175 220 202 280 172 338 202 405 166 480 208 V310Z" fill="#aa8461" stroke="#4e4034" stroke-width="7"/><path d="M135 180 l-18 -62 m89 51 l18 -65 m114 63 l32 -63" stroke="#94503a" stroke-width="9"/><circle cx="155" cy="132" r="17" fill="#d7a16a"/><circle cx="351" cy="120" r="18" fill="#d7a16a"/>';
else if(kind==='lincoln'||kind==='women')picture='<circle cx="290" cy="158" r="70" fill="#ae8b6c"/><path d="M205 350 Q205 245 292 245 Q392 245 396 350" fill="#546578"/><path d="M250 91 Q292 32 341 90 L354 120 232 120Z" fill="#493c34"/>';
else if(kind==='document'||kind==='amend'||kind==='chains'||kind==='ballot')picture='<path d="M154 93 H415 V363 H154Z" fill="#fff5d8" stroke="#8a6a4c" stroke-width="8"/><path d="M185 148 H382 M185 182 H373 M185 216 H355 M185 250 H382 M185 284 H338" stroke="#9d8b6e" stroke-width="10"/><circle cx="357" cy="317" r="24" fill="#a2523d"/>';
else if(kind==='press')picture='<rect x="129" y="115" width="336" height="225" rx="6" fill="#745c47"/><rect x="152" y="137" width="293" height="175" fill="#f5e7ca"/><path d="M170 178 H430 M170 221 H430 M170 264 H430" stroke="#776957" stroke-width="13"/>';
else picture='<path d="M90 320 L175 150 290 280 390 100 487 320Z" fill="#a88b69"/><path d="M110 320 H477" stroke="#493c34" stroke-width="12"/>';
return '<svg viewBox="0 0 570 465" role="img" aria-label="Graphic illustration: '+label+'"><rect x="38" y="35" width="494" height="395" rx="14" class="frame"/><rect x="57" y="52" width="456" height="350" rx="5" fill="#e9d9b7"/>'+picture+'<rect x="80" y="371" width="413" height="49" fill="#4e4034"/><text x="286" y="403" fill="#fff6db" font-size="22" text-anchor="middle" style="fill:#fff6db">'+label+'</text></svg>'}
function draw(){const s=slides[page];document.getElementById('story').innerHTML='<div class="tag">FRIDAY 5 / THE 1800s EXPRESS</div><h1>'+s[0]+'</h1><h2>'+s[1]+'</h2><div class="body">'+s[2]+'</div>'+(s[3]?'<div class="check"><b>CIVICS TEST CHECK</b>'+s[3]+'<span>Answer: '+s[4]+'</span></div>':'');document.getElementById('art').innerHTML=illustration(s[5]);document.getElementById('count').textContent=(page+1)+' / '+slides.length;document.getElementById('back').disabled=page===0;document.getElementById('next').disabled=page===slides.length-1}document.getElementById('back').onclick=()=>{page--;draw()};document.getElementById('next').onclick=()=>{page++;draw()};addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&page<slides.length-1){page++;draw()}if(e.key==='ArrowLeft'&&page>0){page--;draw()}});draw();
</script></body></html>
