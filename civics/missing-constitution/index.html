:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f6f3e9;background:#090f19}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#223d56,#080d16 72%);min-height:100vh}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:3px solid #ffe38b}.shell{max-width:1220px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.mark{font-size:22px;font-weight:1000;letter-spacing:.04em}.tag{background:#ffffff16;border:1px solid #ffffff32;padding:6px 12px;border-radius:30px;font-size:12px}.spacer{flex:1}.btn{border:1px solid #ffffff50;background:#263f56;padding:10px 15px;border-radius:11px;font-weight:700}.btn:hover,.object:hover{filter:brightness(1.19)}.gold{background:#f1c866;color:#19202b;border:0}.danger{background:#693847}.stage{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(250px, .8fr);gap:16px;margin-top:14px}.scene{position:relative;aspect-ratio:16/10;min-height:375px;overflow:hidden;border:5px solid #665744;border-radius:18px;background:linear-gradient(#172b40 0 63%,#49382b 63%);box-shadow:0 20px 60px #0009}.scene:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 24%,#ffffff07 24% 24.4%);pointer-events:none}.wall{position:absolute;inset:6% 5% 38%;border:2px solid #ffffff18}.floor{position:absolute;top:66%;left:-10%;width:120%;height:45%;transform:perspective(210px) rotateX(25deg);background:repeating-linear-gradient(90deg,#191b20 0 10%,#282323 10% 10.8%);opacity:.45;pointer-events:none}.banner{position:absolute;left:4%;top:4%;padding:9px 15px;background:#0b1420bb;border:1px solid #f4d28a77;border-radius:9px;font-weight:900;letter-spacing:.08em;font-size:clamp(12px,2vw,21px)}.object{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border:2px solid #ffe7a45e;border-radius:12px;background:linear-gradient(145deg,#344f61,#182936);box-shadow:0 9px 0 #0007,0 15px und:linear-gradient(135deg,#203a4e,#101f32);border:2px solid #c7aa70;border-radius:20px;padding:25px;box-shadow:0 15px 60px #000b;max-height:93vh;overflow-y:auto}.panel h1{font-size:clamp(24px,4vw,39px);margin:4px 0 10px}.panel h2{margin:6px 0 12px}.panel p{line-height:1.5;color:#d9e3e8}.eyebrow{color:#f1d18a;letter-spacing:.16em;font-size:12px;font-weight:900;text-transform:uppercase}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:17px 0}.choice{border:1px solid #7994ab;background:#2e4b64;border-radius:12px;padding:13px;text-align:left;min-height:58px;font-weight:750}.choice:hover{background:#426d83}.choice.selected{border:2px solid #fbd477;background:#665530}.choice.used{opacity:.35;pointer-events:none}.slots{display:flex;gap:10px;flex-wrap:wrap;margin:17px 0}.slot{min-height:60px;flex:1;min-width:120px;background:#07182a;border:2px dashed #688197;border-radius:10px;padding:10px;font-size:13px}.slot.good{border:2px solid #4ed2a5}.feedback{padding:12px;border-radius:10px;background:#473a2e;margin:10px 0;font-size:14px;line-height:1.4}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.bottom{padding:12px 2px;color:#acb8c8;font-size:12px}.scenehint{position:absolute;left:4%;bottom:4%;font-size:12px;padding:8px;background:#06131ace;border-radius:8px}.flash{animation:pop .25s}.hide{display:none!important}@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:scale(1);opacity:1}}@keyframes glow{50%{box-shadow:0 9px 0 #0007,0 13px 25px #ffdf7444}}@media(max-width:850px){.stage{grid-template-columns:1fr}.scene{min-height:320px}.choices{grid-template-columns:1fr}.object{min-width:76px;min-height:75px}.object .caption{font-size:11px}.panel{padding:16px}}

const rooms=[
{title:'THE NATIONAL ARCHIVES',short:'The Archives',story:'The Constitution has vanished. Security footage is gone, but three objects in the archive contain clues. Recover all three evidence stamps to unlock the service door.',objects:[['security','📹','Security Feed',24,35],['desk','🗳️','Voting Desk',53,68],['display','📜','Empty Display',55,32]]},
{title:'THE AMENDMENT GALLERY',short:'Amendment Gallery',story:'A hidden passage leads to the amendment gallery. Someone replaced the exhibit labels and scrambled the Bill of Rights display.',objects:[['switches','🔐','Amendment Lock',26,35],['cabinet','🗃️','Rights Cabinet',51,66],['frame','🖼️','Exhibit Frame',55,32]]},
{title:'THE FOUNDERS’ STUDY',short:'Founders’ Study',story:'In the private study, a torn declaration and a scrambled set of principles point toward the thief’s final hiding place.',objects:[['pages','📑','Torn Pages',25,36],['map','🗺️','Founding Map',53,31],['radio','📻','Secret Radio',51,69]]},
{title:'THE HIDDEN VAULT',short:'Hidden Vault',story:'The vault is almost within reach. Restore the economic record, decode the legal warning, and identify a document that influenced the Constitution.',objects:[['market','💰','Market Machine',25,36],['scales','⚖️','Justice Scale',54,33],['books','📚','Old Books',52,69]]}

const tasks={
security:{name:'CORRUPTED SECURITY FEED',type:'pick',prompt:'SECURITY LOG — 9:42 PM: “Residents vote for council members, then those members debate and pass local laws.” Which system does this describe?',opts:['Direct democracy, because voters choose the council members','Republic, because elected representatives make laws','Constitutional monarchy, because voters choose a monarch','Confederation, because local councils make laws'],answer:1,explain:'The United States is a republic: voters elect people to represent them. [Official Q1]',item:'Security badge'},
desk:{name:'THE STOLEN PREAMBLE',type:'order',prompt:'Someone cut apart the opening message on the archive desk. Rebuild the WHOLE statement of where government power comes from. One additional phrase was planted as a decoy.',parts:['We','the','People','give government','its authority','the King'],answer:['We','the','People','give government','its authority'],explain:'The Constitution begins “We the People.” Its authority comes from the people, not a king. [Official Q4]',item:'Preamble strip'},
display:{name:'THREE LAWS, THREE CLUES',type:'pairs',prompt:'A thief switched the museum labels. Match each EVIDENCE CARD on the left with the accurate CIVICS IDEA on the right. Take care: these ideas are related but not identical.',pairs:[['Judges apply the Constitution before a conflicting state rule','Supreme law of the land'],['A document organizes Congress, the presidency, and federal courts','Constitution sets up the government'],['A mayor faces legal consequences for breaking the law','Rule of law'],['Voters choose representatives to make laws','Republic']],explain:'The Constitution is supreme law and defines the federal government. Rule of law binds leaders, and a republic uses elected representatives. [Official Q1–3, Q13]',item:'Archive seal'},
switches:{name:'AMENDMENT CONTROL PANEL',type:'pick',prompt:'CONTROL PANEL: A proposal to add a new protection to the Constitution has passed Congress with the required two-thirds vote in both chambers. What must happen next before it becomes an amendment?',opts:['The president must sign it before it goes to the states','The Supreme Court must rule that it follows existing rights','Three-fourths of the states must ratify it','A majority of voters must approve it in a national election'],answer:2,explain:'Most amendments require proposal by two-thirds of each chamber of Congress and ratification by three-fourths of states. [Official Q5]',item:'Amendment key'},
cabinet:{name:'RIGHTS CABINET: THE MISFILED CLAIMS',type:'pairs',prompt:'Investigators found misleading claims attached to constitutional documents. Match each evidence card to the best legal concept.',pairs:[['A city cannot silence peaceful criticism simply because it dislikes the message','Freedom of speech'],['People gather peacefully to demand a change in policy','Freedom of assembly'],['A newspaper reports embarrassing facts about elected leaders','Freedom of the press'],['People ask lawmakers to fix a problem by signing requests','Right to petition'],['Government cannot establish an official national religion','Freedom of religion']],explain:'The First Amendment protects religion, speech, press, assembly, and petition. [Official Q7–8]',item:'Rights file'},
frame:{name:'THE AMENDMENT TIMELINE',type:'order',prompt:'The curator left five evidence slips. Put them in order from the first major founding document to the last step that added the first federal rights protections.',parts:['Constitution drafted','Constitution ratified','Congress proposes rights amendments','States ratify ten amendments','Bill of Rights takes effect'],answer:['Constitution drafted','Constitution ratified','Congress proposes rights amendments','States ratify ten amendments','Bill of Rights takes effect'],explain:'The Constitution was drafted in 1787, ratified beginning in 1788, and the Bill of Rights was ratified in 1791. [Official Q5–9]',item:'Gallery stamp'},
pages:{name:'THE DECLARATION FRAGMENTS',type:'order',prompt:'The thief scrambled Jefferson’s list of natural rights. Rebuild the declaration’s famous phrase in the correct order. The planted fragment is a decoy.',parts:['Life,','Liberty,','and the','pursuit of','Happiness','property alone'],answer:['Life,','Liberty,','and the','pursuit of','Happiness'],explain:'The Declaration names life, liberty, and the pursuit of happiness as rights. [Official Q10]',item:'Declaration fragment'},
map:{name:'THE DOCUMENT CROSS-EXAMINATION',type:'pick',prompt:'The map contains the words “these United Colonies are, and of Right ought to be Free and Independent States.” Which document is it from, and what was that document’s main purpose?',opts:['Articles of Confederation — it created the first national government','Declaration of Independence — it announced a break from Britain','Constitution — it created the three branches of government','Bill of Rights — it listed freedoms protected from federal interference'],answer:1,explain:'The Declaration of Independence announced separation from Great Britain. The other documents served different purposes. [Official Q11]',item:'Independence map'},
radio:{name:'THE FOUNDERS’ CODEWORDS',type:'pairs',prompt:'The secret broadcast uses ideas instead of document titles. Pair every intercepted clue with its actual source or principle.',pairs:[['“We the People” gives public authority to government','Popular sovereignty'],['“Free and Independent States” cuts ties with Britain','Declaration of Independence'],['“Congress shall make no law...” protects expression','First Amendment'],['First ten changes protecting basic liberties','Bill of Rights'],['Foundational plan for federal branches and powers','U.S. Constitution']],explain:'These founding terms are connected, but each describes a specific principle or document. [Official Q2–11]',item:'Radio transcript'},
market:{name:'THE ECONOMIC RECORD',type:'pick',prompt:'Investigators find that a bakery is privately owned, shoppers can choose where to buy bread, and prices rise when bread is scarce. Which system best fits all three clues?',opts:['Market economy, because most decisions are shaped by buyers and sellers','Command economy, because the federal government sets all prices','Traditional economy, because customs alone determine what is sold','Feudal economy, because landowners control every business'],answer:0,explain:'The civics test accepts capitalism or market economy. Markets rely heavily on private choices and supply and demand. [Official Q12]',item:'Market token'},
scales:{name:'THE RULE-OF-LAW INVESTIGATION',type:'pairs',prompt:'The suspect thinks powerful people get special legal privileges. Match each real situation with the correct principle or outcome.',pairs:[['The governor is investigated for breaking the law','Leaders are not above the law'],['The same published rule applies to both rich and poor','Laws apply equally'],['Government officials must obey constitutional limits','Government is bound by law'],['A court applies the Constitution over a conflicting state law','Constitution is the supreme law']],explain:'Rule of law applies to all people and officials; the Constitution is the supreme law. [Official Q2, Q13]',item:'Justice emblem'},
books:{name:'THE FOUNDING LIBRARY',type:'pick',prompt:'The archivist wants the shelf with documents and writings that helped shape the Constitution or its ratification. Which shelf belongs in that section?',opts:['Mayflower Compact, Articles of Confederation, Federalist Papers','Bill of Rights, Gettysburg Address, Emancipation Proclamation','Declaration of Independence, Civil Rights Act of 1964, Federalist Papers','Articles of Confederation, 19th Amendment, Federalist Papers'],answer:0,explain:'The Mayflower Compact, Articles of Confederation, and Federalist Papers all predate or relate directly to the Constitution’s drafting and ratification. [Official Q14]',item:'Founders’ book'}

let state;let active=null;let pickLeft=null;let matched=[];let ordered=[];let seconds=0;let timer;
const initial=()=>({room:0,completed:[],mistakes:0,log:['Investigation opened. Search the room for clues.'],finished:false});
function load(){try{state=JSON.parse(localStorage.getItem('civics_missing_v2'))||initial()}catch{state=initial()}render();if(!state.finished)startClock(); if(state.completed.length===0)intro()}
function save(){localStorage.setItem('civics_missing_v2',JSON.stringify(state))}
function startClock(){if(timer)return;timer=setInterval(()=>{seconds++;document.getElementById('clock').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')},1000)}
function modal(markup){const o=document.getElementById('overlay');o.classList.remove('hide');o.innerHTML='<div class="panel flash">'+markup+'</div>'}function closeModal(){document.getElementById('overlay').classList.add('hide');active=null}
function intro(){modal(`<div class="eyebrow">INCOMING TRANSMISSION · 07:42 AM</div><h1>🚨 The Constitution is missing.</h1><p>During the night, someone removed the original Constitution from its display. Investigators found a trail of scrambled documents, locked exhibits, and strange messages.</p><p><b>Your mission:</b> Explore four locations, collect 12 evidence items, and restore the Constitution before the archive closes. Click objects to investigate. Every puzzle uses facts from the civics exam, but you must investigate the evidence and connect ideas. If you make a mistake, you get a clue and can try again.</p><div class="row"><button class="btn gold" onclick="closeModal()">ENTER THE ARCHIVES →</button></div>`)}
function render(){const r=rooms[state.room],sc=document.getElementById('scene');sc.dataset.room=String(state.room);document.getElementById('imageCredit').textContent=['Historic Constitution image · DemocracyWeb','Bill of Rights scan · Wikimedia Commons','Declaration of Independence scan · Wikimedia Commons','Historic Constitution image · DemocracyWeb'][state.room];document.getElementById('roomName').textContent=r.title;document.getElementById('chapter').textContent=`Room ${state.room+1}/4 · ${r.short}`;document.getElementById('story').textContent=r.story;sc.querySelectorAll('.object').forEach(e=>e.remove());r.objects.forEach(([id,emoji,label,x,y])=>{const el=document.createElement('button');el.className='object'+(state.completed.includes(id)?' done':'');el.style.left=x+'%';el.style.top=y+'%';el.innerHTML=`<span class="emoji">${emoji}</span><span class="caption">${label}</span>`;el.onclick=()=>openTask(id);sc.appendChild(el)});const ready=r.objects.every(([id])=>state.completed.includes(id));const door=document.getElementById('door');door.classList.toggle('ready',ready);document.getElementById('doorLabel').textContent=ready?(state.room===3?'SOLVE 4 LOCKS':'ENTER →'):'LOCKED';door.onclick=()=>{if(!ready){modal(`<h2>🔒 Door locked</h2><p>Investigate all three glowing objects in this room. Each one gives an evidence stamp needed to open this door. The final vault has four additional locks.</p><button class="btn gold" onclick="closeModal()">BACK TO THE ROOM</button>`)}else if(state.room===3){vault()}else{state.room++;state.log.unshift('Unlocked '+rooms[state.room].short+'.');save();render();modal(`<div class="eyebrow">DOOR UNLOCKED</div><h1>🔓 ${rooms[state.room].title}</h1><p>${rooms[state.room].story}</p><button class="btn gold" onclick="closeModal()">INVESTIGATE →</button>`)}};document.getElementById('progressText').textContent=state.completed.length+' / 12';document.getElementById('progressBar').style.width=(state.completed.length/12*100)+'%';document.getElementById('inventory').innerHTML=state.completed.length?state.completed.map(k=>`<div class="item">✓ ${tasks[k].item}</div>`).join(''):'<span class="tiny">No evidence yet</span>';document.getElementById('journal').innerHTML=state.log.slice(0,4).map(v=>'• '+v).join('<br>')}
function openTask(id){active=id;const t=tasks[id];if(state.completed.includes(id)){modal(`<div class="eyebrow">EVIDENCE RECOVERED</div><h2>✅ ${t.name}</h2><p>${t.explain}</p><button class="btn" onclick="closeModal()">RETURN</button>`);return}pickLeft=null;matched=[];ordered=[];drawTask()}
function drawTask(msg=''){const t=tasks[active];if(!t)return;let body='';if(t.type==='pick'){body=`<div class="choices">${t.opts.map((v,i)=>`<button class="choice" onclick="choose(${i})">${v}</button>`).join('')}</div>`}else if(t.type==='order'){body=`<p class="tiny">Tap each word or phrase in the correct order. Tap “Clear” to try again.</p><div class="slots">${ordered.map(x=>`<div class="slot good">${x}</div>`).join('')}${Array.from({length:t.answer.length-ordered.length},()=>'<div class="slot">?</div>').join('')}</div><div class="choices">${t.parts.map((v,i)=>`<button class="choice ${ordered.includes(v)?'used':''}" onclick="orderPart(${i})">${v}</button>`).join('')}</div><button class="btn" onclick="ordered=[];drawTask()">Clear</button>`}else{const left=t.pairs.map((p,i)=>({v:p[0],i})).sort((a,b)=>a.v.localeCompare(b.v));const right=t.pairs.map((p,i)=>({v:p[1],i})).sort((a,b)=>a.v.localeCompare(b.v));body=`<p class="tiny">Click a clue on the left, then its matching meaning on the right. Matched pairs disappear.</p><div class="row" style="align-items:stretch"><div style="flex:1;min-width:180px">${left.filter(p=>!matched.includes(p.i)).map(p=>`<button style="width:100%;margin-bottom:8px" class="choice ${pickLeft===p.i?'selected':''}" onclick="pickMatch(${p.i})">${p.v}</button>`).join('')}</div><div style="flex:1;min-width:180px">${right.filter(p=>!matched.includes(p.i)).map(p=>`<button style="width:100%;margin-bottom:8px" class="choice" onclick="finishMatch(${p.i})">${p.v}</button>`).join('')}</div></div><p>${matched.length}/${t.pairs.length} connected</p>`}modal(`<div class="eyebrow">EVIDENCE PUZZLE</div><h2>${t.name}</h2><p>${t.prompt}</p>${body}${msg?`<div class="feedback">${msg}</div>`:''}<div class="row" style="margin-top:14px"><button class="btn" onclick="closeModal()">← Explore room</button><button class="btn" onclick="showHint()">💡 Clue</button></div>`)}
function choose(i){const t=tasks[active];if(i===t.answer)complete();else{state.mistakes++;drawTask('Not quite. Look for the meaning that matches the clue. Try again—nothing is lost.')}}
function orderPart(i){const t=tasks[active];const v=t.parts[i];if(ordered.includes(v))return;ordered.push(v);if(ordered.length===t.answer.length){if(ordered.every((v,i)=>v===t.answer[i]))complete();else{state.mistakes++;ordered=[];drawTask('The scanner rejected that order. Try arranging the phrase again.')}}else drawTask()}
function pickMatch(i){pickLeft=i;drawTask()}function finishMatch(i){if(pickLeft===null){drawTask('Select a clue on the left first.');return}if(pickLeft===i){matched.push(i);pickLeft=null;if(matched.length===tasks[active].pairs.length)complete();else drawTask('✓ Connection confirmed.')}else{state.mistakes++;pickLeft=null;drawTask('Those do not match. Look closely at the ideas and try again.')}}
function complete(){const id=active,t=tasks[id];if(!state.completed.includes(id))state.completed.push(id);state.log.unshift('Recovered '+t.item+'.');save();render();modal(`<div class="eyebrow">EVIDENCE SECURED</div><h1>✨ ${t.item} collected!</h1><p>${t.explain}</p><p class="tiny">${state.completed.length} of 12 evidence items found</p><button class="btn gold" onclick="closeModal()">KEEP INVESTIGATING →</button>`)}
function showHint(){if(!active){const r=rooms[state.room];const left=r.objects.filter(o=>!state.completed.includes(o[0]));modal(`<h2>💡 Investigation hint</h2><p>${left.length?'Try clicking '+left[0][2]+'. Each glowing object is a puzzle.':'You have collected every item in this room. Click the door on the right to continue.'}</p><button class="btn gold" onclick="closeModal()">BACK</button>`);return}const t=tasks[active];let clue=t.type==='order'?'Say the complete phrase out loud before tapping the pieces.':t.type==='pairs'?'Match the definition and concept, rather than matching similar-looking words.':'One choice is an accepted answer in the U.S. civics study guide.';drawTask('💡 '+clue)}
const vaultQuestions=[
