<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel Town — Day 3 Teacher Briefing</title><style>*{box-sizing:border-box}body{background:#eed1ef;margin:0;color:#302846;font-family:Arial,Helvetica,sans-serif}#slide{width:min(1460px,98vw);min-height:calc(100vh - 94px);margin:12px auto 0;background:#fff9e9;border:7px solid #302846;box-shadow:10px 10px #65466d;padding:clamp(18px,2.5vw,38px);display:flex;flex-direction:column;gap:14px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;border-bottom:5px solid #302846;padding-bottom:12px}.pixel{font-family:monospace;font-weight:1000;letter-spacing:.1em;background:#ffe47b;border:3px solid #302846;padding:10px 16px}.act{font-size:clamp(14px,1.3vw,20px);font-weight:950}.head{display:flex;gap:24px;align-items:center}.sticker{display:flex;justify-content:center;align-items:center;background:#9edffa;outline:5px solid #302846;border-radius:8px;width:125px;height:120px;font-size:75px;flex-shrink:0;box-shadow:7px 7px #d17dad}h1{font-size:clamp(36px,4.9vw,75px);line-height:1.02;margin:0;font-weight:1000;letter-spacing:-.03em}.sub{font-size:clamp(18px,2.0vw,29px);color:#8e3d78;font-weight:1000;margin-top:8px}.body{display:grid;grid-template-columns:1fr minmax(260px,30%);gap:22px;flex:1;align-items:stretch}.lessons{background:#e0f7ed;border:4px solid #302846;padding:20px 27px;display:flex;flex-direction:column;justify-content:center}.lessons p{font-size:clamp(21px,2.25vw,34px);font-weight:850;line-height:1.22;margin:12px 0}.lessons p::before{content:'★ ';color:#cd5a9c}.side{background:#f9d9f1;border:4px solid #302846;padding:18px;display:flex;flex-direction:column;justify-content:center;gap:15px}.side .label{font-size:clamp(15px,1.35vw,22px);font-weight:1000;color:#9b326d}.side .question{font-size:clamp(22px,2.05vw,32px);line-height:1.17;font-weight:1000}.source{font-size:14px;font-weight:900;margin-top:auto}.nav{display:flex;justify-content:space-between;gap:10px;align-items:center;max-width:1460px;margin:16px auto;padding:0 15px}button{background:#ffe47b;border:4px solid #302846;box-shadow:4px 4px #302846;padding:12px 24px;color:#302846;font-weight:1000;font-size:18px;cursor:pointer}button:hover{background:#b9efdb}button:disabled{opacity:.3;cursor:default}#progress{font-weight:1000;font-size:22px}a{color:#302846;font-weight:900}@media(max-width:750px){.body{grid-template-columns:1fr}.sticker{width:72px;height:72px;font-size:45px}.lessons p{font-size:23px}.side{padding:12px}.head{gap:15px}}</style></head><body><div id="slide"></div><nav class="nav"><button id="prev">← BACK</button><span id="progress"></span><button id="next">NEXT →</button></nav><script>const deck=[["🎮", "WELCOME TO PIXEL TOWN", "CIVIC QUEST: YOUR MISSION", ["The town has 6 places to visit and a final election stage.", "At each stop, your choices affect what happens to people.", "Your mission: learn how Americans use their rights and help their communities."], "TODAY’S CHALLENGE", "What could YOU do to help your town?", "Town map • all missions"], ["🗳️", "WHO GETS TO VOTE?", "THE POLLING PLACE", ["U.S. citizens age 18 or older can vote in federal elections if eligible.", "The 26th Amendment lowered the voting age to 18.", "Voting rights were also expanded by amendments ending race-based and sex-based voting restrictions and poll taxes."], "GAME CONNECTION", "A student turns 18. Help them figure out if they can vote.", "USCIS Q63–64"], ["📣", "WHICH RIGHTS BELONG TO EVERYONE?", "RIGHTS PARK", ["People in the U.S. have rights such as speech, religion, peaceful assembly, and petition.", "These rights do not belong only to citizens.", "A peaceful protest can criticize the government. Reasonable safety rules may still apply."], "QUICK VOTE", "Can the mayor ban a peaceful rally only because they dislike its message?", "USCIS Q65"], ["📰", "HOW CAN YOU MAKE A CHANGE?", "THE NEWSROOM + CITY HALL", ["Civic participation means taking part in your community or government.", "Examples: vote, contact a lawmaker, sign a petition, join a group, or write to a newspaper.", "A free press can report on government; check election information with official sources."], "GAME CONNECTION", "Catch a false voting rumor and help neighbors petition city hall.", "USCIS Q69"], ["🇺🇸", "WHAT DOES THE PLEDGE MEAN?", "LOYALTY TO A COUNTRY", ["The Pledge of Allegiance expresses loyalty to the United States and its flag.", "It does NOT mean you have to agree with every president.", "In the United States, people can criticize leaders and still care about their country."], "SAY IT IN ONE LINE", "The Pledge shows loyalty to the ________ or the ________.", "USCIS Q66"], ["📜", "HOW DO PEOPLE BECOME CITIZENS?", "THE CITIZENSHIP CENTER", ["Some people become citizens at birth under U.S. law.", "Others become citizens through naturalization: a legal process with requirements.", "Some people get citizenship through a U.S.-citizen parent, under the rules set by law."], "GAME CONNECTION", "Help a new neighbor understand their citizenship process.", "USCIS Q68"], ["🤝", "WHAT IS THE CITIZENSHIP OATH?", "PROMISES TO THE UNITED STATES", ["New citizens take an Oath of Allegiance.", "They promise loyalty to the United States and to support and defend the Constitution and laws.", "The oath also includes promises to serve the country when required by law."], "TALK WITH A PARTNER", "Is promising to support the Constitution the same as agreeing with every law?", "USCIS Q67"], ["💰", "WHY DO WE PAY TAXES?", "PUBLIC SERVICES", ["Taxes help pay for government services.", "Examples: roads, public safety, and other programs.", "Paying federal taxes when required is a legal duty. Leaders debate how the money is spent."], "GAME CONNECTION", "Your town has only $100. Which service will you choose to fund?", "USCIS Q70–71"], ["🛡️", "HOW ELSE CAN PEOPLE SERVE?", "CIVIC DUTIES", ["People can serve by voting, obeying laws, serving in the military, or working in public service.", "Most men age 18–25 living in the U.S. must register with Selective Service.", "Registering does NOT mean there is a draft right now. It is required by law for those covered."], "IMPORTANT DIFFERENCE", "Serving your country can be voluntary. Some duties are required by law.", "USCIS Q70, Q72"], ["🌟", "YOU ARE READY TO EXPLORE", "REMEMBER THESE FACTS", ["Voting in federal elections: eligible U.S. citizens, age 18 and older.", "Everyone living in the U.S. has basic freedoms such as speech, religion, and peaceful assembly.", "Participate: contact officials, petition, vote. Duties: taxes and laws.", "Citizenship: birth, naturalization, or through parents when law allows."], "PLAY NEXT", "Walk with arrow keys or WASD. Stand near a building and press E.", "USCIS Q63–72"]];let i=0;const root=document.querySelector('#slide');function draw(){let s=deck[i];root.innerHTML=`<div class='top'><span class='pixel'>★ PIXEL TOWN ★</span><span class='act'>TEACHER BRIEFING · DAY 3</span></div><div class='head'><div class='sticker'>${s[0]}</div><div><h1>${s[1]}</h1><div class='sub'>${s[2]}</div></div></div><div class='body'><section class='lessons'>${s[3].map(p=>`<p>${p}</p>`).join('')}</section><aside class='side'><div class='label'>${s[4]}</div><div class='question'>${s[5]}</div><div class='source'>${s[6]}</div></aside></div>`;document.querySelector('#prev').disabled=i===0;document.querySelector('#next').textContent=i===deck.length-1?'PLAY PIXEL TOWN ↗':'NEXT →';document.querySelector('#progress').textContent=`${i+1} / ${deck.length}`}function step(d){if(i===deck.length-1&&d===1){window.open('Friday3_PIXEL_TOWN_Adventure.html','_blank');return}i=Math.max(0,Math.min(deck.length-1,i+d));draw()}document.querySelector('#prev').onclick=()=>step(-1);document.querySelector('#next').onclick=()=>step(1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)});draw();</script></body></html>
