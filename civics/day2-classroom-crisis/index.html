<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YOU ARE THE GOVERNMENT — Classroom Simulation</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,system-ui,sans-serif;color:#edf6ff;background:#091326}button{font:inherit;cursor:pointer}#app{max-width:1360px;margin:auto;min-height:100vh;padding:22px 30px 110px;background:radial-gradient(circle at 70% 0,#1b385d 0,#091326 65%)}header{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:2px solid #385472;padding-bottom:14px}.brand{font-size:18px;font-weight:1000;letter-spacing:.11em;color:#ffcd76}.tag{background:#264768;padding:10px 17px;border-radius:12px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:22px 0}.dept{background:#163453;border:2px solid #527aa1;border-radius:16px;padding:17px}.dept strong{font-size:21px;display:block;color:#ffd17b}.dept p{font-size:17px;line-height:1.25;font-weight:700}.dept.active{border-color:#ffda78;background:#274d71}h1{font-size:clamp(38px,5.8vw,87px);margin:15px 0;line-height:1.02;letter-spacing:-.045em}h2{font-size:clamp(25px,3vw,44px);margin:0 0 14px}.lead{font-size:clamp(21px,2.35vw,35px);font-weight:850;line-height:1.25;margin:15px 0 22px;max-width:1080px}.box{background:#142a46;border:2px solid #416a91;border-radius:18px;padding:23px;margin:18px 0}.eyebrow{font-weight:1000;color:#ffca6b;letter-spacing:.1em;font-size:17px}.instructions{font-size:clamp(20px,1.95vw,29px);line-height:1.3;font-weight:750;margin:10px 0}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:19px 0}.choice{padding:18px;background:#ecf4ff;color:#102f50;border:3px solid #86a7c6;border-radius:15px;text-align:left;font-weight:900;min-height:132px;font-size:clamp(19px,1.8vw,26px)}.choice small{font-size:17px;font-weight:650;display:block;margin-top:11px;line-height:1.3}.choice:hover{background:#ffe6b1}.choice.selected{background:#ffda80;border-color:#ff9c22}.action{background:#ffce70;color:#09294b;border:0;padding:15px 24px;border-radius:11px;font-size:20px;font-weight:1000}.secondary{background:#244466;border:2px solid #94b0cf;color:white}.row{display:flex;gap:15px;align-items:center;flex-wrap:wrap;margin:18px 0}.vote{display:grid;grid-template-columns:1fr 1fr;gap:16px}.vote button{padding:23px;background:#e1edfb;border:3px solid #82a5c7;color:#0c2c4d;font-size:clamp(22px,2.1vw,32px);border-radius:16px;font-weight:950}.vote button:hover{background:#ffe1a1}.note{border-left:10px solid #ffc875;padding:18px;background:#1c3c5a;font-size:clamp(20px,1.8vw,29px);font-weight:800;line-height:1.24;margin:18px 0}.meters{display:flex;gap:12px;flex-wrap:wrap}.metric{background:#17314f;border:1px solid #547aa1;border-radius:11px;padding:10px 15px;min-width:165px;font-size:15px;font-weight:900;color:#acc9e7}.metric b{display:block;color:#fff;font-size:25px}.bar{background:#0a192d;height:8px;border-radius:5px;overflow:hidden;margin-top:8px}.bar div{height:100%;background:#ffd078}.fixed{position:fixed;bottom:0;left:0;right:0;background:#030b17;border-top:2px solid #315372;padding:13px 3.5%;display:flex;justify-content:space-between;align-items:center;gap:12px}.fixed span{font-weight:900;color:#ffd07a}.muted{color:#bcd1e6}.news{display:inline-block;background:#b82141;color:white;padding:9px 17px;font-weight:1000;letter-spacing:.12em}.pill{display:inline-block;padding:9px 13px;background:#2c5876;border-radius:9px;font-weight:950}.two{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.breakdown{font-size:clamp(22px,2vw,31px);font-weight:800;line-height:1.35}.badge{font-weight:900;padding:8px 15px;background:#315877;border-radius:10px;display:inline-block}.headline{font-size:clamp(25px,3.5vw,48px);font-weight:1000;color:#ffe1a2}.footnote{font-size:16px;color:#bacfe3}.stepper{display:flex;gap:7px;margin-top:18px}.stepper div{height:9px;border-radius:5px;background:#36506d;flex:1}.stepper .done{background:#ffd176}@media(max-width:850px){.grid,.choices{grid-template-columns:1fr 1fr}.vote{grid-template-columns:1fr}#app{padding:15px 16px 100px}.dept p{display:none}}@media(max-width:550px){.grid,.choices,.two{grid-template-columns:1fr}.dept{padding:8px}.dept strong{font-size:17px}}</style></head><body><div id="app"></div><footer class="fixed"><button class="action secondary" id="restart">↻ START OVER</button><span id="progress">CLASS GOVERNMENT</span><button class="action" id="continue" hidden>NEXT →</button></footer><script>
"use strict";
const bills=[{"title":"STRICT STUDENT PRIVACY ACT","blurb":"Ban schools from selling student data. Require companies to report breaches quickly.","safety":12,"rights":8,"trust":8,"legal":1},{"title":"NATIONAL SCHOOL SECURITY ACT","blurb":"Let federal agencies scan school accounts for threats. This might catch attacks—but it raises privacy concerns.","safety":18,"rights":-15,"trust":-4,"legal":0},{"title":"LOCAL CONTROL PLAN","blurb":"Send grants to states so each state can write its own school data rules.","safety":7,"rights":5,"trust":3,"legal":1}];
let state={phase:0,bill:null,house:null,senate:null,compromise:null,president:null,override:null,court:null,ending:null,safety:50,rights:50,trust:50,history:[]};
const app=document.getElementById("app");const byId=id=>document.getElementById(id);const clamp=n=>Math.max(0,Math.min(100,n));
function note(t){return '<div class="note">'+t+'</div>'}
function button(text,act,val,cls='action'){return '<button class="'+cls+'" data-action="'+act+'"'+(val===undefined?'':' data-value="'+val+'"')+'>'+text+'</button>'}
function meter(title,value){return '<div class="metric">'+title+'<b>'+value+' / 100</b><div class="bar"><div style="width:'+value+'%"></div></div></div>'}
function sceneTop(title,desc,active){return '<header><span class="brand">CIVICS · DAY 2 | YOU ARE THE GOVERNMENT</span><span class="tag">ACT '+(state.phase+1)+' OF 7</span></header><div class="grid">'+[['HOUSE','Writes & votes on bills'],['SENATE','Debates & votes on bills'],['PRESIDENT','Signs or vetoes'],['COURT','Reviews the Constitution']].map((r,i)=>'<div class="dept '+(i===active?'active':'')+'"><strong>'+['🏛 ','🏛 ','🦅 ','⚖ '][i]+r[0]+'</strong><p>'+r[1]+'</p></div>').join('')+'</div><h1>'+title+'</h1><div class="lead">'+desc+'</div>'}
function footer(allow){byId('progress').textContent='GOVERNMENT SIMULATION · '+(state.phase+1)+'/7';byId('continue').hidden=!allow;byId('continue').textContent=state.phase===6?'PLAY AGAIN →':'NEXT SCENE →'}
function go(phase){state.phase=phase;render()}
function effect(s,r,t){state.safety=clamp(state.safety+s);state.rights=clamp(state.rights+r);state.trust=clamp(state.trust+t)}
function render(){let h='',can=false;let bill=state.bill===null?null:bills[state.bill];
if(state.phase===0){h=sceneTop('THE CLASS IS NOW CONGRESS','BREAKING NEWS: A massive school-data breach has put millions of students at risk. This room is the U.S. government. Your decisions become the story.',-1)+'<span class="news">THE COUNTRY NEEDS YOUR RESPONSE</span><div class="box"><h2>Assign your classmates to four groups</h2><div class="two"><div class="breakdown"><strong>HOUSE OF REPRESENTATIVES</strong><p>Debate and vote on a bill.</p></div><div class="breakdown"><strong>SENATE</strong><p>Revise or vote on the bill.</p></div><div class="breakdown"><strong>WHITE HOUSE</strong><p>Sign or veto the bill.</p></div><div class="breakdown"><strong>SUPREME COURT</strong><p>Hear a challenge and decide a case.</p></div></div>'+note('Everyone has a role. Only the group whose turn it is makes the final decision. The other groups can lobby them.')+'</div>';can=true;}
if(state.phase===1){h=sceneTop('HOUSE FLOOR: WRITE THE BILL','House members: Choose what your law will do. You get two minutes to argue for a plan. Other students can ask questions.',0)+'<div class="box"><span class="eyebrow">COMMITTEE PROPOSALS · SELECT ONE BILL</span><div class="choices">'+bills.map((b,i)=>button(b.title+'<small>'+b.blurb+'</small>','bill',i,'choice '+(state.bill===i?'selected':''))).join('')+'</div>'+(bill?note('THE HOUSE PROPOSES: '+bill.title+'. Now the House group must vote to pass or reject it.'):'')+(bill?'<div class="vote">'+button('HOUSE PASSES THE BILL','house','yes')+button('HOUSE REJECTS THE BILL','house','no')+'</div>':'')+(state.house!==null?note(state.house?'The bill PASSED the House.':'The House voted NO. The bill dies; the class will see a no-law outcome.'):'')+'</div>';can=state.house!==null;}
if(state.phase===2){h=sceneTop('SENATE: THE DEAL ROOM',state.house?'The bill passed the House. Senate members can demand changes, support it, or kill it.':'The House rejected the bill. Congress has no bill to send to the president.',1)+'<div class="box"><span class="eyebrow">BILL STATUS</span><h2>'+(bill?bill.title:'No bill')+'</h2><p class="lead">'+(bill?bill.blurb:'')+'</p>'+(state.house?'<div class="choices">'+button('PASS SAME BILL<small>Send identical bill to the president.</small>','senate','same','choice '+(state.senate==='same'?'selected':''))+button('DEMAND A PRIVACY LIMIT<small>The bill must also promise limits on collection of student data. House must agree.</small>','senate','change','choice '+(state.senate==='change'?'selected':''))+button('REJECT THE BILL<small>No federal law this round.</small>','senate','reject','choice '+(state.senate==='reject'?'selected':''))+'</div>':'')+(state.senate==='change'?'<h2>HOUSE: Accept the Senate change?</h2><div class="vote">'+button('HOUSE AGREES','compromise','yes')+button('HOUSE REFUSES','compromise','no')+'</div>':'')+((state.senate==='change'&&state.compromise!==null)?note(state.compromise?'Both chambers agree on revised wording.':'The chambers could not agree. The bill fails.'):'')+'</div>';can=state.house===false||(state.senate!==null&&(state.senate!=='change'||state.compromise!==null));}
if(state.phase===3){let law=state.house&&(state.senate==='same'||(state.senate==='change'&&state.compromise));h=sceneTop('THE WHITE HOUSE DECIDES',law?'The same bill cleared the House and Senate. The White House group now chooses to sign it or veto it.':'Congress failed to pass the same bill. The president cannot sign a bill that never passed Congress.',2)+'<div class="box"><span class="eyebrow">PRESIDENTIAL DESK</span><h2>'+ (bill?bill.title:'No bill')+'</h2>'+(law?'<div class="vote">'+button('SIGN THE BILL','president','sign')+button('VETO THE BILL','president','veto')+'</div>':'')+(state.president==='veto'?'<div class="box"><h2>CONGRESS: VETO OVERRIDE?</h2><p class="instructions">An override needs a two-thirds vote in BOTH chambers. The House and Senate teams must each decide whether they have enough support.</p><div class="vote">'+button('BOTH CHAMBERS REACH 2/3','override','yes')+button('OVERRIDE FAILS','override','no')+'</div></div>':'')+(state.president?note(state.president==='sign'?'The president signed the law.':state.override?'Congress overrode the veto. The bill becomes law.':'The president vetoed it. Congress may attempt an override.'):'')+'</div>';can=!law||state.president==='sign'||(state.president==='veto'&&state.override!==null);}
if(state.phase===4){let passed=lawPassed();h=sceneTop('THE SUPREME COURT HEARING',passed?'A family sues. They argue that the new federal privacy law is too broad and violates the Constitution. Justices must listen before they vote.':'There is no new law to challenge, but the justices still have a case about an executive data-search order.',3)+'<div class="box"><span class="eyebrow">COURTROOM · CONSTITUTIONAL CHALLENGE</span><div class="two"><div class="zone"><h3>ARGUMENT FOR THE POLICY</h3><p>Protecting students from cyberattacks is an important public goal.</p></div><div class="zone"><h3>ARGUMENT AGAINST THE POLICY</h3><p>Government cannot ignore privacy protections just because it wants to act faster.</p></div></div><p class="instructions">Court team: hear both sides. Discuss whether the government has exceeded its powers. Then give your ruling. This is a fictional simplified case; real cases depend on the exact law and facts.</p><div class="vote">'+button('UPHOLD THE POLICY','court','uphold')+button('STRIKE DOWN THE POLICY','court','strike')+'</div>'+(state.court!==null?note(state.court==='uphold'?'The court upholds the policy in this fictional case. It stays in effect.':'The court rules the policy unconstitutional in this fictional case. Government must change course.'):'')+'</div>';can=state.court!==null;}
if(state.phase===5){h=sceneTop('THE NATION REACTS','You have now exercised the actual powers of three branches. How will the public judge the choices your class made?',-1)+'<div class="box"><div class="meters">'+meter('PUBLIC TRUST',state.trust)+meter('STUDENT RIGHTS',state.rights)+meter('CYBER SAFETY',state.safety)+'</div><h2>WHAT REALLY HAPPENED?</h2><div class="breakdown">'+state.history.map(x=>'<p>• '+x+'</p>').join('')+'</div>'+note('Congress writes laws. The president enforces laws and signs or vetoes bills. Courts resolve cases and review constitutionality.')+'</div>';can=true;}
if(state.phase===6){let outcome=state.trust>=62&&state.rights>=50?'THE REPUBLIC HOLDS':state.trust<40?'PUBLIC TRUST COLLAPSES':'THE COUNTRY IS DIVIDED';h=sceneTop(outcome,'Your class has finished one term of government. Could a different set of decisions produce a better outcome?',-1)+'<div class="box"><div class="meters">'+meter('PUBLIC TRUST',state.trust)+meter('STUDENT RIGHTS',state.rights)+meter('CYBER SAFETY',state.safety)+'</div>'+note('In iCivics Branches of Power, you will manage the branches again as an individual player. Remember what happens when they disagree.')+'<a href="https://ed.icivics.org/games/branches-power" target="_blank" rel="noopener">'+button('OPEN BRANCHES OF POWER ↗','ignore')+'</a></div>';can=true;}
app.innerHTML=h;footer(can)}
function lawPassed(){return !!(state.house&&(state.senate==='same'||(state.senate==='change'&&state.compromise))&&(state.president==='sign'||state.override===true))}
function choose(action,v){if(action==='bill'){state.bill=Number(v);state.house=null;return render()}if(action==='house'){state.house=v==='yes';state.history.push('House '+(state.house?'passed':'rejected')+' '+bills[state.bill].title+'.');if(!state.house)effect(-10,0,-7);return render()}if(action==='senate'){state.senate=v;state.compromise=null;if(v==='same'){state.history.push('Senate passed identical text.')}if(v==='reject'){state.history.push('Senate rejected the bill.');effect(-8,0,-7)}return render()}if(action==='compromise'){state.compromise=v==='yes';state.history.push(state.compromise?'House approved Senate amendment.':'House refused Senate amendment.');if(state.compromise)effect(1,7,3);else effect(-6,0,-8);return render()}if(action==='president'){state.president=v;state.override=null;state.history.push('President '+(v==='sign'?'signed':'vetoed')+' the bill.');if(v==='sign'){let b=bills[state.bill];effect(b.safety,b.rights,b.trust)}return render()}if(action==='override'){state.override=v==='yes';state.history.push(state.override?'Congress overrode the veto with two-thirds in each chamber.':'Congress failed to override the veto.');if(state.override){let b=bills[state.bill];effect(b.safety,b.rights,b.trust+3)}else effect(-5,0,-6);return render()}if(action==='court'){state.court=v;state.history.push('Court '+(v==='uphold'?'upheld':'struck down')+' the challenged policy.');if(v==='uphold')effect(2,-3,2);else effect(-8,10,-3);return render()}}
function next(){if(state.phase===6){state={phase:0,bill:null,house:null,senate:null,compromise:null,president:null,override:null,court:null,ending:null,safety:50,rights:50,trust:50,history:[]};render();return}if(state.phase===0)state.phase=1;else if(state.phase===1&&state.house!==null)state.phase=2;else if(state.phase===2&&(state.house===false||state.senate==='reject'||state.senate==='same'||(state.senate==='change'&&state.compromise!==null)))state.phase=3;else if(state.phase===3){state.phase=4}else if(state.phase===4&&state.court!==null)state.phase=5;else if(state.phase===5)state.phase=6;render()}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='restart'){state={phase:0,bill:null,house:null,senate:null,compromise:null,president:null,override:null,court:null,ending:null,safety:50,rights:50,trust:50,history:[]};render()}else if(a==='next')next();else if(a!=='ignore')choose(a,b.dataset.value)});render();
</script></body></html>
