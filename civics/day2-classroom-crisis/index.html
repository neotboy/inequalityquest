<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Can You Run the Government? Day 2</title><style>
*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#071b31;color:white}main{min-height:100vh;max-width:1500px;margin:auto;padding:3vh 4vw 10vh;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center;gap:18px}.label{font-size:clamp(17px,1.5vw,25px);font-weight:1000;letter-spacing:.09em;color:#f6ce7e}.score{background:#204264;border:2px solid #54789b;padding:12px 20px;border-radius:12px;font-size:19px;font-weight:900}.meter{height:13px;border-radius:9px;background:#24445f;overflow:hidden;margin:17px 0 28px}.meter>div{height:100%;background:#f6c367;transition:width .3s}h1{font-size:clamp(40px,4.2vw,75px);line-height:1.04;margin:0 0 15px;text-transform:uppercase}h2{font-size:clamp(33px,3vw,56px);line-height:1.13;margin:0 0 20px}.desc{font-size:clamp(25px,2.5vw,40px);line-height:1.22;font-weight:800;max-width:1050px}.stage{display:grid;grid-template-columns:1fr minmax(210px,27%);gap:3vw;flex:1;align-items:center}.art{background:linear-gradient(135deg,#254e77,#102f52);border:3px solid #b58d52;min-height:260px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:clamp(100px,12vw,220px)}.choices{display:flex;gap:16px;flex-wrap:wrap;margin:30px 0}.choices button{background:#e5f0ff;color:#092a4a;font-size:clamp(20px,1.85vw,31px);font-weight:950;border:4px solid #9ebad7;border-radius:13px;padding:22px;flex:1 1 220px;min-height:110px;cursor:pointer}.choices button:hover{background:#ffe5ab}.choices button:disabled{opacity:.75}.choices button.right{background:#78e5b0;border-color:#2eaa76}.choices button.wrong{background:#f9a4a4;border-color:#d94d4d}.result{background:#142f4b;border-left:12px solid #f6c367;padding:25px;border-radius:0 12px 12px 0}.result strong{font-size:clamp(27px,2.8vw,47px);display:block;margin-bottom:12px}.result p{font-size:clamp(22px,2.25vw,37px);line-height:1.22;font-weight:850;margin:9px 0}.sub{color:#d9eaff}.controls{position:fixed;bottom:0;left:0;right:0;background:#030c17;display:flex;gap:12px;justify-content:space-between;align-items:center;padding:13px 4vw}.controls button,.action{border:0;border-radius:8px;padding:13px 22px;font-size:19px;font-weight:950;cursor:pointer;background:#f5c86f;color:#0b2343}.controls .reset{background:#203b58;color:white;border:1px solid #7690b1}.start{max-width:950px;margin:auto;text-align:center}.start p{font-size:clamp(25px,2.6vw,39px);line-height:1.3}.start .action{font-size:27px;padding:19px 40px}.end{margin:auto;max-width:1000px;text-align:center}.end p{font-size:clamp(25px,2.5vw,40px)}@media(max-width:800px){.stage{grid-template-columns:1fr}.art{display:none}.controls button{font-size:15px;padding:10px}.choices button{min-height:80px}}</style></head><body><main id="app"></main><script>const rounds=[["THE PRESIDENT'S PLAN","The president wants a new law requiring every school to teach a course about internet scams.","Who can actually WRITE and PASS the national law?",["The President","Congress","The Supreme Court"],1,"CONGRESS makes federal laws. The president can propose ideas and ask Congress to act.","Congress debates and votes. The president cannot create every law alone.","🏛️"],["TWO CHAMBERS","The bill reaches Congress. The House supports it, but the Senate has not voted.","What must happen next?",["The Senate must also pass it","The president can skip the Senate","A federal judge writes the rest"],0,"BOTH the House and Senate must pass the same bill before it goes to the president.","435 voting House members serve 2-year terms. The Senate has 100 members serving 6-year terms.","🏛️"],["IOWA VOTERS","Someone says: 'A U.S. senator represents just one neighborhood in Iowa.'","Which correction is right?",["A senator represents one district","A senator represents the entire state","A senator represents only the president"],1,"Every state has TWO U.S. senators. They represent the entire state.","House members represent districts. Iowa has four U.S. House districts.","🗳️"],["THE BILL ARRIVES","Congress passes the internet-scam bill. The president thinks it goes too far.","What is one constitutional option?",["Veto the bill","Fire Congress","Order the courts to change the bill"],0,"The president can SIGN a bill into law or VETO it.","A veto can be overridden by a two-thirds vote in BOTH houses of Congress.","🖋️"],["THE VETO BATTLE","The president vetoes the bill. Congress still strongly supports it.","Can Congress do anything?",["No—president always wins","Yes—override by two-thirds in both chambers","Yes—the Supreme Court votes on the bill"],1,"Congress can OVERRIDE a veto with a two-thirds vote in each chamber.","This is a CHECK on the president's power.","⚡"],["WHO RUNS FEDERAL AGENCIES?","A new law takes effect. Federal agencies need to carry it out.","Which branch is responsible for ENFORCING federal laws?",["Legislative","Executive","Judicial"],1,"The EXECUTIVE branch carries out and enforces federal laws.","The president leads this branch. Cabinet leaders help run major departments.","🦅"],["THE CABINET CALL","The president wants advice about military decisions and public schools.","What is the Cabinet?",["The president's department leaders and advisers","100 elected senators","Nine Supreme Court justices"],0,"The CABINET is a group of top executive department leaders who advise the president.","For example: the Secretaries of Defense, Education, and State.","📂"],["A LAWSUIT HITS","Someone sues, saying the new law breaks the Constitution.","Which branch can review the case?",["Legislative","Executive","Judicial"],2,"The JUDICIAL branch interprets the law and resolves legal cases.","Federal district courts are trial courts; appeals courts review lower-court decisions.","⚖️"],["THE FINAL COURT","The losing side appeals through the court system. The Supreme Court agrees to hear the case.","What is special about the Supreme Court?",["It writes most federal laws","It is the highest court in the United States","It commands the military"],1,"The SUPREME COURT is the highest federal court.","It has NINE justices. The president nominates justices; the Senate confirms them.","👩‍⚖️"],["JUDICIAL REVIEW","The Supreme Court decides the law violates the Constitution.","What power did it use?",["Judicial review","Veto power","Declaring war"],0,"JUDICIAL REVIEW allows courts to decide whether laws or government actions conflict with the Constitution.","This is a CHECK on Congress and the president.","📜"],["POWER GRAB","The president says: 'From now on I can make laws, approve judges, and overrule any court.'","What stops this?",["Separation of powers and checks and balances","The Cabinet choosing a new president","A direct vote on every law"],0,"SEPARATION OF POWERS gives each branch its own jobs.","CHECKS AND BALANCES lets branches limit each other, so no one branch controls everything.","🔐"],["THE BIG TEST","A bill passes both chambers. The president signs it. A court later hears a constitutional challenge.","Which sequence is correct?",["Congress → President → Courts","Courts → President → Congress","President → Courts → Congress"],0,"CONGRESS PASSES → PRESIDENT SIGNS OR VETOES → COURTS CAN REVIEW.","That is the core sequence students will practice in iCivics' Branches of Power.","🏆"]];let i=-1,selected=null,points=0;function show(){let p=document.getElementById('app');if(i===-1){p.innerHTML='<div class="start"><div class="label">FRIDAY 2 · CLASSROOM WARM-UP</div><h1>CAN YOU RUN THE GOVERNMENT?</h1><p>A crisis is spreading across Washington. Your class controls Congress, the White House, and the courts. Vote on each decision. Then find out what the Constitution actually allows.</p><p><b>12 class votes · 15–20 minutes · No student accounts</b></p><button class="action" onclick="i=0;show()">START THE CRISIS →</button></div>';return}if(i>=rounds.length){p.innerHTML='<div class="end"><div class="label">GOVERNMENT RESTORED</div><h1>YOU SURVIVED THE CRISIS!</h1><p>Your class scored <b>'+points+' / '+rounds.length+'</b> on the first vote.</p><p><b>Now run all three branches yourself in iCivics Branches of Power.</b></p><a href="https://ed.icivics.org/games/branches-power" target="_blank" rel="noopener"><button class="action">PLAY BRANCHES OF POWER ↗</button></a></div>';return}let r=rounds[i];p.innerHTML='<div class="top"><span class="label">GOVERNMENT CRISIS · '+(i+1)+' / '+rounds.length+'</span><span class="score">CLASS SCORE '+points+'</span></div><div class="meter"><div style="width:'+((i+1)/rounds.length*100)+'%"></div></div><h1>'+r[0]+'</h1><div class="stage"><div><h2>'+r[1]+'</h2><p class="desc">'+r[2]+'</p></div><div class="art" aria-hidden="true">'+r[7]+'</div></div><div id="out"></div><div class="controls"><button class="reset" onclick="restart()">↻ RESTART</button><span class="label">VOTE AS A CLASS — THEN REVEAL</span><button id="next" onclick="next()" style="display:none">NEXT CRISIS →</button></div>';let q=document.createElement('div');q.className='choices';r[3].forEach((opt,j)=>{let b=document.createElement('button');b.textContent=String.fromCharCode(65+j)+'. '+opt;b.onclick=()=>vote(j);q.appendChild(b)});document.getElementById('out').appendChild(q)}
function vote(j){if(selected!==null)return;let r=rounds[i];selected=j;if(j===r[4])points++;let bs=[...document.querySelectorAll('.choices button')];bs.forEach((b,k)=>{b.disabled=true;b.classList.add(k===r[4]?'right':k===j?'wrong':'')});document.getElementById('out').insertAdjacentHTML('beforeend','<div class="result"><strong>'+(j===r[4]?'✓ THE CLASS GOT IT':'THE CONSTITUTION SAYS…')+'</strong><p>'+r[5]+'</p><p class="sub">'+r[6]+'</p></div>');document.getElementById('next').style.display='block'}
function next(){i++;selected=null;show()}function restart(){i=-1;selected=null;points=0;show()}document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&selected!==null){next()}if(['1','2','3'].includes(e.key)&&i>=0&&i<rounds.length)vote(Number(e.key)-1)});show();</script></body></html>
