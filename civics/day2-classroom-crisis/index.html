<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAPITOL UNDER PRESSURE — Day 2 Civics</title><style>
*{box-sizing:border-box}body{margin:0;background:#070e1d;color:#edf6ff;font-family:Arial,system-ui,sans-serif}.app{max-width:1480px;min-height:100vh;margin:auto;padding:24px 34px 90px;background:radial-gradient(circle at 95% 0%,#1b3556,transparent 55%)}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.logo{color:#f4c86b;font-size:19px;font-weight:1000;letter-spacing:.12em}.meter{display:flex;gap:12px}.metric{min-width:150px;background:#152c48;border:1px solid #4e6d90;border-radius:11px;padding:10px 15px}.metric b{font-size:24px;display:block}.metric small{font-size:13px;color:#a5c7e4;text-transform:uppercase;font-weight:900}.bar{height:8px;background:#081421;border-radius:6px;margin-top:7px;overflow:hidden}.bar>div{height:100%;background:#f1c56a}.alert{margin:24px 0 10px;background:#cc3544;color:white;font-size:clamp(16px,1.5vw,22px);font-weight:1000;display:inline-block;padding:10px 20px;letter-spacing:.07em}.headline{font-size:clamp(38px,5.2vw,79px);line-height:1.02;letter-spacing:-.05em;font-weight:1000;margin:0 0 16px}.breaking{font-size:clamp(23px,2.35vw,38px);line-height:1.2;font-weight:850;max-width:1100px}.panel{background:#132641;border:1px solid #426487;border-radius:18px;padding:24px;margin:23px 0}.label{font-size:15px;color:#f4c86b;font-weight:1000;letter-spacing:.08em}.intel{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.intel div{font-size:clamp(17px,1.55vw,23px);font-weight:800;line-height:1.25;padding:16px;background:#1b3c60;border-radius:9px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.choice{border:2px solid #6b92b8;border-radius:14px;background:#edf4ff;color:#0a294b;padding:19px;text-align:left;font-size:clamp(19px,1.9vw,30px);line-height:1.2;font-weight:950;cursor:pointer;min-height:135px}.choice:hover{background:#ffdf9f;transform:translateY(-2px)}.choice:disabled{opacity:.65;cursor:default}.choice.chosen{outline:6px solid #ffd27a;opacity:1}.outcome{border-left:12px solid #f5c66d;background:#162f4d;border-radius:0 12px 12px 0;padding:22px;margin:20px 0}.outcome h2{font-size:clamp(28px,3vw,44px);margin:0 0 12px}.outcome p{font-size:clamp(21px,2vw,31px);line-height:1.25;font-weight:750}.delta{display:flex;gap:12px;flex-wrap:wrap;font-weight:900;font-size:20px}.delta span{padding:9px 14px;background:#244967;border-radius:8px}.btn{padding:15px 23px;background:#ffce72;border:0;border-radius:9px;color:#112945;font-size:20px;font-weight:1000;cursor:pointer}.ghost{padding:12px 18px;border:1px solid #7594b5;border-radius:9px;background:#1d3956;color:white;font-size:17px;font-weight:850;cursor:pointer}.bottom{position:fixed;bottom:0;left:0;right:0;background:#030914;border-top:2px solid #28476d;padding:10px 3%;display:flex;justify-content:space-between;align-items:center;gap:15px}.start{max-width:1050px;margin:6vh auto}.start h1{font-size:clamp(48px,7vw,105px);line-height:.99;margin:20px 0}.start p{font-size:clamp(23px,2.4vw,37px);line-height:1.35}.scene{animation:fade .3s}@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}@media(max-width:850px){.choices,.intel{grid-template-columns:1fr}.top{align-items:flex-start}.meter{flex-wrap:wrap}.metric{min-width:100px}.app{padding:15px 14px 90px}.choice{min-height:75px}}
</style></head><body><div id="app" class="app"></div><div class="bottom"><button class="ghost" onclick="reset()">↻ NEW CLASS GAME</button><b id="status">LIVE CRISIS SIMULATION</b><button class="btn" id="next" style="display:none" onclick="forward()">NEXT BREAKING STORY →</button></div><script>
const scenes=[{"head":"LEAKED: THE NATIONAL DATA BREACH","news":"Millions of student records were exposed. Parents demand action by tonight.","roles":["Congress wants a national privacy law.","The president promises immediate action.","A judge warns that rights still matter."],"choices":[["Order a new law yourself","executive",[-12,12,-16],"The president cannot simply write a new federal law. Congress writes laws; the executive enforces them."],["Ask Congress to pass a privacy bill","legislative",[8,-5,11],"Congress can debate a bill. The president may propose ideas and urge action."],["Tell judges to shut the websites","judicial",[-8,-3,-12],"Courts decide cases; they are not the president's personal enforcement team."]]},{"head":"CONGRESS IS AT WAR WITH ITSELF","news":"The House passes the privacy bill. The Senate threatens to bury it.","roles":["The House has 435 voting members.","The Senate has 100 members.","Both chambers must pass the same text."],"choices":[["Send the House bill straight to the president","legislative",[-7,8,-10],"Both chambers must approve the same bill first."],["Negotiate changes with senators","legislative",[8,-7,9],"Good. Both the House and Senate must pass identical legislation."],["Replace senators by presidential order","executive",[-12,5,-18],"Senators are elected statewide to six-year terms. The president cannot fire them."]]},{"head":"THE PRESIDENT'S ULTIMATUM","news":"The revised bill passes both chambers. The president threatens a veto.","roles":["A bill reaches the president.","The president can sign or veto.","Congress has a possible override."],"choices":[["Sign the bill with an implementation plan","executive",[10,-7,9],"The executive branch can sign and then carry out federal law through agencies."],["Veto it and explain why","executive",[-2,5,6],"A veto is a real presidential power. Congress could override with two-thirds in each chamber."],["Tell the Supreme Court to sign it instead","judicial",[-10,9,-14],"The Supreme Court does not sign bills. The president signs or vetoes."]]},{"head":"BREAKING: AN UNPOPULAR APPOINTMENT","news":"The president picks a controversial person to lead a federal department.","roles":["Cabinet secretaries run executive departments.","The president nominates many top officials.","The Senate votes on confirmation."],"choices":[["Let the Senate hold a confirmation vote","legislative",[5,-5,10],"The Senate confirms many presidential nominations—a check on executive power."],["Let the nominee serve without any Senate role","executive",[-5,9,-10],"Many appointments need Senate confirmation; there are limited exceptions."],["Ask the House to choose the entire Cabinet","legislative",[-8,4,-9],"The president chooses nominees; the Senate confirms many of them."]]},{"head":"THE COURT BLOCKS THE POLICY","news":"A federal court rules part of the privacy law violates the Constitution.","roles":["A federal district court can hear a case.","Appeals courts review lower-court decisions.","The Supreme Court is the highest U.S. court."],"choices":[["Respect the ruling and appeal through the courts","judicial",[6,-7,12],"Courts interpret federal laws. Appeals are a lawful way to challenge rulings."],["Send agents to arrest the judge","executive",[-15,12,-20],"Judges cannot be arrested simply because the president dislikes a ruling."],["Declare courts have no power over laws","legislative",[-11,8,-18],"Judicial review lets courts decide whether laws violate the Constitution."]]},{"head":"SECRET FILE: CONGRESS INVESTIGATES","news":"Reporters reveal that officials may have hidden evidence about the privacy program.","roles":["Congress oversees the executive branch.","The House may impeach federal officials.","The Senate holds impeachment trials."],"choices":[["Hold oversight hearings and demand testimony","legislative",[7,-6,12],"Congress can investigate executive actions as part of its oversight powers."],["Give the president power to cancel investigations","executive",[-11,10,-18],"The president cannot simply erase Congress's constitutional oversight role."],["Make the Supreme Court impeach the president","judicial",[-6,4,-11],"The House impeaches; the Senate tries impeachments. Courts do not carry out impeachment."]]},{"head":"NATIONWIDE PROTESTS","news":"Students and parents gather peacefully outside the Capitol. Some demand the law be repealed.","roles":["People can criticize government.","Peaceful assembly is protected.","Lawmakers still must follow constitutional steps."],"choices":[["Hear public testimony and consider a new bill","legislative",[10,-5,11],"Congress may amend or repeal laws. Listening to voters is an important part of representation."],["Ban every protest against the bill","executive",[-16,7,-20],"The First Amendment protects peaceful speech and assembly, subject to lawful limits."],["Have federal judges write a replacement law","judicial",[-8,5,-11],"Courts interpret laws; Congress writes federal laws."]]},{"head":"THE FINAL EMERGENCY","news":"Your advisers offer one last plan. The country is watching—and history will remember your decision.","roles":["Congress writes and passes laws.","The president enforces them.","Courts interpret them and review constitutional challenges."],"choices":[["Let one branch take full control to move faster","executive",[-14,14,-25],"Separation of powers exists so no single branch controls everything."],["Use all three branches within their own powers","legislative",[12,-8,17],"That is checks and balances: branches have separate jobs and can limit each other."],["Cancel elections until everyone agrees","executive",[-18,10,-25],"Leaders cannot discard constitutional elections just because governing is difficult."]]}];let state={step:-1,trust:65,crisis:35,balance:65,history:[],choice:null};const $=id=>document.getElementById(id);const clamp=n=>Math.max(0,Math.min(100,n));function meter(name,n){return '<div class="metric"><small>'+name+'</small><b>'+n+'%</b><div class="bar"><div style="width:'+n+'%;background:'+(n<30?'#ec5c6f':n>70?'#61ddb6':'#f1c56a')+'"></div></div></div>'}
function begin(){state.step=0;draw()}function reset(){if(state.step>=0&&!confirm('Restart the whole class simulation?'))return;state={step:-1,trust:65,crisis:35,balance:65,history:[],choice:null};draw()}
function forward(){state.step++;state.choice=null;draw()}function decide(n){if(state.choice!==null)return;const c=scenes[state.step].choices[n];state.choice=n;state.trust=clamp(state.trust+c[2][0]);state.crisis=clamp(state.crisis+c[2][1]);state.balance=clamp(state.balance+c[2][2]);state.history.push({scene:state.step,option:n});draw()}
function start(){return '<div class="start"><span class="alert">LIVE FROM WASHINGTON, D.C.</span><h1>CAPITOL<br>UNDER PRESSURE</h1><p>You've been called to Washington during a national emergency. Your class is the emergency council advising Congress, the president, and the courts.</p><p>Every choice changes <b>PUBLIC TRUST</b>, <b>CRISIS LEVEL</b>, and <b>CONSTITUTIONAL BALANCE</b>. Bad choices have consequences—and the story remembers.</p><button class="btn" onclick="begin()">ENTER THE CRISIS ROOM →</button></div>'}
function ending(){const good=state.balance>=60&&state.trust>=45,mid=state.balance>=35;let name=good?'THE REPUBLIC HOLDS':mid?'GOVERNMENT UNDER STRAIN':'CONSTITUTIONAL BREAKDOWN';let msg=good?'Your class protected constitutional checks while tackling the crisis.':mid?'Some rules survived, but public confidence and the balance of power were shaken.':'Power was concentrated and trust collapsed. Can your class govern differently next time?';return '<div class="start"><span class="alert">FINAL NATIONAL REPORT</span><h1>'+name+'</h1><p>'+msg+'</p><div class="meter">'+meter('PUBLIC TRUST',state.trust)+meter('CRISIS LEVEL',state.crisis)+meter('BALANCE OF POWER',state.balance)+'</div><p>Now apply the same three-branch decisions in iCivics <b>Branches of Power</b>.</p><a href="https://ed.icivics.org/games/branches-power" target="_blank" rel="noopener"><button class="btn">OPEN iCIVICS GAME ↗</button></a> <button class="ghost" onclick="reset()">TRY A DIFFERENT ENDING</button></div>'}
function draw(){ $('next').style.display='none';$('status').textContent=state.step<0?'TEACHER-LED CLASSROOM GAME':state.step>=scenes.length?'FINAL REPORT':'EPISODE '+(state.step+1)+' / '+scenes.length;if(state.step<0){$('app').innerHTML=start();return}if(state.step>=scenes.length){$('app').innerHTML=ending();return}let s=scenes[state.step],pick=state.choice,ans=pick!==null?s.choices[pick]:null;let head='<div class="top"><div class="logo">CIVICS · DAY 2<br>CRISIS CONTROL</div><div class="meter">'+meter('PUBLIC TRUST',state.trust)+meter('CRISIS LEVEL',state.crisis)+meter('BALANCE OF POWER',state.balance)+'</div></div>';let body='<div class="scene"><span class="alert">BREAKING NEWS · EPISODE '+(state.step+1)+'</span><h1 class="headline">'+s.head+'</h1><div class="breaking">'+s.news+'</div><div class="panel"><div class="label">TOP SECRET · WHAT YOUR ADVISERS KNOW</div><div class="intel">'+s.roles.map(x=>'<div>'+x+'</div>').join('')+'</div></div><div class="label" style="margin:20px 0 12px">CLASS VOTE · CHOOSE THE GOVERNMENT RESPONSE</div><div class="choices">'+s.choices.map((c,i)=>'<button class="choice '+(pick===i?'chosen':'')+'" '+(pick!==null?'disabled':'')+' onclick="decide('+i+')"><span style="color:#a77018">OPTION '+String.fromCharCode(65+i)+'</span><br>'+c[0]+'</button>').join('')+'</div>'+(ans?'<div class="outcome"><h2>'+(ans[2][2]>0?'THE SYSTEM HOLDS':'CONSTITUTIONAL WARNING')+'</h2><p>'+ans[3]+'</p><div class="delta"><span>TRUST '+(ans[2][0]>0?'+':'')+ans[2][0]+'</span><span>CRISIS '+(ans[2][1]>0?'+':'')+ans[2][1]+'</span><span>BALANCE '+(ans[2][2]>0?'+':'')+ans[2][2]+'</span></div></div>':'')+'</div>';$('app').innerHTML=head+body;if(ans)$('next').style.display='block'}
document.addEventListener('keydown',e=>{if(state.step>=0&&state.step<scenes.length){if(['1','2','3'].includes(e.key))decide(Number(e.key)-1);if(e.key==='ArrowRight'&&state.choice!==null)forward()}});draw();
</script></body></html>
