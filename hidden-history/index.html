<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HIDDEN HISTORY // Case Files</title><style>
:root{--bg:#0b1020;--panel:#151d31;--panel2:#1d2940;--line:#33445d;--text:#eef3ff;--muted:#aabbd2;--cyan:#76e1de;--gold:#f2c577;--pink:#f4a6bc;--good:#7ee2ac}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#20314a 0,#0b1020 70%);color:var(--text);font:16px/1.46 system-ui,Segoe UI,Arial,sans-serif}header{padding:18px max(20px,calc((100vw - 1120px)/2));border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:15px;background:#0e1627bd}.logo{letter-spacing:.17em;font-size:13px;font-weight:900;color:var(--cyan)}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(29px,5vw,53px);line-height:1.07;margin-bottom:14px}h2{font-size:clamp(24px,3.8vw,36px)}h3{font-size:19px}main{max-width:1120px;margin:auto;padding:25px 20px 100px}.tag{display:inline-block;border:1px solid #63829d;border-radius:20px;padding:4px 11px;color:var(--cyan);text-transform:uppercase;letter-spacing:.09em;font-weight:800;font-size:11px;margin-bottom:15px}.small{font-size:13px;color:var(--muted)}.muted{color:var(--muted)}.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:30px;align-items:center;margin:25px 0 32px}.panel{background:#151e31ee;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 15px 36px #02061128}.visual{background:linear-gradient(135deg,#263954,#141e30);min-height:270px;display:grid;place-items:center;position:relative;overflow:hidden}.stamp{font-size:clamp(42px,9vw,82px);font-weight:950;line-height:1;color:#ffffff12;transform:rotate(-13deg);position:absolute;white-space:nowrap}.folder{font-size:85px;filter:drop-shadow(0 10px 16px #0009)}button{cursor:pointer;font:inherit}button.primary{background:var(--cyan);color:#0b1725;border:0;padding:13px 19px;border-radius:9px;font-weight:850}button.secondary{background:var(--panel2);color:var(--text);border:1px solid #52657e;padding:11px 15px;border-radius:9px;font-weight:750}button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}button:disabled{cursor:not-allowed;opacity:.46}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.casecard{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px;color:var(--text);min-height:155px;display:flex;flex-direction:column;gap:8px}.casecard:hover,.casecard.active{border-color:var(--cyan)}.casecard.done{border-color:#356f63}.casecard .num{font-weight:900;color:var(--gold);font-size:12px}.casecard strong{font-size:16px}.casecard .small{margin-top:auto}.clock{font-variant-numeric:tabular-nums;font-weight:900;color:var(--gold);font-size:22px}.progress{height:7px;border-radius:8px;background:#24314b;overflow:hidden;margin:14px 0}.progress>div{height:100%;background:var(--cyan);transition:width .2s}.split{display:grid;grid-template-columns:minmax(260px, 40%) 1fr;gap:20px}.photo{border-radius:12px;overflow:hidden;background:#0b1424;border:1px solid var(--line)}.photo img{display:block;width:100%;height:300px;object-fit:cover;filter:grayscale(.8)}.photo .fallback{display:none;padding:45px 15px;text-align:center;color:var(--muted)}.photo figcaption{background:#111c2c;font-size:12px;color:var(--muted);padding:10px 12px}.evidence{background:#202f46;border:1px solid #496079;border-radius:9px;padding:12px;margin:8px 0}.evidence strong{color:var(--gold)}.puzzle{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:18px;margin-top:15px}.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}.chip{padding:12px 14px;background:#273750;border:1px solid #61758c;color:var(--text);border-radius:10px;font-weight:700;text-align:left}.chip:hover{border-color:var(--gold)}.chip.selected{background:#375b65;border-color:var(--cyan)}.chip.correct{border-color:var(--good);background:#194b43}.chip.bad{border-color:var(--pink)}.bins{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:15px}.bin{border:2px dashed #4f6178;border-radius:12px;min-height:100px;padding:13px;background:#0f1b2b}.bin strong{display:block;color:var(--cyan);margin-bottom:10px}.bin .chip{width:100%;margin:4px 0}.feedback{padding:12px 14px;border-radius:9px;background:#20314b;border-left:4px solid var(--gold);margin-top:14px}.reveal{border:1px solid #4d7e72;background:linear-gradient(135deg,#193e3b,#182739);border-radius:15px;padding:21px;margin-top:20px}.reveal h2{color:var(--good)}.source{color:var(--cyan)}.steps{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.step{border:1px solid #506981;border-radius:8px;padding:8px 10px;color:#dce6f3;background:#19283d}.timerbar{width:130px;height:6px;background:#26334a;border-radius:20px;overflow:hidden}.timerbar span{height:100%;background:var(--gold);display:block}.game-over{max-width:750px;margin:auto;text-align:center}.foot{border-top:1px solid var(--line);padding-top:20px;margin-top:35px;color:var(--muted);font-size:12px}a{color:var(--cyan)}@media(max-width:760px){.hero,.split{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.visual{min-height:150px}.photo img{height:240px}header{padding:12px 16px}.bins{grid-template-columns:1fr}}

const data=[
{id:'ryan',title:'The Classroom That Became a Telephone',year:'1985',category:'Health stigma + school inequality',icon:'☎',image:'https://img.lb.wbmdstatic.com/vim/live/webmd/consumer_assets/site_images/articles/health_tools/AIDS_retrospective_slideshow/1800ss_getty_rm_ryan_white_in_class.jpg?output-quality=100&resize=728px%3A%2A',credit:'Photograph of Ryan White in school (later in the story), WebMD/Getty Images',source:'https://ryanwhite.hrsa.gov/about/ryan-white',scene:'A seventh grader is forced to take classes over the phone from his bedroom. Investigate why.',clues:['A school superintendent barred the student from attending in person.','State health officials said he could safely return with appropriate guidance.','Other students attended class together in the school building.'],mode:'compare',prompt:'Select the TWO pieces of evidence that prove institutional inequality—not just that someone was sick.',opts:['He had a serious medical condition.','School officials barred him from in-person class.','Other children continued attending class in person.','A telephone had been invented.'],correct:[1,2],reveal:'Ryan White contracted HIV through treatment for hemophilia. Fear and AIDS stigma led his school to exclude him, even though health officials supported his return. He initially attended lessons through a phone connection. The inequality was unequal access to school, not the illness itself.',connection:'Institution: public school • Barrier: exclusion based on health status • Lost opportunity: equal participation in education.'},
{id:'lavender',title:'The Secret File on a Federal Employee',year:'1950s–1960s',category:'LGBTQ + jobs + economic security',icon:'▣',image:'https://www.advocate.com/media-library/u200bamerican-gay-rights-activists-jack-nichols-followed-by-frank-kameny-and-lilli-vincenz-protesting-with-others-outside-the-w.jpg?id=60214636&width=980',credit:'1965 gay-rights demonstration, via The Advocate',source:'https://www.archives.gov/milestone-documents/executive-order-10450',scene:'A federal worker is investigated. Their job reviews are not the issue. Search the employment file.',clues:['Officials treated homosexuality as a security concern.','Workers could be investigated or dismissed because of private relationships.','Losing a federal position could mean losing wages and a career.'],mode:'sequence',prompt:'Arrange the chain from policy to life outcome. Select each tile in the right order.',opts:['Income and career opportunities disappear','A policy treats homosexuality as a security risk','Workers face investigation or dismissal','A qualified worker is judged by private identity'],correct:[1,3,2,0],reveal:'During the Lavender Scare, federal policies and investigations cost LGBTQ workers their jobs and careers. Their identity, not simply their ability to perform a job, became a barrier to employment.',connection:'Institution: federal government • Barrier: discriminatory employment policy • Lost opportunity: jobs, income, security.'},
{id:'warren',title:'The Place Chosen for Toxic Waste',year:'1982',category:'Race + class + environmental health',icon:'⚠',image:'https://miro.medium.com/1%2AvXlJbjnDAifs_67K0oDjtw.jpeg',credit:'Warren County protest photograph, via Timeline/Medium',source:'https://www.usccr.gov/files/pubs/envjust/ch2.htm',scene:'Residents are protesting a PCB landfill. Follow the evidence before deciding what it proves.',clues:['The selected community was predominantly Black and economically disadvantaged.','Residents worried about environmental and groundwater risks.','The waste-site decision was contested; a court did not find intentional race discrimination proven in the case.'],mode:'sort',prompt:'Classify the four claims. Which are documented facts, and which go beyond what this case alone proves?',opts:['The site was in a predominantly Black community.','Residents protested the siting decision.','Every official admitted choosing the site because of race.','This single case proves every U.S. landfill was deliberately placed by race.'],correct:[0,0,1,1],reveal:'In Warren County, North Carolina, residents protested placing PCB-contaminated soil in their predominantly Black, low-income community. The controversy helped launch the environmental justice movement. The siting raised serious equity concerns, but the available case record does not prove every official acted from racial intent.',connection:'Institution: environmental planning • Inequality: who carries environmental risks and has political influence • Skill: separate documented disparities from unsupported claims.'},
{id:'kathrine',title:'The Number They Tried to Tear Off',year:'1967',category:'Gender + access to opportunities',icon:'261',image:'https://cdn.prod.website-files.com/667e874f45b06e6a2960bd2e/675c4b99cf2ab2db6b7a1fcc_675c4b2b377cb2a5c42c7735_kathrine-switzer1.webp',credit:'1967 Boston Marathon historical photograph, via The Running Week',source:'https://www.baa.org/races/boston-marathon/history',scene:'An official charges toward runner #261 during a major race. Examine what the photo reveals—and what it cannot tell you alone.',clues:['Women were not officially admitted to the Boston Marathon in 1967.','Kathrine Switzer entered and began running.','An official tried to pull off her race bib during the event.'],mode:'match',prompt:'Build the inequality explanation. Choose one tile for each slot.',slots:['Unequal rule','What happened','Opportunity blocked'],groups:[['Women were not officially admitted','All runners had identical access','A rule about shoe color'],['An official tried to remove her bib','She won first place','She refused to enter'],['Equal participation in an organized marathon','Access to a bank account','The right to vote']],correct:[0,0,0],reveal:'Kathrine Switzer entered the 1967 Boston Marathon even though women were not officially allowed. A race official tried to remove her bib. This is a visible example of institutional gender barriers in sports; women were officially admitted to the event in 1972.',connection:'Institution: organized athletics • Barrier: women excluded by participation rules • Lost opportunity: equal access to competition.'},

D%2244%22%20y%3D%22548%22%20fill%3D%22%23bcd3cb%22%20font-family%3D%22Arial%22%20font-size%3D%2215%22%3ECASE-SPECIFIC%20ILLUSTRATION%20%C2%B7%20NOT%20A%20HISTORICAL%20PHOTO%3C%2Ftext%3E%3C%2Fsvg%3E", "credit": "Case-specific illustration of Grants Pass outdoor camping and a city citation; not an archival photograph", "source": "https://www.law.cornell.edu/supremecourt/text/23-175", "scene": "A city issues fines for camping on public land. Some residents have nowhere indoors to sleep. Examine the rules and what happens when someone cannot pay.", "clues": ["The city prohibited public camping, including setting down bedding in public places. The case involved unhoused residents.", "The first violation could bring a $295 fine, rising to $537.60 if unpaid. Repeated park citations could lead to exclusion orders.", "The Supreme Court ruled in 2024 that enforcing generally applicable camping laws does not, by itself, violate the Eighth Amendment ban on cruel and unusual punishment."], "mode": "sequence", "prompt": "Reconstruct how the municipal penalties could escalate. Put the four steps in order.", "opts": ["After repeated park citations, an exclusion order may bar a person from a park.", "Someone without housing uses bedding while sleeping on public property.", "Violating an exclusion order may bring a criminal-trespass charge.", "The city's public-camping restrictions may result in a fine."], "correct": [1, 3, 0, 2], "reveal": "In Grants Pass, Oregon, public-camping rules allowed fines starting at $295, increasing when unpaid. Further park violations could lead to exclusion orders, with criminal trespass penalties for violating those orders. The city had far fewer shelter beds than unhoused residents. In 2024 the Supreme Court held that these generally applicable camping restrictions did not violate the Eighth Amendment's Cruel and Unusual Punishments Clause. The ruling did NOT decide that every fine or enforcement action was constitutional.", "connection": "Vocabulary: poverty and life chances • Institution: city law enforcement and courts • Barrier: lack of money for housing and limited shelter options • Consequence: increasing financial and legal risks."},
{id:'willow',title:'A School With Thousands of Residents',year:'1972',category:'Disability + care + government power',icon:'⌂',image:'https://img1.wsimg.com/isteam/ip/dfa42550-b66e-40fb-85c5-5f6d77b16d3e/willowbrook%20exterior%20angle%202.png',credit:'Historical Willowbrook building photograph, Remember Willowbrook',source:'https://findingaids.nysed.gov/do/771d956a-e659-522b-a072-96d02bc85bd2',scene:'A building calls itself a school. But what rights and care did its residents actually receive?',clues:['Willowbrook was a large state-run institution for people with intellectual disabilities.','Reports exposed dangerous overcrowding, neglect, and poor treatment.','Residents and families challenged conditions through activism and a class-action lawsuit.'],mode:'compare',prompt:'Select TWO facts that show a failure of institutional responsibility.',opts:['Its buildings were made of brick.','It was operated by New York State.','Residents experienced severe neglect and overcrowding.','It had a long official name.'],correct:[1,2],reveal:'Investigations and lawsuits exposed degrading conditions at Willowbrook State School. The inequality was not simply disability: people placed under state care were denied basic protections and opportunities for dignified living and education.',connection:'Institution: state residential care • Barrier: neglect and exclusion • Lost opportunity: adequate care, dignity, education and safety.'},
{id:'elpaso',title:'The Border Bathhouse Protest',year:'1917',category:'Race + immigration + gender + state power',icon:'⚑',image:'https://assets.rebelmouse.io/eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpbWFnZSI6Imh0dHBzOi8vYXNzZXRzLnJibC5tcy8zMzA5MTI3OS9vcmlnaW4uanBnIiwiZXhwaXJlc19hdCI6MTcxODc0NzM0M30.DquHdNN_nw3C8sdDEsS3mpqNksR2-K5puyResG6F0pI/img.jpg?coordinates=0%2C0%2C0%2C0&height=1500&width=2000',credit:'Period border inspection image via Luz Media (not a photograph of Carmelita Torres)',source:'https://www.tshaonline.org/handbook/entries/el-paso-bath-house-riots-1917',scene:'A teenager headed to domestic work refuses a compulsory border delousing procedure. Why were workers protesting?',clues:['Mexican crossers faced mandatory fumigation or delousing procedures.','Women reported humiliation and fears about being photographed during inspections.','Seventeen-year-old Carmelita Torres refused treatment and helped spark a protest.'],mode:'sequence',prompt:'Place the institutional chain in order.',opts:['Workers protest humiliating treatment','Officials require compulsory border delousing','Workers face loss of dignity and barriers to crossing','A young domestic worker refuses the procedure'],correct:[1,2,3,0],reveal:'In 1917, Carmelita Torres refused mandatory delousing at the El Paso border. Many Mexican women joined the protest. The case raises questions about how border power, nationality, gender, work, and public-health rules intersected.',connection:'Institution: border enforcement • Barrier: degrading mandatory procedures • Consequence: unequal bodily autonomy and barriers faced by workers.'},

const contextById={"ryan": {"where": "Kokomo, Indiana • 1985", "background": "Most seventh graders start the year by walking into a classroom. Ryan White, an Indiana teenager with hemophilia, had received a blood product that carried HIV. At the time, fear and false information about AIDS were widespread. His family wanted him to attend school like everyone else.", "mission": "Your job: find out what the school decided, how that compared with other students, and which evidence shows unequal access—not simply illness."}, "lavender": {"where": "Washington, D.C. • 1950s", "background": "During the Cold War, federal agencies investigated employees they considered security risks. People could lose jobs they had trained for, even when their work performance was strong. A government policy encouraged investigations into employees’ private lives.", "mission": "Your job: determine which personal characteristic officials targeted, how an employment rule enforced that judgment, and what losing a job could mean for someone’s future."}, "warren": {"where": "Warren County, North Carolina • 1982", "background": "Officials needed a place to bury soil contaminated by PCBs, chemicals linked to serious environmental health concerns. They selected a rural county where many residents were Black and had limited economic resources. Residents organized to challenge the decision.", "mission": "Your job: investigate who would live near the waste, who had the power to choose the site, and what the available evidence can—and cannot—prove about discrimination."}, "kathrine": {"where": "Boston, Massachusetts • 1967", "background": "The Boston Marathon was a famous race with an established organization, registration process, and entry rules. Women regularly ran long distances, but they were not officially admitted to this event. One woman registered and arrived at the starting line.", "mission": "Your job: identify the participation rule, investigate what happened on the course, and explain how exclusion can block opportunities even when someone has the ability to compete."}, "willow": {"where": "Staten Island, New York • 1972", "background": "Some children and adults with intellectual disabilities lived in large state-run residential institutions. Families were often told these facilities would provide supervision, care, and education. Journalists and advocates began questioning what daily life was actually like inside one institution.", "mission": "Your job: compare what a state-run school was supposed to provide with documented conditions, and identify how residents’ limited power affected their treatment."}, "elpaso": {"where": "El Paso, Texas • 1917", "background": "Thousands of people crossed the U.S.–Mexico border to work, shop, or visit family. U.S. authorities imposed compulsory health inspections and delousing procedures on Mexican border crossers. One teenage worker refused the process, and a protest followed.", "mission": "Your job: identify who was subjected to these inspections, which authorities enforced them, and how immigration status and unequal government power shaped the experience."}, "oregon": {"where": "Grants Pass, Oregon • 2024", "background": "A small Oregon city is trying to regulate camping in parks and public places. Hundreds of local residents have no stable housing, and indoor shelter space is limited. City rules can issue fines when someone uses bedding while sleeping outside. The case reaches the U.S. Supreme Court.", "mission": "Investigate how a rule about public space affects people who cannot afford housing. Trace the actual penalties, then discover what the Supreme Court decided—and what it did not decide."}, "georgia": {"where": "Ocilla, Georgia • 2020–2022", "background": "A private detention center held women in federal immigration custody. The facility arranged medical appointments for people who depended on staff to access outside doctors. Complaints about gynecological care prompted a bipartisan U.S. Senate investigation.", "mission": "Compare the claims with the investigators’ actual findings. Discover where informed consent failed and how being detained, language needs, and gender influenced access to safe medical treatment."}};
const required=['ryan','lavender','warren','kathrine','oregon','willow','elpaso','georgia'];let done=new Set(),current=null,started=false,remaining=1200,timer=null,paused=false,selected=[],idx=0,matched=[],evidenceSeen=[false,false,false],showReveal=false,message='',activeBin=0;
const $=id=>document.getElementById(id),caseBy=id=>data.find(x=>x.id===id);const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
function start(){started=true;timer=setInterval(()=>{if(!paused&&remaining>0){remaining--;drawClock()}},1000);home()}function drawClock(){let el=$('clock');if(!el)return;el.textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');if(remaining===0){el.style.color='#ffa6a6';el.textContent='00:00';}let b=$('timefill');if(b)b.style.width=(remaining/1200*100)+'%'}function toggleTimer(){paused=!paused;$('pause').textContent=paused?'Resume':'Pause'}function go(id){current=id;selected=[];matched=[];idx=0;evidenceSeen=[false,false,false];showReveal=done.has(id);message='';render()}function home(){current=null;render()}
function button(s,fn,cls='secondary'){return `<button class="${cls}" onclick="${fn}">${esc(s)}</button>`}
function render(){const a=$('app');if(!started){a.innerHTML=`<section class="hero"><div><span class="tag">Eight true cases · All eight required</span><h1>THE INEQUALITY<br>FILES</h1><p class="muted">The strangest part of these stories? They actually happened.</p><p>Read a short case briefing, look at historical photographs, open evidence, solve eight different investigations, and expose how institutions affected people's opportunities. No role-play. No worksheet.</p><div class="row">${button('OPEN THE ARCHIVE →','start()','primary')}<span class="small">20-minute suggested clock · Your progress stays until you close this tab</span></div></div><div class="panel visual"><div class="stamp">CLASSIFIED</div><div class="folder">🗂️</div></div></section><div class="panel"><h3>Your mission</h3><p><b>Investigate</b> each case → <b>identify the unequal treatment</b> → <b>reveal what really happened.</b> All eight investigations are part of the main mission. You can pause the clock or replay any case. You can pause the clock or replay any case.</p></div>`;return}if(!current){const n=required.filter(id=>done.has(id)).length;a.innerHTML=`<div class="row between"><div><span class="tag">ARCHIVE CONTROL ROOM</span><h1>${n===8?'ALL CASE FILES SOLVED':'CHOOSE A CASE FILE'}</h1><p class="muted">${n}/8 case files solved · All eight true historical events</p></div><div>${button('Restart entire game','restart()')}</div></div><div class="progress"><div style="width:${n*12.5}%"></div></div><div class="grid">${data.filter(d=>required.includes(d.id)).map((d,i)=>`<button class="casecard ${done.has(d.id)?'done':''}" onclick="go('${d.id}')"><span class="num">CASE 0${i+1} ${done.has(d.id)?'✓ SOLVED':''}</span><strong>${esc(d.title)}</strong><span class="small">${esc(d.category)}</span></button>`).join('')}</div>${n===8?`<div class="reveal"><h2>Final finding: the pattern</h2><p>The events were different, but each involved an institution making decisions about who could work, learn, compete, live safely, or participate in public life.</p><p><b>Why this is inequality:</b> rules, stigma, unequal power and access to resources created barriers for specific groups. Sometimes the institution directly discriminated; sometimes a community challenged a policy whose effects and justification were disputed.</p><p><b>Make the connection:</b> Losing school access can affect future work. Losing a job affects money and healthcare. Being denied safe environments can affect health. Institutions are connected.</p></div>`:''}`;drawClock();return}
const d=caseBy(current);a.innerHTML=`<div class="row between"><button class="secondary" onclick="home()">← Case board</button><span class="tag">${esc(d.category)}</span></div><div class="row between" style="margin-top:17px"><div><div class="small">${done.has(d.id)?'REOPENED':'ACTIVE INVESTIGATION'} · ${d.year}</div><h2 style="margin:5px 0 0">${esc(d.title)}</h2></div><div class="small">CASE FILE · Evidence ${evidenceSeen.filter(Boolean).length}/3</div></div><div class="split" style="margin-top:18px"><div><figure class="photo" style="margin:0"><img src="${d.image}" alt="Historical photo relevant to case" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><div class="fallback">Photo unavailable offline. Use the archival source link below to see the actual record.</div><figcaption>IMAGE: ${esc(d.credit)}. Photographs need internet access.</figcaption></figure><div class="panel" style="margin-top:15px"><div class="tag">BEFORE YOU INVESTIGATE</div><h3 style="margin:10px 0 5px">The situation</h3><p class="small">${esc(contextById[d.id].where)}</p><p>${esc(contextById[d.id].background)}</p><div class="evidence" style="border-left:3px solid var(--cyan)"><strong>YOUR MISSION</strong><p style="margin:6px 0 0">${esc(contextById[d.id].mission)}</p></div></div><div class="panel" style="margin-top:15px"><h3>Investigation notes</h3><p class="muted">${esc(d.scene)}</p><p class="small">Read the background above, then open each evidence folder. These are concise historical summaries, not scans of original documents.</p><div class="steps">${d.clues.map((c,i)=>`<button class="${evidenceSeen[i]?'primary':'secondary'}" onclick="see(${i})">${evidenceSeen[i]?'✓ ':''}Evidence ${i+1}</button>`).join('')}</div>${d.clues.map((c,i)=>evidenceSeen[i]?`<div class="evidence"><strong>FILE ${i+1}</strong><div>${esc(c)}</div></div>`:'').join('')}</div><p class="small">Historical source: <a href="${d.source}" target="_blank" rel="noopener">Read the original research or archive ↗</a></p></div><div><div class="puzzle"><div class="tag">${showReveal?'CASE COMPLETE':'EVIDENCE CHALLENGE'}</div><h3>${esc(d.prompt)}</h3>${showReveal?'':evidenceSeen.every(Boolean)?puzzle(d):'<p class="muted">Open all three evidence folders to unlock this investigation.</p>'}${message?`<div class="feedback" role="status">${esc(message)}</div>`:''}</div>${showReveal?`<div class="reveal"><span class="tag">DOCUMENTED REVEAL</span><h2>What actually happened</h2><p>${esc(d.reveal)}</p><div class="evidence"><strong>THE INEQUALITY</strong><p style="margin:6px 0 0">${esc(d.connection)}</p></div><div class="row">${button('Back to case board →','home()','primary')}${button('Retry puzzle','retry()')}</div></div>`:''}</div></div>`;drawClock();}
function see(i){evidenceSeen[i]=true;render()}function puzzle(d){if(d.mode==='compare'){return `<p class="small">${selected.length}/2 selected. Click tiles to select them.</p><div class="chips">${d.opts.map((x,i)=>`<button class="chip ${selected.includes(i)?'selected':''}" onclick="choose(${i})">${esc(x)}</button>`).join('')}</div><div style="margin-top:16px">${button('Check the evidence','check()','primary')}</div>`}if(d.mode==='sequence'){return `<p class="small">Build your sequence by clicking one event at a time. Wrong order? Reset and try again.</p><div class="steps">${selected.map((i,j)=>`<span class="step">${j+1}. ${esc(d.opts[i])}</span>`).join('')}</div><div class="chips">${d.opts.map((x,i)=>`<button class="chip" onclick="seq(${i})" ${selected.includes(i)?'disabled':''}>${esc(x)}</button>`).join('')}</div><div class="row" style="margin-top:14px">${button('Undo last','undo()')}${button('Check timeline','check()','primary')}</div>`}if(d.mode==='sort'){return `<p class="small">Select a statement, then choose whether it is supported by the records or an unsupported leap.</p><div class="chips">${d.opts.map((x,i)=>`<button class="chip ${selected[i]!==undefined?'correct':''}" onclick="selectSort(${i})">${selected[i]!==undefined?'✓ ':''}${esc(x)}</button>`).join('')}</div><p class="small">${idx===-1?'Choose a statement above.':'Statement '+(idx+1)+' selected'}</p><div class="row"><button class="secondary" onclick="sortTo(0)">Documented</button><button class="secondary" onclick="sortTo(1)">Not established</button></div><div style="margin-top:12px">${button('Check classifications','check()','primary')}</div>`}if(d.mode==='match'){return `<p class="small">Choose one answer for each part of the explanation.</p>${d.slots.map((s,j)=>`<div class="evidence"><strong>${esc(s)}</strong><div class="chips">${d.groups[j].map((x,i)=>`<button class="chip ${matched[j]===i?'selected':''}" onclick="match(${j},${i})">${esc(x)}</button>`).join('')}</div></div>`).join('')}<div style="margin-top:12px">${button('Reveal my finding','check()','primary')}</div>`}return ''}
function choose(i){if(selected.includes(i))selected=selected.filter(x=>x!==i);else if(selected.length<2)selected.push(i);message='';render()}function seq(i){if(!selected.includes(i))selected.push(i);message='';render()}function undo(){selected.pop();message='';render()}function selectSort(i){idx=i;message='';render()}function sortTo(v){if(idx<0||idx>3){message='Choose a statement first.';render();return}selected[idx]=v;idx=-1;message='';render()}function match(j,i){matched[j]=i;message='';render()}
function check(){const d=caseBy(current);let ok=false;if(d.mode==='compare')ok=selected.length===2&&selected.every(x=>d.correct.includes(x));if(d.mode==='sequence')ok=selected.length===d.opts.length&&selected.every((x,i)=>d.correct[i]===x);if(d.mode==='sort')ok=[0,1,2,3].every(i=>selected[i]===d.correct[i]);if(d.mode==='match')ok=[0,1,2].every(i=>matched[i]===d.correct[i]);if(ok){done.add(d.id);showReveal=true;message='Evidence confirmed. The historical case is now unlocked.';}else{message=d.mode==='sort'?'Not quite. A documented disparity is different from proving every person’s motive. Review the evidence.':'Not quite. Look for the institution, the unequal rule or treatment, and its effect on opportunities. Try again.';}render()}
function retry(){done.delete(current);showReveal=false;selected=[];matched=[];message='';idx=-1;render()}function restart(){if(!confirm('Reset all case progress and restart the 20-minute clock?'))return;done.clear();current=null;started=false;remaining=1200;paused=false;clearInterval(timer);$('clock').textContent='20:00';render()}
