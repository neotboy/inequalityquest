<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Turn-in Dashboard</title>
<style>
:root{--navy:#19364b;--red:#a33d36;--paper:#f4efe4;--card:#fffdf8;--ink:#22313b;--muted:#536571;--line:#d8cfbd}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.5 system-ui,Segoe UI,Arial,sans-serif}main{max-width:1000px;margin:auto;padding:32px 18px 60px}
h1{font-size:clamp(2rem,4vw,3rem);line-height:1.08;color:var(--navy);margin:0 0 7px}h2{font-size:1.3rem;color:var(--navy);margin:0 0 6px}h3{color:var(--navy);margin:0 0 3px}
.eyebrow{color:var(--red);font-weight:900;text-transform:uppercase;letter-spacing:.12em;font-size:.78rem;margin:0 0 5px}.intro{color:var(--muted);margin:6px 0 17px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px;margin:14px 0;box-shadow:0 4px 12px #19364b0a}
.row,.head,.filters,.top{display:flex;align-items:center;gap:9px}.head{justify-content:space-between;align-items:flex-start;margin-bottom:18px}
label{display:block;font-weight:800;color:var(--navy);margin-bottom:6px}
input,select{min-width:0;flex:1;border:1px solid #cfc5b3;border-radius:8px;background:white;font:inherit;padding:10px 12px;color:var(--ink)}
button{border:0;border-radius:8px;background:var(--red);color:white;font:800 .95rem system-ui;padding:11px 15px;cursor:pointer}button.light{background:#e7e0d1;color:var(--navy)}button:disabled{opacity:.45;cursor:not-allowed}
.status{color:var(--muted);font-size:.9rem;margin:8px 0 0}.count{display:inline-grid;place-items:center;background:#e8e1d4;border-radius:99px;padding:1px 9px;font-size:.9rem}
.empty{background:#f4efe4;border-radius:9px;padding:18px;color:var(--muted);text-align:center}
.list{display:grid;gap:10px}.submission{border:1px solid var(--line);border-radius:11px;padding:13px;background:white}.top{justify-content:space-between;align-items:flex-start}.top p{margin:0;color:var(--muted)}time{font-size:.8rem;color:var(--muted);text-align:right}
details{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}summary{font-weight:800;color:var(--navy);cursor:pointer}dl{margin:8px 0 0}.answer{border-top:1px solid #eee8dc;padding:7px 0}.answer dt{font-weight:800;color:var(--navy)}.answer dd{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
a{color:var(--navy);font-weight:750}.countline{display:flex;justify-content:space-between;align-items:center;gap:12px}
@media(max-width:650px){main{padding:22px 13px 40px}.panel{padding:14px}.row,.filters{flex-wrap:wrap}.row input,.filters input,.filters select{flex-basis:100%}.head{flex-direction:column}.top{flex-direction:column}time{text-align:left}}
</style></head><body><main>
<header class="head"><div><p class="eyebrow">Teacher dashboard</p><h1>Class assignment turn-ins</h1><p class="intro">See student names and work from your activities.</p></div><a href="https://neotboy.github.io/inequalityquest/">← All activities</a></header>
<section class="panel"><label for="teacherCode">Teacher code</label><div class="row"><input id="teacherCode" type="password" inputmode="numeric" placeholder="Enter teacher code"><button id="loadBtn">View turn-ins</button><button class="light" id="lockBtn">Lock</button></div><p class="status" id="status" role="status" aria-live="polite">Enter the teacher code to view saved work.</p></section>
<section class="panel"><div class="countline"><div><h2>Saved work <span class="count" id="count">0</span></h2><p class="status">Each row is one student's turn-in.</p></div><button class="light" id="csvBtn" disabled>Download CSV</button></div>
<div class="filters"><input id="search" placeholder="Search student name"><select id="assignment"><option value="all">All activities</option><option value="write-the-peace-treaty">Write the Peace Treaty</option><option value="wwi-alliance-chain-reaction">WWI Alliance Chain Reaction</option><option value="pacific-case-files">Pacific Case Files</option><option value="day6-world-in-crisis">A World in Crisis (Day 6)</option><option value="day7-warning-signs">Spot the Warning Signs (Day 7)</option><option value="day8-wwii-decision-map">World War II Decision Map (Day 8)</option></select><button class="light" id="refreshBtn">Refresh</button></div>
<div id="entries" class="list"><div class="empty">Turn-ins will appear here.</div></div></section>
</main><script>
const API="https://fynn-class-assignment-submissions-20261024.neotboy.chatgpt.site/api/teacher/submissions";
const code=document.getElementById("teacherCode"),status=document.getElementById("status"),entries=document.getElementById("entries");
let allRows=[],visibleRows=[];\nconst titles={"day6-world-in-crisis":"A World in Crisis · Day 6","day7-warning-signs":"Spot the Warning Signs · Day 7","day8-wwii-decision-map":"World War II Decision Map · Day 8"};
code.value=sessionStorage.getItem("teacher-code")||"";
function safe(value){return String(value??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
async function load(){const key=code.value.trim();if(!key){status.textContent="Enter the teacher code.";return}status.textContent="Loading turn-ins…";try{const response=await fetch(API,{headers:{"X-Teacher-Key":key},cache:"no-store"});const data=await response.json();if(!response.ok)throw new Error(data.error||"Could not load turn-ins.");allRows=data.submissions||[];sessionStorage.setItem("teacher-code",key);render();status.textContent=allRows.length+" turn-in"+(allRows.length===1?"":"s")+" saved."}catch(error){allRows=[];render();status.textContent=error instanceof Error?error.message:"Could not load turn-ins."}}
function render(){const q=document.getElementById("search").value.trim().toLowerCase(),assignment=document.getElementById("assignment").value;visibleRows=allRows.filter(r=>r.studentName.toLowerCase().includes(q)&&(assignment==="all"||r.assignmentId===assignment));document.getElementById("count").textContent=allRows.length;document.getElementById("csvBtn").disabled=!visibleRows.length;if(!visibleRows.length){entries.innerHTML='<div class="empty">'+(allRows.length?"No turn-ins match that search.":"Turn-ins will appear here.")+'</div>';return}entries.innerHTML=visibleRows.map(r=>'<article class="submission"><div class="top"><div><h3>'+safe(r.studentName)+'</h3><p>'+safe(titles[r.assignmentId]||r.assignmentTitle||r.assignmentId)+'</p></div><time>'+safe(new Date(r.submittedAt).toLocaleString())+'</time></div><details><summary>View answers</summary><dl>'+Object.entries(r.answers||{}).map(([k,v])=>'<div class="answer"><dt>'+safe(k)+'</dt><dd>'+safe(typeof v==="string"?v:JSON.stringify(v))+'</dd></div>').join("")+'</dl></details></article>').join("")}
function csvCell(v){const s=typeof v==="string"?v:JSON.stringify(v??"");return '"'+s.replaceAll('"','""')+'"'}
function downloadCsv(){const rows=[["Student","Assignment","Submitted","Answers"].map(csvCell).join(","),...visibleRows.map(r=>[r.studentName,r.assignmentTitle,r.submittedAt,r.answers].map(csvCell).join(","))];const blob=new Blob([rows.join("\r\n")],{type:"text/csv;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="class-assignment-turn-ins.csv";a.click();URL.revokeObjectURL(url)}
document.getElementById("loadBtn").addEventListener("click",load);document.getElementById("refreshBtn").addEventListener("click",load);document.getElementById("search").addEventListener("input",render);document.getElementById("assignment").addEventListener("change",render);document.getElementById("csvBtn").addEventListener("click",downloadCsv);document.getElementById("lockBtn").addEventListener("click",()=>{sessionStorage.removeItem("teacher-code");code.value="";allRows=[];render();status.textContent="Dashboard locked."});
</script></body></html>
