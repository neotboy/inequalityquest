<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INEQUALITY SHOWDOWN</title><style>
:root{--bg:#0b1124;--panel:#182441;--panel2:#233354;--line:#506386;--text:#f6f8ff;--muted:#c4d2eb;--cyan:#68e9f0;--yellow:#ffd773;--pink:#f9a7be;--green:#94f3ba}*{box-sizing:border-box}body{margin:0;font:16px/1.4 system-ui,Segoe UI,sans-serif;background:radial-gradient(circle at 50% -10%,#294877,#0b1124 65%);color:var(--text)}button{font:inherit;cursor:pointer;background:#294568;border:2px solid #6b8eaa;color:white;border-radius:12px;padding:12px 14px;font-weight:700;transition:.13s}button:hover:not(:disabled){transform:translateY(-2px);border-color:var(--cyan)}button:disabled{opacity:.45;cursor:default}header{background:#0c172b;border-bottom:1px solid #425473;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:8px}.logo{font-weight:1000;letter-spacing:.12em;color:var(--cyan)}.stats{display:flex;gap:16px;font-size:14px;font-weight:700}main{max-width:1040px;margin:auto;padding:20px 16px 70px}.hero{background:linear-gradient(130deg,#253c67,#3f2664);border:1px solid #6376a0;border-radius:24px;padding:27px;position:relative;overflow:hidden}.eyebrow{font-size:12px;color:var(--yellow);letter-spacing:.18em;font-weight:900;text-transform:uppercase}h1{font-size:clamp(36px,7vw,65px);line-height:1;margin:7px 0 10px}h2{font-size:clamp(25px,4vw,36px);margin:7px 0}.sub{color:var(--muted)}.primary{background:#f8ce65;color:#15223b;border-color:#ffe5a8}.board{display:grid;grid-template-columns:1fr 250px;gap:16px;margin-top:16px}.panel{background:var(--panel);border:1px solid #607194;border-radius:18px;padding:20px}.scene{background:linear-gradient(110deg,#152341,#35476c);border:1px solid #657a9c;border-radius:15px;padding:20px;margin-bottom:16px;min-height:104px;display:flex;align-items:center;gap:15px}.scene-icon{font-size:52px}.scene-title{font-size:21px;font-weight:900}.scene-text{color:#e1e9fa}.tag{color:var(--yellow);font-weight:900;font-size:12px;letter-spacing:.07em}.challenge{font-size:clamp(21px,3vw,29px);font-weight:850;line-height:1.2;margin:12px 0 18px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.option{min-height:65px;text-align:left}.option.correct,.tile.correct{background:#235a48;border-color:var(--green)}.option.wrong,.tile.wrong{background:#623546;border-color:#ff99ae}.explain{margin-top:16px;border-radius:12px;border:1px solid #7795b7;padding:14px;background:#273a5a;font-size:15px}.next{margin-top:15px;width:100%}.progress{display:flex;gap:5px;margin-top:12px}.pip{height:8px;border-radius:10px;background:#30415f;flex:1}.pip.done{background:var(--green)}.pip.on{background:var(--yellow)}.round{padding:10px;border-bottom:1px solid #394b6b;font-size:14px;color:#c7d8f3}.round.current{color:var(--yellow);font-weight:900}.round.done{color:var(--green)}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:14px 0}.tile{border:2px solid #6b83a5;background:#294166;padding:13px;border-radius:13px;text-align:center;font-weight:800;cursor:pointer;min-height:64px;display:grid;place-items:center;user-select:none}.tile.selected{border-color:var(--yellow);background:#4d4976}.hint{font-size:14px;color:var(--muted);margin:8px 0}.slot{background:#10213e;border:2px dashed #718caf;border-radius:12px;min-height:66px;padding:12px;text-align:center;display:grid;place-items:center;cursor:pointer}.slot.filled{border-style:solid;background:#294569;color:white}.chain{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.chain .slot{min-height:95px}.chain-label{font-weight:900;color:var(--yellow);font-size:12px}.bar{height:12px;background:#2c3b59;border-radius:12px;overflow:hidden}.fill{height:100%;background:var(--cyan);transition:width .3s}.feedback{font-size:14px}.small{font-size:13px}.footer-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.pill{background:#31466c;border:1px solid #7d9ac5;border-radius:99px;padding:5px 11px;font-size:12px;font-weight:800}.win{color:var(--green)}@media(max-width:740px){.board{grid-template-columns:1fr}.side{display:none}.choices{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}.chain{grid-template-columns:1fr}.stats{gap:8px;font-size:12px}.scene{padding:14px}.scene-icon{font-size:33px}} .focus{max-width:790px;margin:16px auto}.case-head{display:grid;grid-template-columns:185px 1fr;gap:16px;align-items:stretch;margin-bottom:18px}.case-copy{display:flex;flex-direction:column;justify-content:center}.case-copy p{font-size:17px;line-height:1.45;margin:8px 0}.case-photo{width:100%;height:142px;object-fit:cover;border-radius:14px;border:1px solid #607194;background:#1c2b45}.case-illustration{height:142px;border:1px solid #6e88ae;border-radius:14px;background:radial-gradient(circle at 55% 45%,#31517e,#172640);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.case-illustration div{font-size:62px}.case-illustration span{font-size:10px;font-weight:800;color:#b6c9ea}.bottom-progress{display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:790px;margin:12px auto;color:#cad7ee;font-size:12px;font-weight:800}.bottom-progress button{padding:7px 11px;font-size:12px}.hero{max-width:790px;margin:auto;padding:20px 25px}.hero h2{margin:4px 0}.option{min-height:74px}.challenge{margin:14px 0;font-size:clamp(20px,3vw,26px)}@media(max-width:650px){.case-head{grid-template-columns:1fr}.case-photo,.case-illustration{height:145px}.hero{padding:18px}.focus{padding:16px}.bottom-progress{flex-wrap:wrap}} </style></head><body><header><span class="logo">⚡ INEQUALITY SHOWDOWN</span><div class="stats"><span id="count">ROUND 1/6</span><span id="points">★ 0</span></div></header><main id="app"></main><script>
const rounds=[{"title":"CLASS & OPPORTUNITIES","sub":"Income • wealth • life chances • global inequality","icon":"📣","intro":"Review inequality and life chances before seeing how movements respond.","items":[{"kind":"choice","s":"Families can earn similar pay but hold very different savings and property.","q":"Which difference most affects their safety net?","opts":["Their wealth","Their age","Their job title","Their popularity"],"ok":0,"why":"Wealth includes what people own minus debts. It can protect people when income stops.","pic":"💵"},{"kind":"choice","s":"Redlining restricted mortgage access in many Black neighborhoods.","q":"Which long-term inequality could this help create?","opts":["More access to banks","A larger inherited wealth gap","Equal home ownership","Fewer housing costs for everyone"],"ok":1,"why":"Restricted homeownership can limit wealth families build and pass to the next generation.","pic":"🏠"},{"kind":"choice","s":"A family has access to tutors, dependable transportation and savings.","q":"Which idea describes the opportunities these resources improve?","opts":["Work strikes","Government elections","Life chances","Social stigma"],"ok":2,"why":"Life chances describe opportunities to reach goals and avoid hardship.","pic":"🎓"},{"kind":"choice","s":"Two countries have different access to safe water, hospitals and secure jobs.","q":"What does this illustrate?","opts":["Redlining alone","A single school rule","Only personal choices","Global stratification"],"ok":3,"why":"Global stratification is unequal access to resources and power between countries.","pic":"🌍"}]},{"title":"INEQUALITY IN REAL LIFE","sub":"Ryan White • Lavender Scare • Kathrine Switzer • intersectionality","icon":"📣","intro":"Connect familiar examples to the unfair rules people challenged.","items":[{"kind":"choice","s":"Ryan White was excluded from school because of HIV stigma. His family challenged the school’s decision.","q":"What unequal opportunity were they trying to restore?","opts":["Access to in-person education","Access to college sports","Access to home loans","Access to union membership"],"ok":0,"why":"His family and supporters challenged a school rule that kept him from attending classes with other students.","pic":"🏫"},{"kind":"choice","s":"During the Lavender Scare, federal employees were investigated or fired for suspected homosexuality.","q":"What type of power shaped their careers?","opts":["An athletic rule","Federal employment policies","A healthcare bill","A school calendar"],"ok":1,"why":"Government employment policies affected income, status, and security.","pic":"💼"},{"kind":"choice","s":"Kathrine Switzer faced an attempt to remove her from the 1967 Boston Marathon. Women later gained official entry.","q":"What institutional barrier needed to change?","opts":["Rules about minimum wages","Rules excluding women from the race","Rules about hospital access","Rules restricting mortgage loans"],"ok":1,"why":"Women faced barriers to official marathon participation. Changing entry rules mattered more than one famous photograph.","pic":"🏃"},{"kind":"choice","s":"A low-income Black mother faces medical costs, long travel and unfair treatment.","q":"What helps explain how those barriers overlap?","opts":["Only her personal choices","A single test score","Global trade","Intersectionality"],"ok":3,"why":"Race, gender and class can interact with healthcare rules and resources.","pic":"🏥"}]},{"title":"POWER & ORGANIZING","sub":"Institutional inequality • who can change a rule","icon":"📊","intro":"Find who has power, then what could actually change.","items":[{"kind":"choice","s":"Redlining limited access to home loans in many Black communities. Housing advocates pushed for fair lending rules.","q":"Which institution would a fair-housing movement need to challenge?","opts":["A marathon committee","A local television studio","Mortgage lenders and housing regulators","A hospital admissions desk"],"ok":2,"why":"Housing inequality was shaped by lending and housing policies. Advocates targeted those institutional rules and practices.","pic":"🏠"},{"kind":"choice","s":"A school report shows one group receives suspensions more often.","q":"What should researchers check before claiming why this happened?","opts":["A popular rumor","Comparable behavior and how discipline rules were applied","Only the total number of students","A single student’s opinion"],"ok":1,"why":"Different outcomes call for investigation. Researchers compare similar cases and rule enforcement before identifying a cause.","pic":"📊"},{"kind":"choice","s":"A mother has insurance but no nearby clinic, paid leave, or reliable transportation. A community group wants to improve access.","q":"Which proposal targets an institutional barrier?","opts":["Tell every patient to work harder","Share a story without asking for change","Offer a new slogan for the campaign","Expand clinic access and affordable transportation"],"ok":3,"why":"Healthcare access depends on more than insurance. Movements can pressure institutions to change the services people can reach.","pic":"🏥"},{"kind":"choice","s":"A city fines people sleeping outdoors while shelter beds are limited. Residents organize to challenge the approach.","q":"Which evidence would help them show whether a proposed change worked?","opts":["How many people now have safe shelter","How many people reposted the rally","How colorful the posters were","How long the speeches lasted"],"ok":0,"why":"The goal is improved life chances: actual safe shelter and fewer harmful barriers, not publicity alone.","pic":"⛺"}]},{"title":"HOW MOVEMENTS START","sub":"Organizing • coalitions • civil disobedience","icon":"📣","intro":"How do people turn unequal treatment into organized action?","items":[{"kind":"choice","s":"Warren County residents protested a PCB-contaminated soil landfill in North Carolina.","q":"What made their response a social movement?","opts":["Residents organized together to challenge the decision","One person quietly complained to a friend","The company created a new logo","Officials changed the name of the landfill"],"ok":0,"why":"A social movement uses organized collective action over time to seek change.","pic":"🌳"},{"kind":"choice","s":"During the 1977 Section 504 sit-in, disability-rights organizers occupied a federal building.","q":"Which strategy were they using?","opts":["A consumer discount","Sustained protest and civil disobedience","A sports competition","A private investment"],"ok":1,"why":"Activists used a prolonged sit-in to put pressure on federal officials over disability protections.","pic":"♿"},{"kind":"choice","s":"Women protested humiliating border disinfection practices during the El Paso Bath Riots of 1917.","q":"Which institution did their collective action challenge?","opts":["A private sports club","Border inspection authorities","A public university library","A housing bank"],"ok":1,"why":"Their resistance was directed at the border inspection system and its treatment of people entering the United States.","pic":"🪧"},{"kind":"choice","s":"Workers at different businesses want safer conditions and fairer pay.","q":"What would help them turn separate complaints into collective power?","opts":["Keeping every complaint private","Relying only on one viral video","Changing their group name","Organizing workers and building coalitions"],"ok":3,"why":"Coalitions and worker organizing combine voices, people, and resources to pressure institutions.","pic":"✊"}]},{"title":"TACTICS & POLICY CHANGE","sub":"Lawsuits • policy reform • enforcement","icon":"⚖️","intro":"Choose what changes rules—not just headlines.","items":[{"kind":"choice","s":"Ryan White and his family contested the decision to exclude him from school.","q":"Which tactic directly challenged the school’s authority?","opts":["A legal challenge to the exclusion","A strike at a nearby factory","A boycott of sporting events","A new national holiday"],"ok":0,"why":"His family used legal action and advocacy to challenge the school’s exclusion.","pic":"🏫"},{"kind":"choice","s":"Kathrine Switzer ran the Boston Marathon in 1967; women were officially admitted in 1972.","q":"Which result reflects a change to the institution itself?","opts":["A memorable photo","Rules allowing women to officially enter","More attention from journalists","A larger audience beside the route"],"ok":1,"why":"An institutional change is a rule or practice changing, beyond temporary publicity.","pic":"🏃"},{"kind":"choice","s":"Reporting exposed mistreatment at Willowbrook State School. Families and advocates demanded changes.","q":"Which combination is most likely to turn attention into lasting reform?","opts":["More headlines, with no follow-up","A one-time donation, with no oversight","Changes to care practices plus ongoing oversight","A larger protest with no stated demands"],"ok":2,"why":"Movements need concrete institutional changes and follow-up evidence that conditions improved.","pic":"🏥"},{"kind":"choice","s":"Federal officials signed Section 504 regulations after disability-rights protests.","q":"How should organizers judge whether the win lasted?","opts":["Count only the protesters","Measure the length of the sit-in","Check how many posters were printed","Check whether schools and services actually became accessible"],"ok":3,"why":"Enforcement and improved access distinguish lasting change from a promise.","pic":"♿"}]},{"title":"CHANGE THE SYSTEM","sub":"Immediate help • lasting reform • real outcomes","icon":"🏆","intro":"Compare help now, lasting change and evidence of results.","items":[{"kind":"choice","s":"People affected by public-camping restrictions need safe places to sleep tonight. Advocates also want the city to change its approach.","q":"Which response addresses the immediate need, rather than the underlying policy?","opts":["Provide temporary safe shelter tonight","Change housing policy over several years","Challenge fines through a lawsuit","Organize a long-term housing coalition"],"ok":0,"why":"Temporary shelter meets an urgent need. Legal action and housing reform can address longer-term rules and access.","pic":"⛺"},{"kind":"choice","s":"A movement wants fewer people forced to sleep outside over the next several years.","q":"Which change most directly addresses a long-term barrier?","opts":["Another rally without demands","Expand access to affordable housing","A one-time celebrity post","A new hashtag for the campaign"],"ok":1,"why":"Affordable housing access targets the conditions that create the problem, not just its immediate effects.","pic":"🏘️"},{"kind":"choice","s":"Workers organize because wages are too low to cover food and rent. They want help now and better conditions later.","q":"Which pair combines immediate assistance and a collective effort for systemic change?","opts":["A press conference and a slogan","A petition and a news interview","Food support now and collective bargaining for higher wages","A one-time rally and a celebrity endorsement"],"ok":2,"why":"Food support helps with urgent needs while collective bargaining works to change pay conditions.","pic":"🥫"},{"kind":"choice","s":"A movement changes a city rule, but its promised services reach very few families.","q":"What should organizers do to evaluate success?","opts":["Declare a complete victory immediately","Judge only the size of the final rally","Stop gathering information","Track who actually receives help and push for enforcement"],"ok":3,"why":"The important test is whether policy changes improve people’s opportunities in practice.","pic":"📣"}]}];

let ri=0,qi=0,score=0,done=0,selected=null,locked=false,chain=[];let correctCount=0;let attempts=0;let firstTry=true;
const $=id=>document.getElementById(id);function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function stat(){ $('count').textContent=`ROUND ${Math.min(ri+1,6)}/6`; $('points').textContent=`★ ${score}`; }function frame(){let r=rounds[ri],item=r.items[qi];let photo=classPhotos[item.pic];$('app').innerHTML=`<div class="hero"><div class="eyebrow">ROUND ${ri+1} / 6 · ${qi+1} OF 4</div><h2>${esc(r.title)}</h2><div class="sub">${esc(r.sub)}</div><div class="progress">${rounds.map((x,i)=>`<div class="pip ${i<ri?'done':i===ri?'on':''}"></div>`).join('')}</div></div><section class="panel focus"><div class="case-head">${photo?`<img class="case-photo" src="${photo}" alt="Photograph or chart from class lecture">`:`<div class="case-illustration" role="img" aria-label="Illustration for this scenario"><div>${item.pic}</div><span>${esc(r.title)}</span></div>`}<div class="case-copy"><div class="tag">FROM OUR LESSONS · KEEP TRYING UNTIL CORRECT</div><p>${esc(item.s)}</p></div></div><div class="challenge">${esc(item.q)}</div><div id="play"></div><div id="feedback" aria-live="polite"></div></section><div class="bottom-progress"><span>★ ${score} POINTS</span><span>${done} / 24 COMPLETED</span><button onclick="restart()">↻ Restart</button></div>`;stat();locked=false;selected=null;chain=[];showChoice(item)}
function showChoice(it){const order=[0,1,2,3];for(let j=3;j>0;j--){let k=Math.floor(Math.random()*(j+1));[order[j],order[k]]=[order[k],order[j]];}it.currentOpts=order.map(i=>it.opts[i]);it.currentOk=order.indexOf(it.ok);$('play').innerHTML=`<div class="choices">${it.currentOpts.map((t,i)=>`<button class="option" id="opt${i}" onclick="answer(${i})">${esc(t)}</button>`).join('')}</div>`}
function answer(i){if(locked)return;let it=rounds[ri].items[qi],ok=i===it.currentOk;attempts++;if(!ok){firstTry=false;let btn=$('opt'+i);btn.disabled=true;btn.classList.add('wrong');$('feedback').innerHTML='<div class="explain"><strong style="color:var(--yellow)">Not quite — try another answer.</strong><p style="margin:7px 0">Think about what the example shows. You must find the correct answer to continue.</p></div>';return}locked=true;score+=firstTry?100:60;correctCount++;done++;document.querySelectorAll('.option').forEach((o,j)=>{o.disabled=true;if(j===it.currentOk)o.classList.add('correct')});showFeedback(true,it.why)}
function showFeedback(ok,why){$('feedback').innerHTML=`<div class="explain"><strong style="color:${ok?'var(--green)':'var(--yellow)'}">${ok?'✓ Nailed it!':'↻ Review the key idea'}</strong><p style="margin:7px 0">${esc(why)}</p></div><button class="primary next" onclick="next()">${ri===5&&qi===3?'See my results →':'Next challenge →'}</button>`;stat()}
function next(){attempts=0;firstTry=true;qi++;if(qi>=rounds[ri].items.length){ri++;qi=0}if(ri>=rounds.length)return finish();frame()}
function showChain(it){$('play').innerHTML=`<div class="hint">Tap a card, then tap where it belongs.</div><div class="cards" id="tiles">${[2,0,1].map(i=>`<div class="tile" role="button" tabindex="0" id="piece${i}" onclick="selectPiece(${i})" onkeydown="if(event.key==='Enter')selectPiece(${i})">${esc(it.pieces[i])}</div>`).join('')}</div><div class="chain">${it.labels.map((l,i)=>`<div class="slot" onclick="slot(${i})" id="slot${i}"><div><div class="chain-label">${l}</div><div id="slottext${i}" class="small">Tap to place</div></div></div>`).join('')}</div><div class="footer-actions"><button onclick="chain=[];showChain(rounds[ri].items[qi])">↻ Reset pieces</button><button class="primary" id="check" disabled onclick="checkChain()">Check chain →</button></div>`}
function selectPiece(i){if(locked||chain.includes(i))return;selected=i;document.querySelectorAll('.tile').forEach(x=>x.classList.remove('selected'));$('piece'+i).classList.add('selected')}
function slot(i){if(locked)return;if(chain[i]!==undefined){let old=chain[i];delete chain[i];$('piece'+old).style.opacity='1';$('slottext'+i).textContent='Tap to place';$('slot'+i).classList.remove('filled')}if(selected===null)return;let other=chain.indexOf(selected);if(other>=0){delete chain[other];$('slottext'+other).textContent='Tap to place';$('slot'+other).classList.remove('filled')}chain[i]=selected;$('slottext'+i).textContent=rounds[ri].items[qi].pieces[selected];$('slot'+i).classList.add('filled');$('piece'+selected).style.opacity='.35';selected=null;document.querySelectorAll('.tile').forEach(x=>x.classList.remove('selected'));$('check').disabled=![0,1,2].every(j=>chain[j]!==undefined)}
function checkChain(){if(locked)return;let ok=[0,1,2].every(j=>chain[j]===j);attempts++;if(!ok){firstTry=false;$('feedback').innerHTML='<div class="explain"><strong style="color:var(--yellow)">The chain is not quite right. Try again.</strong><p style="margin:7px 0">Start with the unequal rule, then the response, then the result.</p></div>';selected=null;chain=[];showChain(rounds[ri].items[qi]);return}locked=true;done++;correctCount++;score+=firstTry?150:90;document.querySelectorAll('.tile').forEach(x=>x.style.pointerEvents='none');showFeedback(true,rounds[ri].items[qi].why)}
function restart(){ri=0;qi=0;score=0;done=0;correctCount=0;firstTry=true;attempts=0;frame()}
function finish(){$('app').innerHTML=`<section class="hero"><div class="eyebrow">Mission complete</div><h1>SHOWDOWN FINISHED!</h1><p class="sub">You reviewed inequality, how people organize to challenge institutions, and what proves real change.</p><div style="font-size:54px;font-weight:1000;color:var(--yellow)">★ ${score}</div><p>You completed all 24 challenges. Wrong answers required another try.</p><button class="primary" onclick="restart()">Play again to beat your score ↻</button></section><div class="panel" style="margin-top:16px"><h2>Remember this for your summative</h2><p><strong>Explain the inequality → name the institution or rule → show how opportunities changed → compare responses → say what evidence would prove improvement.</strong></p><p class="sub">Your review is complete. You can replay any time.</p></div>`; $('count').textContent='COMPLETE';$('points').textContent=`★ ${score}`}
frame();
</script></body></html>
