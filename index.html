<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Social Studies Activities</title>
<style>
:root{--navy:#19364b;--red:#a33d36;--paper:#f4efe4;--card:#fffdf8;--ink:#22313b;--muted:#536571;--line:#d8cfbd}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.5 system-ui,Segoe UI,Arial,sans-serif}
main{max-width:1100px;margin:auto;padding:28px 16px 60px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:6px}
h1{font-size:clamp(1.9rem,4vw,2.7rem);line-height:1.08;color:var(--navy);margin:0}
.eyebrow{color:var(--red);font-weight:900;text-transform:uppercase;letter-spacing:.12em;font-size:.78rem;margin:0 0 4px}
.teacher{background:var(--navy);color:#fff;text-decoration:none;font-weight:800;border-radius:9px;padding:10px 14px}
.intro{color:var(--muted);margin:6px 0 18px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:0;cursor:pointer;font:800 1rem system-ui;background:#e7e0d1;color:var(--navy);border-radius:10px 10px 0 0;padding:11px 18px}
.tab[aria-selected=true]{background:var(--navy);color:#fff}
.tab:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #2b6cb0;outline-offset:2px}
.panel{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--navy);border-radius:0 14px 14px 14px;padding:18px}
h2{font-size:1.05rem;color:var(--red);text-transform:uppercase;letter-spacing:.06em;margin:18px 0 8px}
h2:first-child{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.card{display:block;background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px 14px;text-decoration:none;color:var(--ink)}
.card:hover{border-color:var(--navy);box-shadow:0 3px 10px #19364b14}
.card strong{display:block;color:var(--navy);font-size:1.02rem;line-height:1.25}
.card small{color:var(--muted)}
details{margin-top:18px}
summary{cursor:pointer;color:var(--muted);font-weight:700}
details .grid{margin-top:10px}
details .card{opacity:.85}
</style>
</head>
<body>
<main>
<header>
  <div><p class="eyebrow">Social Studies</p><h1>Class activities</h1></div>
  <a class="teacher" href="teacher-submissions/">Teacher dashboard →</a>
</header>
<p class="intro">Pick your class, then open the activity your teacher assigned.</p>

<div class="tabs" role="tablist" id="tabs"></div>
<section class="panel" role="tabpanel" id="panel"></section>
</main>

<script>
// HOW TO ADD SOMETHING NEW: copy a line in the right class, then change the title, the folder (link), and the note.
// group: "Games & activities", "Readings", or "Slides". Put old versions in "Older versions".
const CLASSES = {

    ["Games & activities", "Day 2 · The Great Hanoi Rat Hunt", "day-2-hanoi/", "Reading checks"],
    ["Games & activities", "Day 3 · Pacific Case Files", "pacific-case-files/", "Japan & U.S. expansion"],
    ["Games & activities", "Day 3 · Power Race!", "world-history/power-race/", "Build a world power"],
    ["Games & activities", "Colonization Case Files", "world-history/colonization-case-files/", "Investigation"],

    ["Games & activities", "Day 6 · A World in Crisis", "day6-world-in-crisis/", "5 decisions and explanations"],
    ["Games & activities", "Day 8 · WWII Decisions & Warning Signs", "day8-wwii-decision-map/", "Two parts, one turn-in"],
    ["Readings", "Day 6 · Anne Frank Diary", "day6-anne-frank-reading/", "Pages 7–14"],

    ["Older versions", "Spot the Warning Signs", "day7-warning-signs/", "Now part of Day 8"],
    ["Older versions", "Anne Frank Quick Write", "day9-anne-frank-quick-write/", "Not on the dashboard"],
    ["Older versions", "Divide Africa: The Border Game", "world-history/divide-africa/", ""],
    ["Older versions", "The Great Hanoi Rat Hunt (reading version)", "world-history/great-hanoi-rat-hunt/", ""]

  "sociology": { name: "Sociology", items: [
    ["Readings", "Day 1 · What Is Sociology?", "sociology/day-1-reading/", ""],
    ["Readings", "Day 2 · The Sociological Imagination", "sociology/day-2-sociological-imagination/", ""],
    ["Readings", "Day 3 · Origins and Founders", "sociology/day-3-founders/", ""],
    ["Readings", "Day 4 · Sociological Perspectives", "sociology/day-4-perspectives/", ""],
    ["Readings", "Day 7 · Ethics in Research", "sociology/day-7-research-ethics/", ""],
    ["Readings", "Graphic Novel Readings", "sociology/graphic-readings/", ""],
    ["Games & activities", "Day 4 · Theory Casebook", "day-4-theory-casebook/", "Apply three theories to real cases"],
    ["Games & activities", "Stanford Prison Study Field Lab", "science/scientific-method-sos/", "Scientific method"],
    ["Games & activities", "Escape from Seahaven", "sociology-ethics-review/", "Research ethics review"],
    ["Games & activities", "Unit 2 · Day 1 · First Shift", "sociology/unit2-day1-first-shift/", "Status, roles, norms & institutions"],
    ["Games & activities", "Unit 2 · Day 2 · The Arrival: A New Culture", "sociology/arrival-culture/", "Culture & socialization"],
    ["Games & activities", "Power & Social Stratification Quest", "power-quest/", "The original inequality game"],
    ["Games & activities", "Inequality Quest: The City Is Rigged", "street-level.html", "Stratification"],
    ["Games & activities", "Inequality Quest: City Under Pressure", "reforged.html", "Stratification"],
    ["Games & activities", "Life Chances", "life-chances.html", "Stratification"],
    ["Games & activities", "Life Chances: Play Your Life", "life-city.html", "Stratification"],
    ["Games & activities", "Life Race: Unequal Starting Line", "life-race/", "Stratification"],
    ["Games & activities", "The Inequality Files", "inequality-files/", "Detective game"],
    ["Games & activities", "Hidden History: The Inequality Files", "hidden-history/", "Real-history investigation"],
    ["Games & activities", "Inequality Showdown", "inequality-showdown/", "Competition"]
  ]},
  "government": { name: "Government", items: [
    ["Games & activities", "Unit 2 · Day 1 · The Feed", "civics/unit2-day1-the-feed/", "Where political beliefs come from"],
    ["Games & activities", "Founders' Defense", "civics/civics-test-s1-founders-defense/", "Friday 1 · Civics test practice"],

    ["Games & activities", "You Are the Government", "civics/you-are-the-government-v2/", "Classroom simulation"],

    ["Games & activities", "Government Arcade", "civics/day2-government-arcade/", "Friday 2"],
    ["Games & activities", "Pixel Town: Civic Quest", "civics/pixel-town-day3-game/", "Day 3"],
    ["Games & activities", "The 1776 Files", "civics/friday4-1776-files-game/", "Friday 4"],
    ["Games & activities", "1776 Files: Evidence Lab", "civics/friday4-1776-evidence-lab/", "Friday 4"],
    ["Games & activities", "The 1800s Express", "civics/friday5-1800s-express-game/", "Friday 5"],
    ["Readings", "Democracy Visualized", "civics/democracy-visualized/", "Graphic reading"],
    ["Slides", "Constitution: Teaching Slides", "civics/constitution-teaching-v4/", ""],
    ["Slides", "Pixel Town: Day 3 Briefing", "civics/pixel-town-day3-presentation/", ""],
    ["Slides", "The 1776 Files: Historical Artwork", "civics/friday4-1776-illustrated-presentation/", ""],
    ["Slides", "The 1800s: Presentation", "civics/friday5-1800s-presentation/", ""],
    ["Older versions", "You Are the Government (first version)", "civics/day2-classroom-crisis/", ""],
    ["Older versions", "Missing Constitution: Teaching Lecture", "civics/constitution-classroom-lecture/", ""],
    ["Older versions", "Missing Constitution: Slides", "civics/constitution-lecture/", ""]
  ]}
};
const ORDER = ["Games & activities", "Readings", "Slides"];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const card = ([, t, href, note]) => `<a class="card" href="${esc(href)}"><strong>${esc(t)}</strong>${note ? `<small>${esc(note)}</small>` : ""}</a>`;
let current = location.hash.slice(1);
try { if (!CLASSES[current]) current = localStorage.getItem("hub-class") || ""; } catch (e) {}
if (!CLASSES[current]) current = "us-history";

function show(key) {
  current = key;
  try { localStorage.setItem("hub-class", key); } catch (e) {}
  history.replaceState(null, "", "#" + key);
  document.getElementById("tabs").innerHTML = Object.entries(CLASSES).map(([k, c]) =>
    `<button class="tab" role="tab" aria-selected="${k === key}" data-k="${k}">${c.name}</button>`).join("");
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => show(b.dataset.k));
  const items = CLASSES[key].items;
  let html = ORDER.map(g => { const list = items.filter(i => i[0] === g); return list.length ? `<h2>${g}</h2><div class="grid">${list.map(card).join("")}</div>` : ""; }).join("");
  const old = items.filter(i => i[0] === "Older versions");
  if (old.length) html += `<details><summary>Older versions (${old.length})</summary><div class="grid">${old.map(card).join("")}</div></details>`;
  document.getElementById("panel").innerHTML = html;
}
show(current);
</script>
</body>
</html>
